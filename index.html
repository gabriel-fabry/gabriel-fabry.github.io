    // renumerotation, les dimensions des images decalees ne valent
    // plus rien -- elles seront re-mesurees a la prochaine visite.
    function carteAbsenteAccueil(num) {
      if (!paquetAccueil) return;
      const ancienMax = paquetAccueil.max;
      for (let k = num; k <= ancienMax; k++) {
        delete dimsAccueil[nomImageAccueil(k)];
      }
      enregistrerDimsAccueil();
      paquetAccueil.reste =
        paquetAccueil.reste.filter(function (n) { return n !== num; });
      if (num <= paquetAccueil.max) {
        paquetAccueil.max = num - 1 > 0 ? num - 1 : 0;
      }
      if (paquetAccueil.derniere === num) paquetAccueil.derniere = null;
      totalAccueil = paquetAccueil.max;
      sauvegarderPaquetAccueil();
    }
    function tirerImageAccueil(total) {
      totalAccueil = total;
      accueilTire = true;
      preparerPaquetAccueil(total);
      // Sur MOBILE, la photo DU DESSUS n'est jamais HORIZONTALE :
      // on ne tire que parmi les images VERTICALES (elles seront
      // de toute faÃ§on recadrÃ©es en 5 x 7 par chargerEtDessiner).
      // La photo D'EN-DESSOUS, elle, peut Ãªtre horizontale : le
      // grattage la dÃ©couvre, aucune contrainte de taille pour
      // elle. La frontiÃ¨re mobile est la mÃªme que la mise en page
      // (max-width: 760px).
      const mobile = !!(window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches);
      // RATIO EXTREME : une photo tres allongee (ex. accueil00176
      // avant recadrage) s'affichait en mini-bandeau degenere et
      // faisait deborder la photo de dessous sur le cote. On ne
      // tire jamais une image plus large que 2,5 fois sa hauteur
      // (ni plus haute que 2,5 fois sa largeur) : ni banniere, ni
      // tour de Pise. Dimensions inconnues : on garde (la sonde
      // les remplira). Si TOUTES les images sont extremes, on ne
      // bloque pas l'accueil pour autant.
      const ratioAcceptable = function (n) {
        const d = dimsAccueil[nomImageAccueil(n)];
        if (!d) return true;
        const r = d.l / d.h;
        return r <= 2.5 && r >= 1 / 2.5;
      };
      const toutes = [];
      for (let n = 1; n <= total; n++) {
        if (ratioAcceptable(n)) toutes.push(n);
      }
      if (toutes.length === 0) {
        for (let n = 1; n <= total; n++) toutes.push(n);
      }
      let pool = toutes;
      if (mobile) {
        const verticales = toutes.filter(function (n) {
          const d = dimsAccueil[nomImageAccueil(n)];
          return !d || d.h >= d.l;   // dimensions inconnues : on garde
        });
        if (verticales.length > 0) pool = verticales;
      }
      // Deux cartes de suite dans la mÃªme file : celle DU DESSUS,
      // puis celle que le grattage dÃ©couvrira. S'il n'y a qu'une
      // image au dossier, la photo du dessous est la mÃªme que celle
      // du dessus (effet neutralisÃ©, comme avant).
      const numDessus = tirerCarteAccueil(pool);
      const numDessous = tirerCarteAccueil(toutes);
      photoNumDessus = numDessus;
      photoNumDessous = numDessous;
      sauvegarderPaquetAccueil();
      // RENDEZ-VOUS : les deux nouvelles photos partent en
      // parallele ; l affichage ne bascule qu une fois les deux
      // pretes (voir finaliserEchangeAccueil).
      echangeEnAttente = true;
      nouveauDessusPret = false;
      nouveauDessousPrete = false;
      photo.src = nomImageAccueil(numDessus);
      chargerNouvelleDessous(nomImageAccueil(numDessous));
    }
    function finaliserEchangeAccueil() {
      if (!nouveauDessusPret || !nouveauDessousPrete) return;
      echangeEnAttente = false;
      nouveauDessusPret = false;
      nouveauDessousPrete = false;
      reinitialiserPhysique(); // le monticule s en va AVEC l ancienne photo
      const urlDessous = srcDessousAttente;
      srcDessousAttente = null;
      chargerEtDessiner(); // recouvre les trous de l ancien grattage
      if (urlDessous) {
        // deja pre-chargee et decodee : bascule instantanee,
        // dans la meme frame que le redraw du canvas
        imgDessous.src = urlDessous;
        imgDessous.style.visibility = "visible";
      }
    }
    function chargerNouvelleDessous(url) {
      srcDessousAttente = url;
      const precharge = new Image();
      precharge.decoding = "async";
      precharge.onload = function () {
        if (srcDessousAttente !== url) return; // tirage plus recent en cours
        if (photoNumDessous !== null) {
          dimsAccueil[url] =
            { l: precharge.naturalWidth, h: precharge.naturalHeight };
          enregistrerDimsAccueil();
        }
        nouveauDessousPrete = true;
        finaliserEchangeAccueil();
      };
      precharge.onerror = function () {
        if (srcDessousAttente !== url) return;
        // photo de dessous absente (supprimee du dossier) : purge
        // de la carte, puis neutralisation -- la dessous prend la
        // meme image que le dessus, effet annule, sans toucher a
        // l affichage en cours.
        if (photoNumDessous !== null) {
          const num = photoNumDessous;
          photoNumDessous = null;
          carteAbsenteAccueil(num);
        }
        srcDessousAttente = photo.src;
        nouveauDessousPrete = true;
        finaliserEchangeAccueil();
      };
      precharge.src = url;
    }
    function sonderAccueil(debut, fin) {
      // restants est compte d'avance : le lot est clos quelle que soit
      // l'ordre dans lequel les sondes repondent (rapide ou pas)
      let restants = fin - debut + 1;
      let premiereRatee = fin + 1;
      const sondeTerminee = function (num, ok) {
        if (!ok && num < premiereRatee) premiereRatee = num;
        restants--;
        if (restants > 0) return;
        if (premiereRatee > fin) {
          // tout le lot existe : premier affichage DES MAINTENANT
          // (nouveau visiteur -- un visiteur regulier a deja ete
          // servi par le tirage immediat), puis comptage du lot
          // suivant en arriere-plan, sans jamais redessiner
          if (!accueilTire) tirerImageAccueil(fin);
          sonderAccueil(fin + 1, fin + LOT_SONDES);
          return;
        }
        const total = premiereRatee - 1;
        enregistrerDimsAccueil();
        if (total > 0) {
          if (!accueilTire) tirerImageAccueil(total);
          else actualiserTotalAccueil(total);
        } else if (!accueilTire) {
          photo.src = src; // aucune image numerotee : image par defaut
          imgDessous.src = src;
          accueilTire = true;
        }
      };
      for (let n = debut; n <= fin; n++) {
        (function (num) {
          const dConnues = dimsAccueil[nomImageAccueil(num)];
          if (dConnues) {
            // dimensions deja connues (cache local de 7 jours) :
            // AUCUNE requete reseau, la sonde repond sur-le-champ
            sondeTerminee(num, true);
            return;
          }
          const sonde = new Image();
          sonde.onload = function () {
            dimsAccueil[nomImageAccueil(num)] =
              { l: sonde.naturalWidth, h: sonde.naturalHeight };
            sondeTerminee(num, true);
          };
          sonde.onerror = function () { sondeTerminee(num, false); };
          sonde.src = nomImageAccueil(num);
        })(n);
      }
    }
    // VISITEUR REGULIER : le paquet persiste (localStorage ou cookie)
    // sait deja combien d images existent -- premiere photo servie
    // IMMEDIATEMENT, sans un seul aller-retour reseau. Les sondes
    // qui suivent ne decouvrent que les images AJOUTEES depuis la
    // derniere visite (et re-mesurent les dimensions expirees) :
    // elles etendent la file en arriere-plan, jamais de redessin.
    paquetAccueil = chargerPaquetAccueil();
    if (paquetAccueil && paquetAccueil.max > 0) tirerImageAccueil(paquetAccueil.max);
    // Nouveau visiteur : la premiere photo apparait des que le
    // premier lot de sondes a repondu (voir sonderAccueil).
    sonderAccueil(1, LOT_SONDES);

    let estEnTrainDeCliquer = false;
    let precedentGrattage = null; // point precedent, pour tracer un trait continu
    let griffeAttendue = null;    // au plus une griffe par image affichee

    function gratterEtEjecter(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const echelleX = canvas.width / rect.width;
      const echelleY = canvas.height / rect.height;

      const x = (clientX - rect.left) * echelleX;
      const y = (clientY - rect.top) * echelleY;

      // Version mobile ou desktop : meme frontiere que la mise en
      // page (max-width: 760px), evaluee a chaque geste pour suivre
      // une rotation d'ecran ou un redimensionnement de fenetre.
      const taillePinceau = (window.matchMedia && window.matchMedia("(max-width: 760px)").matches)
        ? PINCEAU_TAILLE_MOBILE
        : PINCEAU_TAILLE_DESKTOP;
      const rayonPinceau = Math.min(canvas.width, canvas.height) * taillePinceau;

      if (photoData) {
        const pBuffer = photoData.data;
        const nbParticules = 10;

        for (let k = 0; k < nbParticules; k++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.pow(Math.random(), 1.8) * rayonPinceau;
          const px = Math.floor(x + Math.cos(angle) * r);
          const py = Math.floor(y + Math.sin(angle) * r);

          if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
            const index = (py * canvas.width + px) * 4;
            const alpha = pBuffer[index + 3];

            if (alpha > 0) {
              const hexColor = "#" + (
                (1 << 24) +
                (pBuffer[index] << 16) +
                (pBuffer[index + 1] << 8) +
                pBuffer[index + 2]
              ).toString(16).slice(1);

              // Le pixel arrachÃ© tombe et grossit le monticule en bas de l'image
              if (!tasActif) initialiserTas(canvas);
              creerParticuleTas(tasDebord + px / echelleX, py / echelleY, hexColor);
            }
          }
        }
      }

      // Pinceau doux : un seul degrade radial (centre a l'origine),
      // deplace par translate pour chaque touche. Tous les bords sont
      // fondus : aucune trace ronde nete, meme en deplacant vite le doigt.
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rayonPinceau);
      grad.addColorStop(0, "rgba(0,0,0,1)");
      grad.addColorStop(0.5, "rgba(0,0,0,0.6)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;

      const tampon = function (cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, rayonPinceau, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      // Trait continu : on repasse sur tout le segment entre le point
      // precedent et le point actuel, pour ne pas laisser de trous.
      if (precedentGrattage) {
        const dx = x - precedentGrattage.x;
        const dy = y - precedentGrattage.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        // Plafond : meme un tres grand geste rapide reste fluide
        const pas = Math.min(12, Math.max(1, Math.ceil(dist / (rayonPinceau * 0.5))));
        for (let i = 0; i <= pas; i++) {
          const t = i / pas;
          tampon(precedentGrattage.x + dx * t, precedentGrattage.y + dy * t);
        }
      } else {
        tampon(x, y);
      }

      ctx.restore();
      precedentGrattage = { x: x, y: y };
    }

    // CLIC DROIT : pinceau de REPARATION. Il remet la photo d'origine
    // la ou elle a ete grattee (meme taille et meme bord doux que le
    // grattage). Il ne touche PAS au monticule de pixels.
    let tamponRep = null;
    function reparer(clientX, clientY) {
      if (!photoOrig) return;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      const taille = (window.matchMedia && window.matchMedia("(max-width: 760px)").matches)
        ? PINCEAU_TAILLE_MOBILE : PINCEAU_TAILLE_DESKTOP;
      const rayon = Math.min(canvas.width, canvas.height) * taille;
      const cote = Math.ceil(rayon * 2) + 2;
      if (!tamponRep) tamponRep = document.createElement("canvas");
      if (tamponRep.width !== cote) { tamponRep.width = cote; tamponRep.height = cote; }
      const tg = tamponRep.getContext("2d");
      const poser = function (cx, cy) {
        const ox = Math.round(cx - cote / 2);
        const oy = Math.round(cy - cote / 2);
        tg.globalCompositeOperation = "source-over";
        tg.clearRect(0, 0, cote, cote);
        const grad = tg.createRadialGradient(cote / 2, cote / 2, 0, cote / 2, cote / 2, rayon);
        grad.addColorStop(0, "rgba(0,0,0,1)");
        grad.addColorStop(0.5, "rgba(0,0,0,0.6)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        tg.fillStyle = grad;
        tg.fillRect(0, 0, cote, cote);
        // la photo d'origine n'est gardee que la ou le pinceau passe
        tg.globalCompositeOperation = "source-in";
        tg.drawImage(photoOrig, ox, oy, cote, cote, 0, 0, cote, cote);
        ctx.drawImage(tamponRep, ox, oy);
      };
      if (precedentGrattage) {
        const dx = x - precedentGrattage.x;
        const dy = y - precedentGrattage.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const pas = Math.min(12, Math.max(1, Math.ceil(dist / (rayon * 0.5))));
        for (let i = 0; i <= pas; i++) {
          poser(precedentGrattage.x + dx * i / pas, precedentGrattage.y + dy * i / pas);
        }
      } else {
        poser(x, y);
      }
      precedentGrattage = { x: x, y: y };
    }
    canvas.addEventListener("contextmenu", function (e) { if (REPARATION_CLIC_DROIT) e.preventDefault(); });

    canvas.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && !(e.button === 2 && REPARATION_CLIC_DROIT)) return;  // ni molette ni autres boutons
      modeReparation = (e.button === 2);
      estEnTrainDeCliquer = true;
      precedentGrattage = null;
      // L'instantane des pixels est relu seulement ici, au moment ou la
      // main part : plus jamais pendant ou a la fin du geste.
      if (photoSale) actualiserPhotoData();
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      if (modeReparation) reparer(e.clientX, e.clientY);
      else gratterEtEjecter(e.clientX, e.clientY);
    });

    canvas.addEventListener("pointermove", function (e) {
      if (!estEnTrainDeCliquer) return;
      // Les evenements pointermove peuvent arriver bien plus vite que
      // l'ecran ne s'affiche : on ne gratte qu'une fois par image,
      // a la derniere position connue. Le grattage reste fluide meme
      // sur telephone.
      if (griffeAttendue) {
        griffeAttendue[0] = e.clientX;
        griffeAttendue[1] = e.clientY;
        return;
      }
      griffeAttendue = [e.clientX, e.clientY];
      requestAnimationFrame(function () {
        const p = griffeAttendue;
        griffeAttendue = null;
        if (p && estEnTrainDeCliquer) {
          if (modeReparation) reparer(p[0], p[1]);
          else gratterEtEjecter(p[0], p[1]);
        }
      });
    });

    const stopperGomme = function (e) {
      if (estEnTrainDeCliquer) {
        estEnTrainDeCliquer = false;
        precedentGrattage = null;
        photoSale = true; // l'instantane sera relu au prochain geste
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    };

    canvas.addEventListener("pointerup", stopperGomme);
    canvas.addEventListener("pointercancel", stopperGomme);

    // Bouton souffle (sprites/blow.png) : pose dans la colonne de
    // gauche, sur le flanc gauche de la colline de gauche, et
    // COLLE AU BAS DE LA PHOTO (regle CSS .bouton-vent, position
    // absolute DANS le cadre : le bas de l'icone affleure le bas
    // de l'image, il defile avec elle). Le micro n'est
    // active qu'apres ce clic (permission navigateur),
    // jamais automatiquement.
    const boutonVent = document.createElement("button");
    boutonVent.type = "button";
    boutonVent.className = "bouton-vent";
    iconeVent(boutonVent);
    boutonVent.title = "Nettoyer en soufflant dans le micro";
    boutonVent.setAttribute("aria-label", "Nettoyer en soufflant dans le micro");
    boutonVent.addEventListener("click", function () {
      demarrerMicroVent(boutonVent);
    });
    cadre.appendChild(boutonVent);

    // Icone rafraichissement : tire une NOUVELLE photo d'accueil
    // au hasard, SANS recharger la page. Meme regle
    // anti-repetition, photo de dessous retiree a nouveau,
    // grattage et monticule remis a zero. Pose JUSTE A GAUCHE de
    // l'icone souffle, son bas aligne sur le bas de la photo
    // (regle CSS .bouton-rafraichir, position absolute dans le
    // cadre, comme le souffle). Sur mobile, la regle CSS le cale
    // sur la ligne du nom du site, en haut a droite.
    function rafraichirImageAccueil() {
      // Le monticule de l ancienne photo N EST PAS nettoye ici :
      // il reste affiche jusqu a l echange des photos
      // (finaliserEchangeAccueil) -- le reload ne le fait plus
      // disparaitre net, il part avec l ancienne photo.
      photoSale = true;
      estEnTrainDeCliquer = false;
      precedentGrattage = null;
      // ANTI-BLANC : on ne touche PAS a imgDessous ici. Son ancien
      // bitmap reste affiche pendant tout le chargement ; le swap
      // n a lieu qu une fois la nouvelle dessous PRE-CHARGEE, au
      // meme moment ou le canvas est recouvert (une seule frame).
      if (totalAccueil > 0) tirerImageAccueil(totalAccueil);
      else { reinitialiserPhysique(); photo.src = src; imgDessous.src = src; }
    }
    const boutonRafraichir = document.createElement("button");
    boutonRafraichir.type = "button";
    boutonRafraichir.className = "bouton-rafraichir";
    const imgReload = document.createElement("img");
    imgReload.src = ICONE_RELOAD;
    imgReload.alt = "";
    imgReload.decoding = "async";
    boutonRafraichir.appendChild(imgReload);
    boutonRafraichir.title = "Changer la photo";
    boutonRafraichir.setAttribute("aria-label", "Changer la photo d'accueil");
    boutonRafraichir.addEventListener("click", rafraichirImageAccueil);
    // SUR MOBILE, le bouton est pose DANS L'ASIDE (le parent du
    // menu), en position absolute par le CSS : il fait partie de
    // la page, il defile avec le nom et le menu, solidaire du
    // reste -- plus aucun positionnement fixed ou sticky, plus
    // aucune faille iOS possible. Sur DESKTOP il reste dans le
    // cadre, ou sa position absolute se cale contre la colonne de
    // gauche. Le bouton est recree a chaque visite de l'accueil :
    // un retournement d'ecran redecide de sa place au prochain
    // passage. Meme seuil que le CSS : max-width 760px.
    if (window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches) {
      menu.parentNode.appendChild(boutonRafraichir);
    } else {
      cadre.appendChild(boutonRafraichir);
    }
  }

  // Remplacement d'une photo en fondu : la nouvelle image est
  // prechargee, puis un calque de l'ancienne s'efface par-dessus.
  // Commune aux series classiques, au Carnaval (duos) et a la PAO
  // (tirages). nouvelleSrc null masque l'image (duo impair).
  function remplacerFondu(cadre, imgEl, nouvelleSrc, altTexte) {
    if (!nouvelleSrc) {
      imgEl.style.display = "none";
      return;
    }
    imgEl.style.display = "block";
    // La photo change : les brulures du laser gravees sur
    // l'ancienne partent avec elle (calque chien-brulure).
    if (imgEl._chienBrulure) {
      imgEl._chienBrulure.remove();
      imgEl._chienBrulure = null;
    }
    const ancienSrc = imgEl.getAttribute("src");
    if (ancienSrc === nouvelleSrc) return;
    if (!ancienSrc || mouvementReduit.matches) {
      imgEl.src = nouvelleSrc;
      imgEl.alt = altTexte;
      return;
    }

    let fait = false;
    const appliquer = function () {
      if (fait) return;
      fait = true;

      const calque = imgEl.cloneNode();
      calque.className = "superpose";
      cadre.appendChild(calque);

      imgEl.src = nouvelleSrc;
      imgEl.alt = altTexte;

      requestAnimationFrame(function () {
        requestAnimationFrame(function () { calque.classList.add("fondu"); });
        setTimeout(function () { calque.remove(); }, 700);
      });
      calque.addEventListener("transitionend", function () { calque.remove(); });
    };

    const precharge = new Image();
    precharge.onload = appliquer;
    precharge.onerror = function () { fait = true; imgEl.src = nouvelleSrc; imgEl.alt = altTexte; };
    precharge.src = nouvelleSrc;
    if (precharge.complete) appliquer();
  }

  /* --- SÃRIES CLASSIQUES --- */
  function dessiner(serie) {
    document.title = serie.titre + " - " + SITE.nom;
    if (serie.texte) {
      const p = document.createElement("p");
      p.className = "texte";
      p.textContent = serie.texte;
      contenu.appendChild(p);
    }
    const total = serie.images ? serie.images.length : 0;
    if (total === 0) {
      const p = document.createElement("p");
      p.className = "vide";
      p.textContent = "BientÃ´t.";
      contenu.appendChild(p);
      return;
    }

    const chemin = function (n) {
      return "images/" + serie.dossier + "/" + encodeURIComponent(serie.images[n]).replace(/%23/g, '#');
    };

    const fig = document.createElement("figure");
    fig.className = "serie";

    // Ordre de defilement : lineaire partout, aleatoire pour Old fashion
    const aleatoire = estSerieAleatoire(serie);
    const historique = [0]; // dernieres images montrees, la plus recente en fin

    function tirerAleatoire() {
      // On interdit les 20 dernieres images montrees : la meme
      // image ne peut donc pas revenir avant 20 images differentes.
      const exclus = historique.slice(-20);
      let candidats = [];
      for (let n = 0; n < total; n++) {
        if (exclus.indexOf(n) === -1) candidats.push(n);
      }
      if (candidats.length === 0) {
        // Toutes les images sont encore bloquees (petite serie) :
        // on repart de zero en gardant seulement l'image en cours.
        candidats = [];
        for (let n = 0; n < total; n++) {
          if (n !== i) candidats.push(n);
        }
        historique.length = 0;
        historique.push(i);
      }
      const n = candidats[Math.floor(Math.random() * candidats.length)];
      historique.push(n);
      return n;
    }

    function avancer(sens) {
      if (aleatoire) { montrer(tirerAleatoire()); return; }
      montrer(i + sens);
    }

    const conteneur = document.createElement("div");
    conteneur.className = "zone-interactive-conteneur";

    const vitrine = document.createElement("div");
    vitrine.className = "vitrine";
