    btnGauche.setAttribute("aria-label", "Tirage précédent ou aléatoire");

    const btnDroite = document.createElement("button");
    btnDroite.type = "button";
    btnDroite.className = "zone-clic droite";
    btnDroite.setAttribute("aria-label", "Nouveau tirage aléatoire");

    conteneur.append(btnGauche, btnDroite);
    fig.appendChild(conteneur);

    let paireCourante = null;
    let pairePrecedente = null;

    function genererPaireAleatoire(paireAEviter) {
      let i1, i2;
      let tentatives = 0;
      do {
        i1 = Math.floor(Math.random() * total);
        i2 = Math.floor(Math.random() * total);
        tentatives++;
        if (tentatives > 300) break;
      } while (
        i1 === i2 ||
        (paireAEviter && (i1 === paireAEviter[0] || i1 === paireAEviter[1] || i2 === paireAEviter[0] || i2 === paireAEviter[1]))
      );
      return [i1, i2];
    }

    function montrerPaire(paire) {
      pairePrecedente = paireCourante;
      paireCourante = paire;

      const src1 = chemin(serie.images[paire[0]]);
      const src2 = chemin(serie.images[paire[1]]);

      remplacerFondu(cadre1, img1, src1, SITE.nom + ", PAO - " + serie.images[paire[0]]);
      remplacerFondu(cadre2, img2, src2, SITE.nom + ", PAO - " + serie.images[paire[1]]);
    }

    function tirageSuivant() {
      const nouvellePaire = genererPaireAleatoire(paireCourante);
      montrerPaire(nouvellePaire);
    }

    function tiragePrecedent() {
      if (pairePrecedente) {
        const p = pairePrecedente;
        pairePrecedente = null;
        montrerPaire(p);
      } else {
        tirageSuivant();
      }
    }

    btnDroite.addEventListener("click", tirageSuivant);

    btnGauche.addEventListener("click", tiragePrecedent);

    contenu.appendChild(fig);
    tirageSuivant();
  }

  function chargerPlancheTapette(src) {
    const p = { img: null, horiz: true, frames: 0, prete: false };
    const img = new Image();
    img.onload = function () {
      const w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h || w < 4 || h < 4) return;
      p.horiz = w >= h;
      const cote = p.horiz ? h : w;
      const longueur = p.horiz ? w : h;
      p.frames = Math.max(1, Math.round(longueur / cote));
      p.prete = true;
    };
    img.onerror = function () {   };
    img.src = src;
    p.img = img;
    return p;
  }

    const pct = planche.frames > 1 ? (i / (planche.frames - 1)) * 100 : 0;

  function tapetteJouer(planche, ms, x, y, boucle) {
    if (!planche.prete) return null;
    const el = creerDivTapette(planche);
    const demi = tailleDe(planche) / 2;
    el.style.left = (x - demi) + "px";
    el.style.top = (y - demi) + "px";
    conteneurJeu.appendChild(el);
    let i = 0;
    let minuteur = null;
    tapetteFrame(planche, el, 0);
    const avancer = function () {
      i++;
      if (i >= planche.frames) {
        if (boucle) i = 0;
        else { el.remove(); return; }
      }
      tapetteFrame(planche, el, i);
      minuteur = setTimeout(avancer, ms);
    };
    minuteur = setTimeout(avancer, ms);

      stop: function () {

  function tapetteJouerProgressif(planche, x, y, ecoule) {

    const pas = planche.frames > 1 ?

    ecoule = ecoule || 0;
    let i = Math.min(planche.frames - 1, Math.floor(ecoule / pas));
    tapetteFrame(planche, el, i);
    let minuteur = null;
    const avancer = function () {
      if (i + 1 >= planche.frames) return;
      i++;
      tapetteFrame(planche, el, i);
      if (i + 1 < planche.frames) minuteur = setTimeout(avancer, pas);
    };
    if (i + 1 < planche.frames) {
      minuteur = setTimeout(avancer, pas - (ecoule % pas));

  function majTextePixel(conteneur, texte) {
    if (conteneur) conteneur.replaceChildren(creerTextePixel(texte, "#111111", 8,
      conteneur === timerEl ? TAILLES_TEXTE.timer : TAILLES_TEXTE.compteur));

  // REGLAGE : POLICE PIXEL ART
  const FONT_TYPO_CARACTERES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ !1234567890";
  // REGLAGE : TAILLE DES CASES DE typo.png
  const FONT_TYPO_LARG = 7;
  const FONT_TYPO_HAUT = 8;
  const FONT_TYPO = new Image();
  FONT_TYPO.src = "sprites/typo.png";

  function creerTextePixel(texte, couleur, taille, echelle) {
    taille = taille || 8;
    echelle = echelle || 4;
    if (FONT_TYPO.complete && FONT_TYPO.naturalWidth > 0 &&
        FONT_TYPO.naturalHeight >= 4) {
      const horiz = FONT_TYPO.naturalWidth >= FONT_TYPO.naturalHeight;
      const nbCases = horiz ?
        Math.floor(FONT_TYPO.naturalWidth / FONT_TYPO_LARG) :
        Math.floor(FONT_TYPO.naturalHeight / FONT_TYPO_HAUT);
      const haut = texte.toUpperCase();
      const renduT = document.createElement("canvas");
      renduT.width = haut.length * FONT_TYPO_LARG * echelle;
      renduT.height = FONT_TYPO_HAUT * echelle;
      const tctx = renduT.getContext("2d");
      tctx.imageSmoothingEnabled = false;
      let xT = 0;
      for (let i = 0; i < haut.length; i++) {
        const idx = FONT_TYPO_CARACTERES.indexOf(haut[i]);
        if (idx >= 0 && idx < nbCases) {
          if (horiz) {
            tctx.drawImage(FONT_TYPO, idx * FONT_TYPO_LARG, 0,
              FONT_TYPO_LARG, FONT_TYPO_HAUT,
              xT, 0, FONT_TYPO_LARG * echelle, FONT_TYPO_HAUT * echelle);
          } else {
            tctx.drawImage(FONT_TYPO, 0, idx * FONT_TYPO_HAUT,
              FONT_TYPO_LARG, FONT_TYPO_HAUT,
              xT, 0, FONT_TYPO_LARG * echelle, FONT_TYPO_HAUT * echelle);
          }
        }
        xT += FONT_TYPO_LARG * echelle;
      }
      tctx.globalCompositeOperation = "source-in";
      tctx.fillStyle = couleur;
      tctx.fillRect(0, 0, renduT.width, renduT.height);
      tctx.globalCompositeOperation = "source-over";
      return renduT;
    }
    // REGLAGE : NETTETE PIXEL ART
    const SUR_ECH = 4;
    const police = "bold " + (taille * SUR_ECH) + "px 'Courier New', Courier, monospace";
    const grand = document.createElement("canvas");
    const gctx = grand.getContext("2d");
    gctx.font = police;
    const nbCols = Math.ceil(gctx.measureText(texte).width / SUR_ECH) + 4;
    const nbLignes = taille + 6;
    grand.width = nbCols * SUR_ECH;
    grand.height = nbLignes * SUR_ECH;
    gctx.font = police;
    gctx.textBaseline = "top";
    gctx.fillStyle = couleur;
    gctx.fillText(texte, 2 * SUR_ECH, 2 * SUR_ECH);
    try {
      const pxG = gctx.getImageData(0, 0, grand.width, grand.height);
      const dG = pxG.data;
      for (let i = 3; i < dG.length; i += 4) {
        dG[i] = dG[i] >= 120 ? 255 : 0;
      }
      gctx.putImageData(pxG, 0, 0);
    } catch (e) {   }
    const petit = document.createElement("canvas");
    petit.width = nbCols;
    petit.height = nbLignes;
    const pctx = petit.getContext("2d");
    pctx.imageSmoothingEnabled = true;
    pctx.drawImage(grand, 0, 0, petit.width, petit.height);
    try {
      const pxB = pctx.getImageData(0, 0, petit.width, petit.height);
      const dB = pxB.data;
      for (let i = 3; i < dB.length; i += 4) {
        dB[i] = dB[i] >= 128 ? 255 : 0;
      }
      pctx.putImageData(pxB, 0, 0);
    } catch (e) {   }

    const rendu = document.createElement("canvas");
    rendu.width = petit.width * echelle;
    rendu.height = petit.height * echelle;
    const rctx = rendu.getContext("2d");
    rctx.imageSmoothingEnabled = false;
    rctx.drawImage(petit, 0, 0, rendu.width, rendu.height);
    return rendu;
  }

  function nouvelleCibleBoss() {
    const marge = 100;
    bossCibleX = marge + Math.random() * (window.innerWidth - marge * 2);
    bossCibleY = marge + Math.random() * (window.innerHeight - marge * 2);

  function updateBoss() {
    if (bossAuSol) return;

    if (freezeBossImpact > 0) {
      freezeBossImpact--;
      return;
    }

    if (bossChute) {
      updateChuteBoss();
      return;
    }

    if (pauseBoss > 0) {
      pauseBoss--;
      return;
    }

    timerBoss++;

    const dx = bossCibleX - bossX;
    const dy = bossCibleY - bossY;
    const dist = Math.hypot(dx, dy);

    if (dist < 40 || timerBoss > 90 || Math.random() < 0.02) {
      nouvelleCibleBoss();
      timerBoss = 0;
    }

    const vitesseMax = phase2Boss ? 5.2 : 3.0;
    bossVX += (dx / (dist || 1)) * (phase2Boss ? 1.3 : 0.75);
    bossVY += (dy / (dist || 1)) * (phase2Boss ? 1.3 : 0.75);
    bossVX += (Math.random() - 0.5) * (phase2Boss ? 2.2 : 1.1);
    bossVY += (Math.random() - 0.5) * (phase2Boss ? 2.2 : 1.1);

    const vActuelle = Math.hypot(bossVX, bossVY);
    if (vActuelle > vitesseMax) {
      bossVX = (bossVX / vActuelle) * vitesseMax;
      bossVY = (bossVY / vActuelle) * vitesseMax;
    }

    bossX += bossVX;
    bossY += bossVY;

    const bord = 30;
    if (bossX < bord) { bossX = bord; bossVX *= -1; }
    if (bossX > window.innerWidth - bord) { bossX = window.innerWidth - bord; bossVX *= -1; }
    if (bossY < bord) { bossY = bord; bossVY *= -1; }
    if (bossY > window.innerHeight - bord) { bossY = window.innerHeight - bord; bossVY *= -1; }

    const angle = Math.atan2(bossVY, bossVX) * (180 / Math.PI) + 90;
    bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0) rotate(${angle}deg)`;
  }

  function frapperBoss(degats) {
    bossPV -= (degats || 1);
    actualiserBarreVie();
    if ((degats || 1) > 1) declencherScreenShake();
    else secousseCurseur();
    freezeBossImpact = 5;

    for (let i = 0; i < 12; i++) {
      creerPixelPhysique(bossX + (Math.random() - 0.5) * 30, bossY + (Math.random() - 0.5) * 30);
    }

    bossEl.classList.remove("touche");
    void bossEl.offsetWidth;
    bossEl.classList.add("touche");

    if (bossPV > 0 && bossPV <= PV_BOSS / 2 && !phase2Boss) {
      phase2Boss = true;
      bossEl.classList.add("phase2");
      pauseBoss = 120;
      declencherScreenShake();

      bossEl.classList.remove("secoue");
      void bossEl.offsetWidth;
      bossEl.classList.add("secoue");
      setTimeout(function () {
        if (bossEl) bossEl.classList.remove("secoue");
      }, 1400);
      for (let vague = 0; vague < 5; vague++) {
        setTimeout(function () {
          if (!bossEl || bossChute) return;
          for (let i = 0; i < 12; i++) {
            creerPixelPhysique(bossX + (Math.random() - 0.5) * 42, bossY + (Math.random() - 0.5) * 42);
          }
        }, vague * 260);
      }
    }

    if (bossPV <= 0) tuerBoss();

  function updateChuteBoss() {
    const sol = window.innerHeight - 32 - 21;

    if (bossY >= sol) {
      bossY = sol;
      bossChute = false;
      bossAuSol = true;
      annulerCharge();
      if (bossEl) {
        bossEl.classList.remove("phase2");
        bossEl.innerHTML = SVG_BOSS_MORT;
        bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0)`;
      }
      afficherMotFin();
      return;
    }

    bossVY = Math.min(bossVY + 0.12, 1.6);
    bossY += bossVY;
    rotationChuteBoss += vitesseRotationChute;

    bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0) rotate(${rotationChuteBoss}deg)`;
  }

  function afficherMotFin() {
    motEl = document.createElement("div");
    motEl.className = "mot-fin";
    motEl.appendChild(creerTextePixel(MOT_FIN, "#111111", 8,
      echelleMotFin(MOT_FIN, TAILLES_TEXTE.victoire)));
    conteneurJeu.appendChild(motEl);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (motEl) motEl.classList.add("visible"); });
    });

    etapeFin = "mot";
  }

  function tuerBoss() {
    for (let i = 0; i < 80; i++) {
      creerPixelPhysique(bossX + (Math.random() - 0.5) * 40, bossY + (Math.random() - 0.5) * 40);
    }
    declencherScreenShake();
    if (barreVieEl) { barreVieEl.remove(); barreVieEl = null; barreRemplieEl = null; }

    bossChute = true;
    bossVX = 0;
    bossVY = Math.max(0.5, bossVY);
    rotationChuteBoss = 0;
    vitesseRotationChute = (Math.random() < 0.5 ? -1 : 1) * (10 + Math.random() * 8);
    bossEl.classList.remove("touche");
    bossEl.classList.add("morte");
  }

  function declencherFin() {
    if (etapeFin) return;

    etapeFin = "boss";

    if (timerEl) timerEl.style.display = "none";

    bossPV = PV_BOSS;
    creerBarreVie();

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    mouches.forEach(function (m) {
      m.el.classList.remove("pose", "touchee");
      m.el.classList.add("morte");
      m.etat = "virevolte";
      m.departX = m.x;
      m.departY = m.y;
      m.cibleFinX = cx + (Math.random() - 0.5) * 50;
      m.cibleFinY = cy + (Math.random() - 0.5) * 50;
      m.progression = 0;
      m.vitesseFin = 0.012 + Math.random() * 0.018;
      m.delaiFin = Math.floor(Math.random() * 45);
    });

    bossEl = document.createElement("div");
    bossEl.className = "mouche boss";
    bossEl.innerHTML = SVG_BOSS;
    conteneurJeu.appendChild(bossEl);
    bossX = cx;
    bossY = cy;
    bossVX = 0;
    bossVY = 0;
    timerBoss = 0;
    phase2Boss = false;
    pauseBoss = 0;
    bossChute = false;
    bossAuSol = false;
    nouvelleCibleBoss();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (bossEl) bossEl.classList.add("visible"); });
    });
  }

  let zoneTapetteActive = null;

  function gererSurvolSource(e) {
    const surMenu = !!(e.target && e.target.closest && e.target.closest("aside"));
    const actif = jeuCommence && !surMenu && !bossChute && !bossAuSol;
    if (actif !== zoneTapetteActive) {
      zoneTapetteActive = actif;
      document.documentElement.classList.toggle("zone-tapette", actif);
    }

    if (barreChargeEl) positionnerBarreCharge(e.clientX, e.clientY);
    if (tapetteEl) positionnerTapette(e.clientX, e.clientY);
  }

  function demarrerCharge(e) {
    if (chargeActive) return;
    chargeActive = true;
    debutCharge = performance.now();
    reculCharge = 0;

    animChargeCreee = false;

    barreChargeEl = document.createElement("div");
    barreChargeEl.id = "barre-charge";
    remplieChargeEl = document.createElement("div");
    remplieChargeEl.id = "barre-charge-remplie";
    barreChargeEl.appendChild(remplieChargeEl);
    barreChargeEl.style.visibility = "hidden";
    conteneurJeu.appendChild(barreChargeEl);
    positionnerBarreCharge(e.clientX, e.clientY);
  }

  function positionnerTapette(x, y) {
    if (!tapetteEl) return;
    tapetteEl.style.left = (x - TAPETTE.tailleCoup2 * 0.48) + "px";
    tapetteEl.style.top = (y - TAPETTE.tailleCoup2 * 0.39) + "px";
  }

  function positionnerBarreCharge(x, y) {
    if (!barreChargeEl) return;
    barreChargeEl.style.left = (x - 24) + "px";
    barreChargeEl.style.top = (y + 24) + "px";
  }

  function annulerCharge() {
    chargeActive = false;
    if (tapetteChargeStop) { tapetteChargeStop(); tapetteChargeStop = null; }
    if (barreChargeEl) { barreChargeEl.remove(); barreChargeEl = null; }
    remplieChargeEl = null;
    if (tapetteEl) { tapetteEl.remove(); tapetteEl = null; }
    document.documentElement.classList.remove("tapette-animee");
    reculCharge = -1;
  }

  function arreterChargeVisuel(e) {
    if (barreChargeEl) { barreChargeEl.remove(); barreChargeEl = null; remplieChargeEl = null; }
    document.documentElement.classList.remove("tapette-animee");
    if (tapetteChargeStop) { tapetteChargeStop(); tapetteChargeStop = null; }
    if (tapetteEl) {
      const t = tapetteEl;
      tapetteEl = null;
      t.remove();
    }
    if (e && typeof e.clientX === "number") {
      tapetteFrappe(e.clientX, e.clientY);
    }
    reculCharge = -1;
  }

  function relacherClic(e) {
    if (!chargeActive) return;
    const chargeComplete = (performance.now() - debutCharge) >= DUREE_CHARGE;
    chargeActive = false;
    arreterChargeVisuel(e);
    if (chargeComplete) frapperCharge(e);
  }

  function frapperCharge(e) {
    if (etapeFin === "mot" || etapeFin === "defaite") return;
    if (etapeFin === "boss" && (bossChute || bossAuSol)) return;

    declencherScreenShakeFort();

    for (let o = 0; o < 3; o++) {
      setTimeout(function () {
        if (conteneurJeu) creerOndeImpact(e.clientX, e.clientY, o);
      }, o * 150);
    }

    for (let i = 0; i < 30; i++) {
      creerPixelPhysique(e.clientX + (Math.random() - 0.5) * 44, e.clientY + (Math.random() - 0.5) * 44);
    }

    if (etapeFin === "boss") {
      if (bossEl && Math.hypot(e.clientX - bossX, e.clientY - bossY) < 90) {
        frapperBoss(3);
      }
      return;
    }

    if (estEnFreeze) return;

    for (const m of mouches) {
      if (m.etat === "morte" || m.etat === "touchee") continue;
      if (Math.hypot(e.clientX - m.x, e.clientY - m.y) < 84) {
        tuerMouche(m, true);
      }
    }
  }

  function frapperMouche(e) {
    if (etapeFin === "mot" || etapeFin === "defaite") {
      if (motEl) {
        const r = motEl.getBoundingClientRect();
        if (e.clientX >= r.left - 20 && e.clientX <= r.right + 20 &&
            e.clientY >= r.top - 12 && e.clientY <= r.bottom + 12) {
          declencherScreenShake();
          reinitialiserNiveau();
        }
      }
      return;
    }

    if (etapeFin === "boss") {
      if (bossEl && !bossChute && Math.hypot(e.clientX - bossX, e.clientY - bossY) < 30) {
        frapperBoss();
      }
      if (!bossChute && !bossAuSol) demarrerCharge(e);
      return;
    }

    if (estEnFreeze) return;

    for (const m of mouches) {
      if (m.etat === "morte" || m.etat === "touchee") continue;
      if (Math.hypot(e.clientX - m.x, e.clientY - m.y) < 28) {
        tuerMouche(m);
      }
    }

    if (jeuCommence) demarrerCharge(e);
  }

  function tuerMouche(m, chargee) {
    if (etapeFin) return;

    m.etat = "touchee";
    m.el.classList.add("touchee");

    tapetteFrappe(m.x, m.y);

    if (!jeuCommence) {
      jeuCommence = true;
      demarrerHUD();
    }

    mouchesMortes++;
    majTextePixel(compteurMouchesEl, String(mouchesMortes));

    estEnFreeze = true;

    if (!chargee) secousseCurseur();

    for (let i = 0; i < 16; i++) {
      creerPixelPhysique(m.x, m.y);
    }

    setTimeout(function () {
      estEnFreeze = false;
      if (!m.el.isConnected || etapeFin) return;
      m.etat = "morte";
      m.reposeAuSol = false;
      m.el.classList.remove("touchee");
      m.el.classList.add("morte");
    }, 70);

    if (niveau >= NIVEAU_MAX) {
      declencherFin();
    } else {
      niveau++;
      creerMouche();
      creerMouche();
    }
  }

  function nouvelleCibleMouche(m) {
    const marge = 60;
    m.cibleX = marge + Math.random() * (window.innerWidth - marge * 2);
    m.cibleY = marge + Math.random() * (window.innerHeight - marge * 2);
  }

  function boucleJeu() {
    if (!estEnFreeze) {
      for (const m of mouches) updateMouche(m);
      if (bossEl) updateBoss();
    }

    if (chargeActive && remplieChargeEl) {
      const progression = Math.min(1, (performance.now() - debutCharge) / DUREE_CHARGE);
      remplieChargeEl.style.width = (progression * 100) + "%";
      if (performance.now() - debutCharge >= DELAI_BARRE_CHARGE) {
        if (barreChargeEl && barreChargeEl.style.visibility === "hidden") {
          barreChargeEl.style.visibility = "visible";
        }
        if (!animChargeCreee) {
          animChargeCreee = true;
          const animCharge = tapetteJouerProgressif(PLANCHE_COUP2,
            curseurTapetteX, curseurTapetteY,
            performance.now() - debutCharge);
          if (animCharge) {
            tapetteEl = animCharge.el;
            tapetteChargeStop = animCharge.stop;
            positionnerTapette(curseurTapetteX, curseurTapetteY);
          }
          document.documentElement.classList.add("tapette-animee");
        }
      }
      if (progression >= 1 && barreChargeEl) barreChargeEl.classList.add("chargee");

      const etape = Math.min(3, Math.floor(progression * 3));
      if (tapetteEl && etape !== reculCharge) {
        reculCharge = etape;
        tapetteEl.style.transform =
          "translate(" + (etape * 10) + "px, " + (-etape * 8) + "px) rotate(" + (etape * 16) + "deg)";
      }
    }

    idAnimJeu = requestAnimationFrame(boucleJeu);
  }

  function updateMouche(m) {
    if (!m.el) return;

    m.timerEtat++;

    if (m.etat === "vol") {
      m.el.classList.remove("pose");
      m.el.classList.add("visible");

      const dx = m.cibleX - m.x;
      const dy = m.cibleY - m.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 30 || m.timerEtat > 35 || Math.random() < 0.04) {
        nouvelleCibleMouche(m);
        m.timerEtat = 0;
        if (Math.random() < 0.15) {
          m.etat = "pose";
          m.timerEtat = 0;
          m.dureePause = (Math.random() < 0.45) ? 120 : 20 + Math.random() * 30;
        }
      }

      const vitesseMax = 6.0;
      m.vx += (dx / (dist || 1)) * 1.1;
      m.vy += (dy / (dist || 1)) * 1.1;

      m.vx += (Math.random() - 0.5) * 3.2;
      m.vy += (Math.random() - 0.5) * 3.2;

      const vActuelle = Math.hypot(m.vx, m.vy);
      if (vActuelle > vitesseMax) {
        m.vx = (m.vx / vActuelle) * vitesseMax;
        m.vy = (m.vy / vActuelle) * vitesseMax;
      }

      m.x += m.vx;
      m.y += m.vy;

      const bord = 15;
      if (m.x < bord) { m.x = bord; m.vx *= -1; }
      if (m.x > window.innerWidth - bord) { m.x = window.innerWidth - bord; m.vx *= -1; }
      if (m.y < bord) { m.y = bord; m.vy *= -1; }
      if (m.y > window.innerHeight - bord) { m.y = window.innerHeight - bord; m.vy *= -1; }

      const angle = Math.atan2(m.vy, m.vx) * (180 / Math.PI) + 90;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${angle}deg)`;
    } else if (m.etat === "pose") {
      m.el.classList.add("pose", "visible");
      m.vx = 0;
      m.vy = 0;

      const ox = (Math.random() - 0.5) * 1.5;
      const oy = (Math.random() - 0.5) * 1.5;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE + ox}px, ${m.y - DEMI_MOUCHE + oy}px, 0)`;

      if (m.timerEtat > m.dureePause) {
        m.etat = "vol";
        m.timerEtat = 0;
        nouvelleCibleMouche(m);
      }
    } else if (m.etat === "virevolte") {
      if (m.delaiFin > 0) {
        m.delaiFin--;
        return;
      }
      if (m.progression < 1) {
        m.progression = Math.min(1, m.progression + m.vitesseFin);
        const t = m.progression;
        const aise = t * t * (3 - 2 * t);
        const tour = t * Math.PI * 4;
        const amplitude = 30 * (1 - aise);
        m.x = m.departX + (m.cibleFinX - m.departX) * aise + Math.cos(tour) * amplitude;
        m.y = m.departY + (m.cibleFinY - m.departY) * aise + Math.sin(tour) * amplitude;
        m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${180 + t * 540}deg)`;
      } else {
        m.etat = "orbite";
        m.angleOrbite = Math.atan2(m.y - bossY, m.x - bossX);
        m.rayonOrbite = 50 + Math.random() * 110;
        m.vitesseOrbite = (Math.random() < 0.5 ? -1 : 1) * (0.008 + Math.random() * 0.03);
        m.bobPhase = Math.random() * Math.PI * 2;
        m.bobVitesse = 0.05 + Math.random() * 0.12;
        m.amplitudeRayon = 12 + Math.random() * 26;
        m.tangagePhase = Math.random() * Math.PI * 2;
        m.tangageVitesse = 0.08 + Math.random() * 0.2;
      }
    } else if (m.etat === "orbite") {
      m.angleOrbite += m.vitesseOrbite + (Math.random() - 0.5) * 0.05;
      m.bobPhase += m.bobVitesse;
      m.tangagePhase += m.tangageVitesse;

      if (Math.random() < 0.012) m.vitesseOrbite *= -1;
      if (Math.random() < 0.02) m.rayonOrbite = 30 + Math.random() * 140;

      const centreX = (etapeFin === "mot") ? window.innerWidth / 2 : bossX;
      const centreY = (etapeFin === "mot") ? window.innerHeight / 2 : bossY;
      const rayon = m.rayonOrbite + Math.sin(m.bobPhase) * m.amplitudeRayon;
      const cibleOrbiteX = centreX + Math.cos(m.angleOrbite) * rayon;
      const cibleOrbiteY = centreY + Math.sin(m.angleOrbite) * rayon + Math.sin(m.tangagePhase) * 12;
      m.x += (cibleOrbiteX - m.x) * 0.16;
      m.y += (cibleOrbiteY - m.y) * 0.16;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${180 + Math.sin(m.tangagePhase) * 30}deg)`;
    } else if (m.etat === "morte") {
      const sol = window.innerHeight - 41;

      if (!m.reposeAuSol) {
        m.vy += 1.8;
        m.y += m.vy;
        m.vx *= 0.98;
        m.x += m.vx;

        if (m.x < 8) m.x = 8;
        if (m.x > window.innerWidth - 8) m.x = window.innerWidth - 8;

        if (m.y >= sol) {
          m.y = sol;
          if (m.vy > 2.5) {
            m.vy = -m.vy * 0.35;
          } else {
            m.vy = 0;
            m.vx = 0;
            m.reposeAuSol = true;
          }
        }

        m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(180deg) scale(0.9)`;
      } else {
        if (m.y !== sol) {
          m.y = sol;
          m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(180deg) scale(0.9)`;
        }
      }
    }
  }

  afficher();
})();
</script>
</body>
