<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Fabry</title>
<meta name="description" content="Gabriel Fabry, photographie.">
<style>
  :root {
    --fond: #ffffff;
    --texte: #111111;
    --discret: #6b6b6b;
    --marge: 32px;
    --largeur-menu: 270px;
    --rouge: #ff1744;
    --vert: #00e676;
    --bleu: #2979ff;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    /* Fleche bleue du site, en SVG inline. Le SVG est encode en
       %XX dans son INTEGRALITE (espaces, crochets, guillemets) :
       les caracteres bruts (< > et espaces) dans un data URI
       font echouer son decodage par intermittence sur certains
       navigateurs -- le curseur retombait alors sur la fleche
       BLANCHE du systeme des qu'il s'arretait, et clignotait au
       moindre mouvement. Encode, le decodage est deterministe :
       plus de blanc, plus de clignotement. */
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%3E%3Cpolygon%20points='0,0%200,18%204.5,13.5%208,21%2011,19.5%207.5,12%2013.5,12'%20fill='%232979ff'%20stroke='%23ffffff'%20stroke-width='1.5'/%3E%3C/svg%3E") 0 0, auto;
  }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 14px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    /* MOBILE : touch-action: manipulation tue le ZOOM DOUBLE-TAP
       (le site se retrecissait un peu par accident en tapotant).
       Le grattage n'est pas touche : #canvas-accueil garde son
       propre touch-action: none. Le pincement a deux doigts reste
       possible (accessibilite). */
    touch-action: manipulation;
  }
  a, button { 
    color: inherit; 
    cursor: pointer; 
  }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--texte); outline-offset: 3px; }

  .sr-seul {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Colonne de gauche */
  aside {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--largeur-menu);
    padding: var(--marge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
    /* La colonne laisse passer les clics ; seuls les vrais
       elements interactifs du menu les captent. */
    pointer-events: none;
  }
  aside .nom,
  aside nav a,
  aside nav button { pointer-events: auto; }
  .nom {
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 40px;
    cursor: pointer;
  }
  .nom .lettre { display: inline-block; transition: color .25s ease; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin: 0 0 3px; }
  nav a, nav button {
    display: inline;
    padding: 1px 5px;
    margin: 0 -5px;
    border: 0;
    background: none;
    font: inherit;
    font-style: italic;
    color: var(--discret);
    text-align: left;
    text-decoration: none;
    transition: background-color .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  nav a[aria-current="page"] { color: var(--texte); text-decoration: underline; text-underline-offset: 3px; }
  nav button[aria-expanded="true"] { color: var(--texte); }
  nav a:hover, nav button:hover,
  nav a:active, nav button:active,
  nav a:focus-visible, nav button:focus-visible {
    background-color: var(--survol-fond, transparent);
    color: var(--survol-texte, var(--texte));
  }
  nav ul ul { margin: 3px 0 10px 14px; }
  nav ul ul[hidden] { display: none; }
  /* Plus d'écart entre les titres des séries et la section Contact */
  #menu > ul > li:last-child { margin-top: 16px; }

  /* Colonne de droite */
  main {
    margin-left: var(--largeur-menu);
    padding: var(--marge) 48px 120px var(--marge);
    max-width: calc(var(--largeur-menu) + 1180px);
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  
  main h1 { display: none !important; }
  main .texte { max-width: 60ch; margin: 0 0 32px; color: var(--discret); white-space: pre-line; }
  main figure { margin: 0 0 36px; }
  main img { display: block; max-width: 100%; max-height: 92vh; width: auto; height: auto; }
  main figure.serie img { max-height: calc(100vh - 150px); }
  .vide { color: var(--discret); margin-top: 8px; }

  /* Canvas d'Accueil destructible */
  #canvas-accueil {
    display: block;
    position: relative;
    z-index: 1;            /* au-dessus de la photo de dessous */
    /* DESKTOP : TOUTES les photos du dessus ont la MEME HAUTEUR
       -- la largeur suit le format propre de chaque image
       (aucune deformation : le ratio du canvas est conserve).
       La hauteur est calculee pour que la page d'accueil tienne
       EXACTEMENT dans l'ecran (marge du haut + photo + marge du
       bas = 100 vh) : plus AUCUN scroll residuel. Pas de
       max-width : une image tres panoramique garde sa hauteur,
       l'eventuel debordement est simplement rogne par la page
       (overflow-x masque). */
    height: calc(100vh - 2 * var(--marge));
    height: calc(100dvh - 2 * var(--marge));
    width: auto;
    cursor: grab !important;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #canvas-accueil:active {
    cursor: grabbing !important;
  }

  /* Photo revelee par le grattage, posee derriere le canvas : elle
     remplit exactement le cadre de la photo grattée (recadre au besoin) */
  .photo-dessous {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Canvas du monticule, pose DANS le cadre de la photo : Safari
     clippe les calques fixes a la zone visible au-dessus de sa
     barre du bas, mais le contenu pose dans la page s'affiche
     derriere la barre translucide, exactement comme la photo. La
     position et la taille (left, width, height) sont reglees en
     JavaScript au moment du premier grattage. */
  .tas-affichage {
    position: absolute;
    top: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Chien qui dort (planche SPRITE SHEET DOG.png, sprites 32x32,
     toutes les pages SAUF mobile) : en bas a gauche, cote colonne.
     Chaque sprite fait 32x32 : affiche en 96x96 (agrandi x3) avec
     image-rendering: pixelated pour garder des pixels nets, pas
     flous. Si le fichier manque, le chien ne s'affiche pas. */
  .chien-dort {
    position: fixed;
    left: var(--marge);
    /* Remonte de 29 px (reglage affiné a la main) : avec la photo
       d'accueil haute de 100 vh - 2 marges et les icones collees
       au bas de l'image, le chien vivait trop bas sur sa ligne
       d'avant. Pour affiner : cette seule valeur. */
    bottom: calc(var(--marge) - 11px);
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    z-index: 50;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Tremblement du chien a chaque clic pendant son sommeil */
  .chien-dort.tremble { animation: tremble-chien .3s linear; }
  @keyframes tremble-chien {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  /* Planches du chien : une seule image (SPRITE SHEET DOG.png),
     tous les sprites cote a cote. Le JavaScript choisit le sprite
     par la position du fond en pourcentage (section
     ANIMATION_CHIEN). */
  .chien-dort.chien-planche {
    background-repeat: no-repeat;
    background-size: 1700% 100%;  /* 17 sprites ; le JS reconfirme */
  }
  /* Calque du laser du chien (oeil rouge) : plein ecran, taille en
     pixels exacts reglee par le JavaScript (jamais 100vw/100vh,
     voir #canvas-explosion), il ne capte jamais les clics. */
  .chien-laser {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 51;
  }
  /* Pointeur detruit par le laser : plus aucun curseur, nulle
     part, jusqu'au prochain clic (n'importe ou). */
  html.chien-pointeur-detruit,
  html.chien-pointeur-detruit * { cursor: none !important; }
  /* Le canvas d'accueil met cursor: grab !important avec un
     selecteur d'ID, plus fort que la regle du dessus : sans ce
     rappel, le curseur detruit par le laser restait visible sur
     la photo de garde. */
  html.chien-pointeur-detruit #canvas-accueil,
  html.chien-pointeur-detruit #canvas-accueil:active { cursor: none !important; }

  /* Icone souffle : DANS LA COLONNE DE GAUCHE, a droite du chien
     qui dort, et COLLEE AU BAS DE LA PHOTO. L'icone est posee
     DANS le cadre (position absolute -- le cadre epouse
     exactement la photo grattée) : bottom: 0 cale son bas sur le
     bas DE L'IMAGE elle-meme, et l'alignement defile avec la
     photo : plus aucun decalage, quel que soit l'ecran. */
  .figure-accueil {
    position: relative;
    margin-bottom: 0;   /* pas de marge sous la figure : la page tient pile a l'ecran */
  }
  /* Page d'accueil : le gros padding du bas de main (120 px, utile
     sur les pages qui scrollent) est reduit a la marge -- la
     photo et ses marges occupent exactement 100 vh, plus aucun
     scroll inutile. La classe est posee par dessinerAccueil et
     retiree par afficher. */
  body.page-accueil main { padding-bottom: var(--marge); }
  /* Cadre qui epouse exactement la photo grattée (le figure peut
     contenir aussi l'emoji, plus bas, sur mobile) : la photo de
     dessous est rognée sur la photo du dessus, jamais au-dela */
  .cadre-accueil {
    position: relative;
    display: inline-block;
    vertical-align: bottom;
  }
  .bouton-vent {
    position: absolute;    /* DANS le cadre : bas colle au bas de la photo */
    z-index: 3;             /* au-dessus de la photo, du canvas et du monticule */
    left: calc(-24px - var(--marge));  /* colonne de gauche, comme avant */
    bottom: 0;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Icone de rafraichissement de la photo d'accueil : tire une
     NOUVELLE photo au hasard sans recharger la page. Pose JUSTE A
     GAUCHE de l'icone souffle, dans la colonne de gauche, son bas
     ALIGNÉ sur le bas de la photo (position absolute dans le
     cadre, comme le souffle). */
  .bouton-rafraichir {
    position: absolute;    /* DANS le cadre : bas colle au bas de la photo */
    z-index: 3;             /* au-dessus de la photo, du canvas et du monticule */
    left: calc(-65px - var(--marge));  /* colonne de gauche, comme avant */
    bottom: 0;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Les icones des deux boutons sont des PNG du dossier "PNG"
     (blow.png pour le souffle, reload.png pour le rafraichir).
     image-rendering: pixelated : le petit PNG est agrandi au
     pixel pres -- le pixel art reste net, sans fondre. */
  .bouton-vent img, .bouton-rafraichir img {
    display: block;
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
  }

  .zone-interactive-conteneur {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .zone-interactive-conteneur.plein-largeur {
    display: block;
    width: 100%;
  }

  .zone-clic {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    z-index: 10;
    background: transparent;
    border: none;
    padding: 0; margin: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .zone-clic.gauche {
    left: 0;
    /* Chevron rouge, SVG integrement encode en %XX : un data URI
       avec des caracteres bruts (< > et espaces) echoue par
       intermittence sur certains navigateurs et fait clignoter
       le curseur. */
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='16'%20y='24'%20font-size='28'%20font-family='Helvetica,%20Arial,%20sans-serif'%20font-weight='bold'%20fill='%23ff1744'%20text-anchor='middle'%3E%E2%80%B9%3C/text%3E%3C/svg%3E") 16 16, pointer;
  }
  .zone-clic.droite {
    right: 0;
    /* Chevron vert, meme encodage integral. */
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='16'%20y='24'%20font-size='28'%20font-family='Helvetica,%20Arial,%20sans-serif'%20font-weight='bold'%20fill='%2300e676'%20text-anchor='middle'%3E%E2%80%BA%3C/text%3E%3C/svg%3E") 16 16, pointer;
  }

  .vitrine { position: relative; display: block; max-width: 100%; }
  .vitrine img { display: block; }
  .vitrine img.superpose {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity .45s ease;
  }
  .vitrine img.superpose.fondu { opacity: 0; }

  .pao-duo {
    display: flex;
    gap: 32px;
    align-items: center;
    width: 100%;
  }
  .pao-cadre {
    position: relative;
    flex: 1 1 50%;
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pao-cadre img {
    width: 100%;
    max-height: 80vh;
    object-fit: contain;
  }
  .pao-cadre img.superpose {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity .45s ease;
  }
  .pao-cadre img.superpose.fondu { opacity: 0; }

  .compteur { display: flex; gap: 14px; align-items: center; margin-top: 14px; color: var(--discret); font-variant-numeric: tabular-nums; }
  .compteur button { border: 0; background: none; padding: 0 2px; font: inherit; color: var(--discret); -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .compteur button:hover { color: var(--texte); }

  #canvas-explosion {
    position: fixed;
    top: 0; left: 0;
    /* Tailles de depart seulement : le JavaScript les remplace par
       des pixels exacts. 100vw/100vh designent la GRANDE zone
       d'affichage (barre d'adresse masquee) alors que la surface
       mesure innerWidth/innerHeight, la zone reelle : sur mobile
       le calque etait etire vers le bas et le sol du monticule
       decalait de quelques lignes sous l'image. */
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  /* --- Jeu de la mouche (page Contact) --- */
  #jeu-mouches {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 9000;
  }
  .mouche {
    position: absolute;
    top: 0; left: 0;
    width: 7px; height: 7px;
    opacity: 0;
    transition: opacity .2s ease;
    will-change: transform;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .mouche.visible { opacity: 1; }
  .mouche svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .mouche .ailes {
    transform-box: fill-box;
    transform-origin: center;
    animation: battement-pixel .04s steps(2, jump-none) infinite alternate;
  }
  .mouche.pose .ailes,
  .mouche.touchee .ailes,
  .mouche.morte .ailes { animation: none; }

  /* Fin de partie : le boss et le mot "congratulations !" */
  .mouche.boss {
    width: 42px; height: 42px; /* Le boss : 6 fois la taille d'une mouche */
  }
  .mouche.boss.phase2 .corps { fill: #8a0f1f; } /* Phase 2 : le corps devient rouge sombre */
  .mouche.touche {
    animation: boss-hit .18s linear;
  }
  @keyframes boss-hit {
    50% { filter: brightness(4); }
  }
  .mot-fin {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .8s ease;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    cursor: pointer;
    z-index: 9500;
  }
  .mot-fin.visible { opacity: 1; }
  .mot-fin canvas { display: block; image-rendering: pixelated; }

  /* HUD : compteur de mouches mortes + timer, en haut à droite, en typo pixel art */
  #hud-jeu {
    position: fixed;
    top: 20px; right: 32px;
    z-index: 9100;
    text-align: right;
    user-select: none;
    -webkit-user-select: none;
  }
  #hud-compteur,
  #hud-timer { display: flex; justify-content: flex-end; }
  #hud-compteur canvas,
  #hud-timer canvas { display: block; image-rendering: pixelated; }

  /* Barre de vie du boss, en bas de l'écran */
  #barre-vie-boss {
    position: fixed;
    bottom: 14px; left: 0; right: 0; /* décollée du bord bas de l'écran */
    text-align: center;
    z-index: 9100;
    pointer-events: none;
  }
  #nom-boss { margin-bottom: 8px; }
  #nom-boss canvas { display: inline-block; }
  #barre-vie-piste { height: 9px; width: 35%; margin: 0 auto; background: rgba(17, 17, 17, 0.08); }
  #barre-vie-remplie {
    height: 100%;
    width: 100%;
    background: var(--rouge);
    transition: width .12s steps(2, jump-none);
  }

  /* Barre de coup chargé (sous la tapette), pixel art */
  #barre-charge {
    position: fixed;
    width: 44px; height: 8px;
    border: 2px solid #111111;
    background: #ffffff;
    z-index: 9600;
    pointer-events: none;
  }
  #barre-charge-remplie {
    height: 100%;
    width: 0%;
    background: var(--rouge);
  }
  #barre-charge.chargee { animation: clignote-charge .18s steps(2, jump-none) infinite; }
  @keyframes clignote-charge {
    50% { border-color: var(--rouge); background: #111111; }
  }

  /* Tapette animée : elle remplace le curseur pendant la charge du coup */
  html.tapette-animee,
  html.tapette-animee *,
  html.zone-tapette.tapette-animee,
  html.zone-tapette.tapette-animee * { cursor: none !important; }
  #tapette-charge {
    position: fixed;
    width: 56px; height: 56px;
    z-index: 9700;
    pointer-events: none;
    transform-origin: 50% 90%;
    transition: transform .22s cubic-bezier(.2,.8,.3,1);
    will-change: transform;
  }
  #tapette-charge svg { display: block; width: 100%; height: 100%; }
  #tapette-charge.clignote { animation: clignote-tapette .3s steps(2, jump-none) infinite; }
  @keyframes clignote-tapette { 50% { opacity: 0.4; } }
  #tapette-charge.frappe { transition: transform .07s ease-in; }

  /* Le boss se secoue au passage en phase 2 (3 cycles bien visibles) */
  .mouche.boss.secoue { animation: boss-secoue .45s steps(2, jump-none) 3; }
  @keyframes boss-secoue {
    20% { margin: -3px 3px 0 -3px; }
    40% { margin: 2px -3px 0 2px; }
    60% { margin: -2px 2px 0 -2px; }
    80% { margin: 3px -2px 0 3px; }
  }

  /* --- Chien pixel art (page Carnaval) --- */
  #chien-carnaval {
    position: fixed;
    right: 0; bottom: 0;
    width: 460px; height: 150px;
    z-index: 9400;
    pointer-events: none;
    overflow: visible;
  }
  #chien-carnaval .chien-marionnette {
    position: absolute;
    bottom: 8px;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #chien-carnaval .chien-corps {
    display: block;
    width: 96px;
    height: 60px;
    image-rendering: pixelated;
  }
  #chien-carnaval .chien-corps.gauche { transform: scaleX(-1); }
  #chien-carnaval .bulle-chien,
  #chien-carnaval .zzz-chien {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    font-weight: bold;
    color: #111111;
    white-space: pre;
    pointer-events: none;
    animation: bulle-chien-pop .25s ease;
  }
  @keyframes bulle-chien-pop {
    from { transform: scale(0.6); opacity: 0; }
  }
  #chien-carnaval .zzz-chien { animation: zzz-chien-flotte 1.6s ease-out forwards; }
  @keyframes zzz-chien-flotte {
    from { transform: translate(0, 0); opacity: 1; }
    to   { transform: translate(8px, -30px); opacity: 0; }
  }
  @media (max-width: 760px) {
    #chien-carnaval { width: 220px; }
    #chien-carnaval .chien-corps { width: 72px; height: 45px; }
  }
  
  @keyframes battement-pixel {
    from { transform: scaleY(1); opacity: 1; }
    to   { transform: scaleY(0.4); opacity: 0.6; }
  }

  /* Screen Shake (Secousse d'impact) */
  body.screen-shake {
    animation: shake-anim 0.25s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake-anim {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(5px, -4px, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 5px, 0); }
    40%, 60% { transform: translate3d(6px, -3px, 0); }
  }

  /* Screen Shake renforcé (coup chargé) */
  body.screen-shake-fort {
    animation: shake-fort-anim 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake-fort-anim {
    10%, 90% { transform: translate3d(-6px, 4px, 0); }
    20%, 80% { transform: translate3d(10px, -8px, 0); }
    30%, 50%, 70% { transform: translate3d(-12px, 10px, 0); }
    40%, 60% { transform: translate3d(12px, -6px, 0); }
  }

  /* Le curseur devient une tapette (plus grande, inclinÃ©e) dans la zone de vol.
     SVG integrement encode en %XX, comme les autres curseurs : les
     caracteres bruts d'un data URI font clignoter le curseur. */
  html.zone-tapette,
  html.zone-tapette * {
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%20viewBox='0%200%2040%2040'%3E%3Cg%20transform='rotate(-28%2020%2020)'%3E%3Crect%20x='14'%20y='3'%20width='12'%20height='13'%20fill='%23808080'%20stroke='%23000000'%20stroke-width='1.5'%20stroke-dasharray='2.5,2.5'/%3E%3Crect%20x='18'%20y='17'%20width='4'%20height='21'%20fill='%23000000'/%3E%3Crect%20x='13'%20y='1'%20width='14'%20height='2'%20fill='%23000000'/%3E%3Crect%20x='13'%20y='16'%20width='14'%20height='2'%20fill='%23000000'/%3E%3C/g%3E%3C/svg%3E") 15 11, crosshair !important;
  }

  @media (max-width: 760px) {
    :root { --marge: 20px; }
    /* relative (identique a static dans le flux) : la colonne sert
       de repere au bouton rafraichir, aligne sur la ligne du nom */
    aside { position: relative; width: auto; }
    /* La colonne est en flex : par defaut le lien du nom s'etire
       sur toute la largeur et captait aussi les clics dans le vide
       a droite du texte (un clic la-bas rechargait la page !).
       Reduit a la largeur de son texte : le blanc entre le nom et
       l'icone de rafraichissement ne declenche plus rien. */
    .nom { align-self: flex-start; margin-bottom: 24px; }
    /* Menu reparti dans la largeur plutot qu'en colonne : il prend
       beaucoup moins de hauteur sur petit ecran. Un groupe ouvert
       affiche sa liste a l'interieur de sa case, juste sous le bouton. */
    #menu > ul { display: flex; flex-wrap: wrap; gap: 4px 18px; }
    #menu > ul > li { margin: 0; }
    /* En repartition largeur, Contact s'aligne sur la meme ligne que
       les autres sections : plus de marge qui le fait sauter en bas */
    #menu > ul > li:last-child { margin-top: 0; }
    nav ul ul { margin: 2px 0 0 14px; }
    /* MOBILE : le min-height: 100vh de main (utile sur desktop)
       forcait la page a mesurer menu + 100 vh : l'accueil etait
       plus haute que l'ecran pour rien. Ici la hauteur de main
       est celle de son contenu -- l'accueil tient dans l'ecran. */
    main { margin-left: 0; padding: 0 var(--marge) 80px; max-width: none; min-height: auto; }
    main img { max-height: none; }
    main figure.serie img { max-height: none; }
    /* Sur mobile, la photo d'accueil tient dans l'ecran : les pixels
       grattes tombent sur un sol toujours visible, jamais sous l'ecran.
       On annule la hauteur fixe du desktop (100 vh - 2 marges) : la
       photo 5 x 7 s'adapte a la largeur de l'ecran, plafonnee a 85 vh. */
    #canvas-accueil {
      height: auto;
      width: auto;
      max-width: 100%;
      max-height: 85vh;
      max-height: 85dvh;   /* suit la barre d'adresse : la photo ne saute plus */
    }
    /* Le cadre prend TOUTE la largeur du contenu des le premier
       affichage. Sinon, avant le chargement de la photo, le
       canvas vide (300 x 150 par defaut) rendait le cadre plus
       etroit que la photo finale : l'icone souffle, calee au
       bord DROIT du cadre, naissait trop a GAUCHE un court
       instant, puis sautait a sa place au chargement de la
       photo. Largeur fixe = position stable immediatement. */
    .cadre-accueil { width: 100%; }

    .pao-duo { flex-direction: column; gap: 20px; }
    .pao-cadre { width: 100%; }
    .pao-cadre img { max-height: none; }
    /* Sur mobile, l'emoji revient DANS le cadre de la photo (position
       absolue, plus fixe) : sur la ligne du menu ou se trouve
       Contact, a droite, aligne sur le bord droit de l'image, le bas
       de l'emoji affleurant le bas de la ligne de Contact (le padding
       bas du menu, var(--marge), separe cette ligne du haut de la
       photo). */
    .bouton-vent { position: absolute; left: auto; right: 0; top: auto; bottom: calc(100% + var(--marge)); margin: 0; }
    /* Icones souffle et rafraichir 40 % plus petites sur mobile
       (34 px -> 20 px) : elles debordaient du petit ecran. */
    .bouton-vent img, .bouton-rafraichir img {
      width: 20px;
      height: 20px;
    }
    /* Emoji rafraichissement : il vit desormais dans le cadre de
       la photo (il y est pose a cote de l'emoji souffle sur grand
       ecran) ; en position: fixed il reste cale sur la ligne du
       nom du site, en haut a droite de l'ecran, et reste visible
       meme quand la page defile. Le haut du texte du nom est a
       var(--marge) du haut de l'ecran ; +3px pour centrer l'emoji
       sur la hauteur de la ligne. */
    .bouton-rafraichir {
      display: block;
      position: fixed;
      left: auto;           /* annule le flanc de colline du grand ecran */
      bottom: auto;
      top: calc(var(--marge) + 3px);
      right: var(--marge);
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    nav a, nav button, .nom .lettre, .vitrine img.superpose, .pao-cadre img.superpose { transition: none; }
    .mouche .ailes { animation: none; }
    .mouche.touche { animation: none; }
    .mot-fin { transition: none; }
    #barre-vie-remplie { transition: none; }
    body.screen-shake { animation: none; }
    body.screen-shake-fort { animation: none; }
    #tapette-charge.clignote { animation: none; }
    #barre-charge.chargee { animation: none; }
    .mouche.boss.secoue { animation: none; }
    #chien-carnaval .bulle-chien { animation: none; }
    .chien-dort.tremble { animation: none; }
    #chien-carnaval .zzz-chien { animation: none; opacity: 0; }
  }
</style>

<body>

<aside>
  <a class="nom" href="#" id="nom"></a>
  <nav id="menu" aria-label="SÃ©ries"></nav>
</aside>

<main id="contenu" tabindex="-1"></main>

<canvas id="canvas-explosion"></canvas>

<script src="series.js"></script>
<script>
(function () {
  const menu = document.getElementById("menu");
  const contenu = document.getElementById("contenu");
  const liens = {};   
  const groupes = []; 

  const PALETTE_RVB = ["#ff1744", "#00e676", "#2979ff"];

  const nom = document.getElementById("nom");
  const lettres = [];
  SITE.nom.split("").forEach(function (c) {
    const s = document.createElement("span");
    s.className = "lettre";
    s.textContent = c;
    nom.appendChild(s);
    if (c !== " ") lettres.push(s);
  });

  function colorerNom() {
    let derniereCouleur = null;
    lettres.forEach(function (s) {
      let options = PALETTE_RVB;
      if (derniereCouleur !== null) {
        options = PALETTE_RVB.filter(c => c !== derniereCouleur);
      }
      const choix = options[Math.floor(Math.random() * options.length)];
      derniereCouleur = choix;
      s.style.color = choix;
    });
  }
  function decolorerNom() {
    lettres.forEach(function (s) { s.style.color = ""; });
  }

  let minuteurNom = null;
  const mouvementReduit = window.matchMedia("(prefers-reduced-motion: reduce)");
  
  nom.addEventListener("mouseenter", function () {
    colorerNom();
    if (!mouvementReduit.matches) minuteurNom = setInterval(colorerNom, 400);
  });
  nom.addEventListener("touchstart", function () {
    colorerNom();
  }, { passive: true });
  nom.addEventListener("mouseleave", function () {
    clearInterval(minuteurNom);
    minuteurNom = null;
    decolorerNom();
  });
  nom.addEventListener("focus", function () {
    if (nom.matches(":focus-visible")) colorerNom();
  });
  nom.addEventListener("blur", decolorerNom);

  nom.addEventListener("click", function (e) {
    // Cliquer sur le nom ramène toujours à la page d'accueil.
    // Si on est déjà sur l'accueil, on recharge la page à la place,
    // ce qui tire une nouvelle image au hasard.
    e.preventDefault();
    const dossierCourant = decodeURIComponent(location.hash.slice(1));
    const surAccueil =
      location.hash === "" || location.hash === "#" ||
      (dossierCourant !== "contact" && !trouver(dossierCourant));

    if (surAccueil) {
      window.location.reload();
    } else {
      location.hash = "";
      window.scrollTo(0, 0);
    }
  });

  function creerLien(serie) {
    const a = document.createElement("a");
    a.href = "#" + serie.dossier;
    a.textContent = serie.titre;
    // Cliquer sur la section où l'on est DÉJÀ recharge la page :
    // on revoit la série depuis le début, photo et grille
    // refaites à neuf (même principe que le nom du site,
    // qui recharge l'accueil quand on y est déjà).
    a.addEventListener("click", function (e) {
      if (location.hash === "#" + serie.dossier) {
        e.preventDefault();
        window.location.reload();
      }
    });
    liens[serie.dossier] = a;
    return a;
  }

  const ul = document.createElement("ul");

  SERIES.forEach(function (serie) {
    const li = document.createElement("li");
    if (serie.sous) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = serie.titre;
      b.setAttribute("aria-expanded", "false");
      const sub = document.createElement("ul");
      sub.hidden = true;
      serie.sous.forEach(function (s) {
        const l = document.createElement("li");
        l.appendChild(creerLien(s));
        sub.appendChild(l);
      });
      b.addEventListener("click", function () { basculer(b, sub); });
      groupes.push({ bouton: b, liste: sub, enfants: serie.sous.map(function (s) { return s.dossier; }) });
      li.append(b, sub);
    } else {
      li.appendChild(creerLien(serie));
    }
    ul.appendChild(li);
  });

  const liContact = document.createElement("li");
  const btnContact = document.createElement("button");
  btnContact.type = "button";
  btnContact.textContent = "Contact";
  btnContact.setAttribute("aria-expanded", "false");

  const ulContact = document.createElement("ul");
  ulContact.hidden = true;

  const liMail = document.createElement("li");
  const aMail = document.createElement("a");
  aMail.href = "mailto:" + SITE.email;
  aMail.textContent = SITE.email;
  liMail.appendChild(aMail);

  const liInsta = document.createElement("li");
  const aInsta = document.createElement("a");
  aInsta.href = "https://www.instagram.com/" + SITE.instagram + "/";
  aInsta.target = "_blank";
  aInsta.rel = "noopener";
  aInsta.textContent = "@" + SITE.instagram;
  liInsta.appendChild(aInsta);

  ulContact.append(liMail, liInsta);

  btnContact.addEventListener("click", function () {
    if (location.hash === "#contact") {
      basculer(btnContact, ulContact);
    } else {
      location.hash = "contact";
    }
  });

  liContact.append(btnContact, ulContact);
  ul.appendChild(liContact);

  menu.appendChild(ul);

  function basculer(bouton, liste, ouvrir) {
    const etat = ouvrir === undefined ? liste.hidden : ouvrir;
    liste.hidden = !etat;
    bouton.setAttribute("aria-expanded", String(etat));
  }

  let indexCouleurMenu = 0;
  function colorerMenu(el) {
    const couleurHex = PALETTE_RVB[indexCouleurMenu];
    indexCouleurMenu = (indexCouleurMenu + 1) % PALETTE_RVB.length;
    
    const couleurTexte = (couleurHex === "#00e676") ? "#000000" : "#ffffff";
    el.style.setProperty("--survol-fond", couleurHex);
    el.style.setProperty("--survol-texte", couleurTexte);
  }

  menu.querySelectorAll("a, button").forEach(function (el) {
    el.addEventListener("mouseenter", function () { colorerMenu(el); });
    el.addEventListener("touchstart", function () { colorerMenu(el); }, { passive: true });
    el.addEventListener("focus", function () { if (el.matches(":focus-visible")) colorerMenu(el); });
  });

  function trouver(dossier) {
    for (const s of SERIES) {
      if (s.sous) { for (const c of s.sous) if (c.dossier === dossier) return c; }
      else if (s.dossier === dossier) return s;
    }
    return null;
  }

  // Section "Old fashion" : les images defilent au hasard. La meme
  // image ne peut revenir avant qu'au moins 20 images differentes
  // soient passees. La detection marche que le nom soit ecrit
  // "Old fashion", "old-fashion", "old_fashion" ou "oldfashion".
  function estSerieAleatoire(serie) {
    const norm = function (s) {
      return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    };
    return norm(serie.dossier).indexOf("oldfashion") !== -1 ||
           norm(serie.titre).indexOf("oldfashion") !== -1;
  }

  function afficher() {
    window.reinitialiserAccueil = null;
    // La classe page-accueil ne doit vivre que sur l'accueil (elle
    // reduit le padding du bas pour que la page tienne pile a
    // l'ecran) : on l'enleve a chaque changement de page.
    document.body.classList.remove("page-accueil");
    // Le bouton rafraichir ne vit que sur la page d'accueil : il
    // est retire des qu'on change de page (dessinerAccueil le
    // recree en revenant).
    const ancienRafraichir = document.querySelector(".bouton-rafraichir");
    if (ancienRafraichir) ancienRafraichir.remove();
    // Le chien qui dort n'est plus qu'un div planche : afficher le
    // retire a chaque changement de page ; arreterChienDort()
    // nettoie en plus son calque laser et restaure le pointeur
    // detruit s'il l'etait. Puis il est recree tout de suite :
    // il vit sur TOUTES les pages (accueil, series, contact),
    // sauf sur mobile (garde ci-dessous).
    document.querySelectorAll(".chien-dort").forEach(function (el) { el.remove(); });
    arreterChienDort();
    // La planche est posee sur le body, en bas a gauche, au-dessus
    // du contenu, quelle que soit la page. Jamais sur mobile : meme
    // seuil que le CSS (max-width: 760px), une planche fixe de
    // 96 px empieterait sur les series en plein ecran.
    if (!window.matchMedia ||
        !window.matchMedia("(max-width: 760px)").matches) {
      creerChienDort();
    }
    if (typeof reinitialiserPhysique === "function") reinitialiserPhysique();
    arreterJeu();
    arreterChien();
    arreterMicroVent();

    const dossier = decodeURIComponent(location.hash.slice(1));

    if (dossier === "contact") {
      Object.values(liens).forEach(function (a) { a.removeAttribute("aria-current"); });
      groupes.forEach(function (g) { basculer(g.bouton, g.liste, false); });
      basculer(btnContact, ulContact, true);
      contenu.replaceChildren();
      const lecteur = document.createElement("p");
      lecteur.className = "sr-seul";
      lecteur.textContent = "Contact : " + SITE.email + ", Instagram @" + SITE.instagram + ".";
      contenu.appendChild(lecteur);
      document.title = "Contact - " + SITE.nom;
      demarrerJeu();
      window.scrollTo(0, 0);
      return;
    }
    basculer(btnContact, ulContact, false);

    const serie = trouver(dossier);

    if (!serie) {
      contenu.replaceChildren();
      Object.values(liens).forEach(function (a) { a.removeAttribute("aria-current"); });
      groupes.forEach(function (g) { basculer(g.bouton, g.liste, false); });
      dessinerAccueil();
      window.scrollTo(0, 0);
      return;
    }
    Object.keys(liens).forEach(function (d) {
      if (d === serie.dossier) liens[d].setAttribute("aria-current", "page");
      else liens[d].removeAttribute("aria-current");
    });
    groupes.forEach(function (g) {
      if (g.enfants.indexOf(serie.dossier) !== -1) basculer(g.bouton, g.liste, true);
    });
    contenu.replaceChildren();

    const nomDossier = serie.dossier.toUpperCase();
    if (nomDossier === "PAO") {
      dessinerPAO(serie);
    } else if (nomDossier === "CARNAVAL") {
      dessinerCarnaval(serie);
    } else {
      dessiner(serie);
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", afficher);

  /* --- MOTEUR DE PARTICULES (GRATTAGE & TAPETTE) --- */
  const canvasExp = document.getElementById("canvas-explosion");
  const ctxExp = canvasExp ? canvasExp.getContext("2d") : null;
  let particulesExp = []; // Pixels éphémères (impact tapette)
  let particulesOnde = []; // Onde de pixels noirs qui se propage depuis l'impact
  let animExpId = null;

  /* Monticule de pixels de grattage (page d'accueil) */
  const TAS_TAILLE = 3; // Taille d'un pixel du tas (px)
  const TAS_BIN = 3;    // Largeur d'une tranche = taille du pixel : dépôts pleins, tas dense
  const TAS_SOL = 0;    // Sol imaginaire : 0 = la premiere rangee de
                        // depots posee au dernier pixel du canvas, le
                        // monticule affleure EXACTEMENT le bas de
                        // l'image, quelle que soit sa hauteur (sur
                        // mobile, 2px de sol laissaient un petit
                        // espace blanc visible sous le tas)
  let tasCanvas = null;   // Canvas offscreen où le monticule est dessiné de façon permanente
  let tasCtx = null;
  let tasVue = null;      // Canvas d'affichage du monticule, pose DANS le cadre de la photo
  let tasVueCtx = null;
  let tasElement = null;  // L'image d'accueil : ancre du monticule (suit le scroll de la page)
  let tasDebord = 0;        // Largeur de débord de chaque côté de l'image (px)
  let tasLargeurImage = 0;  // Largeur affichée de l'image
  let tasHauteurImage = 0;  // Hauteur affichée de l'image
  let tasHauteurs = [];   // Hauteur du monticule par tranche
  let tasActif = false;
  let particulesTas = []; // Pixels arrachés en cours de chute

  function redimensionnerCanvasExp() {
    if (!canvasExp) return;
    // Taille CSS en pixels EXACTS : la surface doit mesurer
    // precisement ce que dessine le code. Ce calque n'accueille plus
    // que les effets ephemeres (tapette, vent) : le monticule vit
    // desormais dans la page, dans le cadre de la photo, sur son
    // propre canvas.
    canvasExp.width = window.innerWidth;
    canvasExp.height = window.innerHeight;
    canvasExp.style.width = window.innerWidth + "px";
    canvasExp.style.height = window.innerHeight + "px";
    reveillerCadre();
  }
  window.addEventListener("resize", redimensionnerCanvasExp);
  redimensionnerCanvasExp();

  // Monticule au repos : une fois les pixels poses, le dessin est
  // statique. Son canvas vit dans la page, dans le cadre de la photo :
  // il defile avec elle, aucun redessin n'est utile au scroll. Seul un
  // redimensionnement de la fenetre le relance.
  function dessinerCadreStatique() {
    if (!tasVueCtx || !tasCanvas) return;
    tasVueCtx.clearRect(0, 0, tasVue.width, tasVue.height);
    tasVueCtx.drawImage(tasCanvas, 0, 0);
  }

  function reveillerCadre() {
    if (animExpId || !tasActif || !tasCanvas || !tasElement) return;
    const rect = tasElement.getBoundingClientRect();
    if (Math.round(rect.width) !== tasLargeurImage || Math.round(rect.height) !== tasHauteurImage) {
      // L'image a change de taille : on repart d'un monticule vierge
      initialiserTas(tasElement);
    }
    dessinerCadreStatique();
  }

  function creerPixelPhysique(x, y, couleur) {
    if (!ctxExp) return;
    // Explosion rouge par défaut (jeu), ou couleur imposée (terre du chien)
    particulesExp.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -(0.5 + Math.random() * 2.2),
      taille: Math.floor(Math.random() * 3 + 2),
      couleur: couleur || "#ff1744",
      vie: 1.0,
      decroissance: 0.015 + Math.random() * 0.02
    });
    if (!animExpId) animerExp();
  }

  function creerOndeImpact(x, y, numero) {
    // Onde de pixels noirs qui se propage depuis le point d'impact
    // et disparaît. Réservée au coup chargé : trois ondes successives,
    // chacune plus dense et plus large que la précédente.
    if (!ctxExp) return;
    numero = numero || 0;
    const nb = 46 + numero * 10;           // densité croissante
    const rayonDepart = 12 + numero * 18;  // chaque onde part de plus loin
    const vitesse = 5.5;

    for (let i = 0; i < nb; i++) {
      const angle = (i / nb) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
      particulesOnde.push({
        x: x + Math.cos(angle) * rayonDepart,
        y: y + Math.sin(angle) * rayonDepart,
        vx: Math.cos(angle) * vitesse,
        vy: Math.sin(angle) * vitesse,
        taille: 4,
        couleur: "#111111",
        vie: 1.0,
        decroissance: 0.026 + Math.random() * 0.012
      });
    }
    if (!animExpId) animerExp();
  }

  function initialiserTas(element) {
    const rect = element.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    tasElement = element;
    tasLargeurImage = Math.round(rect.width);
    tasHauteurImage = Math.round(rect.height);
    // Le monticule peut s'étendre en dehors des côtés de l'image
    tasDebord = Math.round(tasLargeurImage * 0.25);
    if (!tasCanvas) tasCanvas = document.createElement("canvas");
    tasCanvas.width = tasLargeurImage + tasDebord * 2;
    tasCanvas.height = tasHauteurImage;
    tasCtx = tasCanvas.getContext("2d");
    tasCtx.clearRect(0, 0, tasCanvas.width, tasCanvas.height);
    // Canvas d'affichage pose DANS LA PAGE, dans le cadre de la
    // photo (CSS .tas-affichage). Safari clippe les calques fixes a
    // la zone visible au-dessus de sa barre du bas : la photo, elle,
    // s'affiche derriere la barre translucide. En posant le
    // monticule dans la page, ses pixels profitent du meme
    // traitement. Taille CSS fractionnaire EXACTE : le navigateur
    // aligne la base du monticule au pixel pres sur le bas de
    // l'image, quelle que soit la taille reelle de la photo.
    if (!tasVue) {
      tasVue = document.createElement("canvas");
      tasVue.className = "tas-affichage";
      element.parentNode.appendChild(tasVue);
    }
    tasVue.width = tasCanvas.width;
    tasVue.height = tasCanvas.height;
    tasVue.style.left = -tasDebord + "px";
    tasVue.style.width = rect.width + tasDebord * 2 + "px";
    tasVue.style.height = rect.height + "px";
    tasVueCtx = tasVue.getContext("2d");
    tasHauteurs = new Array(Math.ceil(tasCanvas.width / TAS_BIN)).fill(0);
    particulesTas = [];
    tasActif = true;
  }

  function creerParticuleTas(x, y, couleur) {
    if (!ctxExp || !tasActif) return;
    particulesTas.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 2,
      vy: 0.4 + Math.random() * 0.8,
      couleur: couleur,
      roulements: 0
    });
    if (!animExpId) animerExp();
  }

  function actualiserTas() {
    const solLocal = tasCanvas.height - TAS_SOL;
    // Dessin direct dans le canvas du monticule, pose dans la page :
    // coordonnees locales du bitmap, sans transformation. C'est la
    // taille CSS fractionnaire exacte du canvas (reglee dans
    // initialiserTas) qui aligne le bas du monticule sur le bas de
    // l'image, au pixel pres.

    for (let i = particulesTas.length - 1; i >= 0; i--) {
      const p = particulesTas[i];

      // Gravité
      p.vy += 0.15;
      p.x += p.vx;
      p.y += p.vy;

      // Rester dans les limites du tas (débord compris)
      if (p.x < TAS_TAILLE) { p.x = TAS_TAILLE; p.vx = Math.abs(p.vx) * 0.5; }
      if (p.x > tasCanvas.width - TAS_TAILLE) { p.x = tasCanvas.width - TAS_TAILLE; p.vx = -Math.abs(p.vx) * 0.5; }

      const bin = Math.min(tasHauteurs.length - 1, Math.max(0, Math.floor(p.x / TAS_BIN)));
      const surfaceY = solLocal - tasHauteurs[bin] - TAS_TAILLE;

      if (p.y >= surfaceY) {
        const hauteurGauche = bin > 0 ? tasHauteurs[bin - 1] : Infinity;
        const hauteurDroite = bin < tasHauteurs.length - 1 ? tasHauteurs[bin + 1] : Infinity;
        const plusBasse = Math.min(hauteurGauche, hauteurDroite);

        // Physique du tas : le pixel roule vers la tranche plus basse,
        // ce qui forme un monticule en pente plutôt que des colonnes
        if (tasHauteurs[bin] - plusBasse > TAS_TAILLE && p.roulements < 8) {
          p.roulements++;
          p.x += (hauteurGauche <= hauteurDroite) ? -TAS_BIN : TAS_BIN;
          p.x = Math.min(tasCanvas.width - TAS_TAILLE, Math.max(TAS_TAILLE, p.x));
          p.y = surfaceY - 0.5;
          p.vy = 0.2;
          p.vx = 0;
        } else {
          // Dépôt définitif : le pixel remplit toute la tranche (tas dense, sans interstices)
          tasHauteurs[bin] += TAS_TAILLE;
          tasCtx.globalAlpha = 1;
          tasCtx.fillStyle = p.couleur;
          tasCtx.fillRect(
            bin * TAS_BIN,
            Math.round(solLocal - tasHauteurs[bin]),
            TAS_BIN,
            TAS_TAILLE
          );
          particulesTas.splice(i, 1);
          continue;
        }
      }

      // Dessin en coordonnées page (suit le scroll, débord compris)
      tasVueCtx.fillStyle = p.couleur;
      tasVueCtx.fillRect(Math.round(p.x - TAS_TAILLE / 2), Math.round(p.y), TAS_TAILLE, TAS_TAILLE);
    }
  }

  /* --- VENT AU MICROPHONE (page d'accueil) --- */
  // Souffler dans le micro declenche un vent qui arrache le monticule
  // de pixels et le fait s'envoler. Le micro n'est active qu'apres un
  // clic sur le bouton (permission navigateur), et il se coupe
  // automatiquement quand on quitte la page d'accueil.
  let ventActif = false;      // le micro ecoute
  let ventEnergie = 0;        // force du souffle, de 0 a 1
  let ventRepetitions = 0;    // analyses consecutives au-dessus du seuil
  let ventRafale = 0;         // images de rafale restantes (gros souffle brutal)
  let ventFlux = null;
  let ventAudio = null;
  let ventAnalyseur = null;
  let ventDonnees = null;
  let ventIntervalle = null;
  let particulesVent = [];   // Pixels arraches par le souffle, en vol

  // Icones des deux boutons : des PNG poses par l'utilisateur
  // dans le dossier "PNG" (blow.png pour le souffle, reload.png
  // pour le rafraichissement). Si le micro est refuse ou
  // indisponible, on ne change RIEN a l'ecran : le petit clic
  // d'interrupteur (jouerClicVent, sens "off") suffit a prevenir.
  const ICONE_VENT = "PNG/blow.png";      // l'icone du souffle
  const ICONE_RELOAD = "PNG/reload.png";  // l'icone du rafraichissement

  // Pose l'icone du souffle (blow.png) dans le bouton, sur le
  // modele d'imgReload pour le rafraichir. Jamais remplacee :
  // refus ou panne de micro n'ont AUCUNE consequence visuelle.
  function iconeVent(bouton) {
    if (!bouton) return;
    bouton.textContent = "";
    const img = document.createElement("img");
    img.src = ICONE_VENT;
    img.alt = "";
    img.decoding = "async";
    bouton.appendChild(img);
  }

  // L'icone ne change JAMAIS (toujours blow.png) : seul le titre
  // du bouton suit l'etat du micro.
  function majBoutonVent(bouton, actif) {
    if (!bouton) return;
    bouton.title = actif ? "Souffle pour nettoyer !" : "Nettoyer en soufflant dans le micro";
  }

  // Petit "clic" grave et tres discret, joue quand on active ou coupe
  // le micro. Grave volontairement (140 a 220 Hz) : pas d'agressivite.
  // Peut recevoir un AudioContext deja ouvert (le creer pendant le clic
  // est obligatoire sur iPhone : un contexte cree plus tard, hors geste,
  // reste muet).
  function jouerClicVent(audioDejaOuvert, sens) {
    try {
      let audio = audioDejaOuvert || null;
      let fermerApres = false;
      if (!audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audio = new Ctx();
        fermerApres = true;
      }
      // Son d'interrupteur, sec : deux notes carrees tres courtes,
      // grave puis aigu quand le souffle s'allume, aigu puis grave
      // quand il s'eteint. Onde carree, attaque immediate et decay
      // rapide : un clic net de commutateur, rien de rond ni de
      // trainant.
      const t = audio.currentTime;
      const grave = 220;
      const aigu = 440;
      const notes = (sens === "off") ? [aigu, grave] : [grave, aigu];
      const dureeNote = 0.04;   // 40ms par note : sec, pas de trainee
      const pause = 0.035;      // entre les deux notes
      let dernier = null;
      notes.forEach(function (freq, i) {
        const debut = t + i * (dureeNote + pause);
        const osc = audio.createOscillator();
        const vol = audio.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, debut);
        vol.gain.setValueAtTime(0.07, debut);
        vol.gain.exponentialRampToValueAtTime(0.0001, debut + dureeNote);
        osc.connect(vol);
        vol.connect(audio.destination);
        osc.start(debut);
        osc.stop(debut + dureeNote + 0.005);
        dernier = osc;
      });
      // Le contexte temporaire ne se ferme qu'a la fin de la SECONDE
      // note : fermer a la fin de la premiere couperait la deuxieme.
      if (fermerApres && dernier) {
        dernier.onended = function () {
          try { audio.close(); } catch (e) { /* deja ferme */ }
        };
      }
    } catch (e) { /* pas de son disponible : tant pis */ }
  }

  function arreterMicroVent() {
    if (ventIntervalle) { clearInterval(ventIntervalle); ventIntervalle = null; }
    if (ventFlux) {
      ventFlux.getTracks().forEach(function (t) { t.stop(); });
      ventFlux = null;
    }
    if (ventAudio) {
      try { ventAudio.close(); } catch (e) { /* deja ferme */ }
      ventAudio = null;
    }
    ventAnalyseur = null;
    ventDonnees = null;
    ventActif = false;
    ventEnergie = 0;
    ventRepetitions = 0;
    ventRafale = 0;
    particulesVent = [];
  }

  function analyserSouffle() {
    if (!ventActif || !ventAnalyseur || !ventDonnees) return;
    ventAnalyseur.getByteTimeDomainData(ventDonnees);
    let somme = 0;
    for (let i = 0; i < ventDonnees.length; i++) {
      const v = (ventDonnees[i] - 128) / 128;
      somme += v * v;
    }
    const rms = Math.sqrt(somme / ventDonnees.length);
    // Seuil tres bas : meme un souffle FAIBLE declenche le vent
    // a pleine puissance, sans s'epuiser.
    if (rms > 0.03) {
      ventRepetitions++;
      if (ventRepetitions >= 1) {
        const ancienne = ventEnergie;
        // Plancher haut et saturation rapide : un souffle faible
        // suffit deja a emporter presque tout le monticule.
        ventEnergie = Math.min(1, Math.max(0.9, (rms - 0.03) / 0.08));
        // Gros souffle brutal d'un coup : rafale qui emporte presque tout
        if (ventEnergie >= 0.7 && ancienne < 0.4) ventRafale = 20;
      }
    } else {
      ventRepetitions = 0;
      ventEnergie *= 0.86; // decroissance douce quand on arrete de souffler
    }
    // Le vent fait tourner la boucle d'animation si besoin
    if (tasActif && ventEnergie > 0.2 && !animExpId) animerExp();
  }

  function demarrerMicroVent(bouton) {
    if (ventActif) {
      arreterMicroVent();
      majBoutonVent(bouton, false);
      jouerClicVent(null, "off");
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !Ctx) {
      // Micro indisponible : RIEN a l'ecran (l'icone reste
      // blow.png), juste le petit clic "off" -- l'interrupteur
      // n'a pas pris.
      jouerClicVent(null, "off");
      return;
    }
    // iOS/Safari : l'AudioContext doit etre cree pendant le clic
    ventAudio = new Ctx();
    ventAudio.resume();
    // Le clic d'activation part tout de suite, pendant le geste : sur
    // iPhone, le jouer apres la reponse du micro resterait muet.
    // Sens "on" : note grave puis note aigu, comme un interrupteur.
    jouerClicVent(ventAudio, "on");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (flux) {
      ventFlux = flux;
      if (ventAudio && ventAudio.state === "suspended") ventAudio.resume();
      const source = ventAudio.createMediaStreamSource(flux);
      ventAnalyseur = ventAudio.createAnalyser();
      ventAnalyseur.fftSize = 512;
      source.connect(ventAnalyseur);
      // Octets (0-255) : marche sur tous les navigateurs, y compris
      // les anciens Safari qui n'ont pas getFloatTimeDomainData
      ventDonnees = new Uint8Array(ventAnalyseur.fftSize);
      ventActif = true;
      ventRepetitions = 0;
      ventEnergie = 0;
      majBoutonVent(bouton, true);
      ventIntervalle = setInterval(analyserSouffle, 50);
    }).catch(function () {
      // Micro refuse : AUCUN changement a l'ecran (pas de panneau
      // d'interdiction, l'icone reste blow.png) -- le petit clic
      // "off" suffit a prevenir. Le contexte ferme APRES le son
      // (300 ms), sinon on couperait le clic en plein milieu.
      if (ventAudio) {
        const audioRefus = ventAudio;
        jouerClicVent(audioRefus, "off");
        setTimeout(function () {
          try { audioRefus.close(); } catch (e) { /* deja ferme */ }
        }, 300);
        ventAudio = null;
      }
    });
  }

  function arracherPixelTas(bin) {
    // Retire le pixel du haut d'une tranche du monticule et renvoie
    // sa couleur, lue sur le canvas du tas juste avant l'effacement.
    const solLocal = tasCanvas.height - TAS_SOL;
    const y = Math.round(solLocal - tasHauteurs[bin]);
    let couleur = "#111111";
    try {
      const px = tasCtx.getImageData(bin * TAS_BIN, y, TAS_BIN, TAS_TAILLE);
      if (px.data[3] > 0) {
        couleur = "#" + ((1 << 24) + (px.data[0] << 16) + (px.data[1] << 8) + px.data[2]).toString(16).slice(1);
      }
    } catch (e) { /* canvas illisible : pixel noir par defaut */ }
    tasCtx.clearRect(bin * TAS_BIN, y, TAS_BIN, TAS_TAILLE);
    tasHauteurs[bin] -= TAS_TAILLE;
    return couleur;
  }

  function soufflerSurTas(force) {
    if (!tasActif || !tasCtx || force < 0.2) return;
    // Petit souffle = le tas part deja en ENTIER (inutile de
    // s'epuiser) ; gros souffle d'un coup = quasi tout le tas
    // s'envole, et vite
    const arrachements = Math.round(30 + force * 260 + Math.random() * 10);
    let arraches = 0;
    for (let k = 0; k < arrachements * 3 && arraches < arrachements; k++) {
      const bin = Math.floor(Math.random() * tasHauteurs.length);
      if (tasHauteurs[bin] < TAS_TAILLE) continue;
      const solLocal = tasCanvas.height - TAS_SOL;
      const couleur = arracherPixelTas(bin);
      particulesVent.push({
        x: bin * TAS_BIN + TAS_BIN / 2,
        y: solLocal - tasHauteurs[bin] - TAS_TAILLE,
        vx: 5 + Math.random() * 9,   // le vent les chasse vite vers la droite
        vy: -(1.5 + Math.random() * 4),
        vie: 1,
        decroissance: 0.012 + Math.random() * 0.02,
        couleur: couleur
      });
      arraches++;
    }
    // Le vent pousse aussi les pixels encore en chute libre
    for (let i = 0; i < particulesTas.length; i++) {
      particulesTas[i].vx += 0.5 + force * 1.4;
      particulesTas[i].vy -= force * 0.5;
    }
  }

  function animerExp() {
    if (!ctxExp) return;
    ctxExp.clearRect(0, 0, canvasExp.width, canvasExp.height);

    // 1. Le monticule, ancré au bas de l'image (suit le scroll de la page)
    if (tasActif && tasCanvas && tasElement && tasVueCtx) {
      const rect = tasElement.getBoundingClientRect();
      if (Math.round(rect.width) !== tasLargeurImage || Math.round(rect.height) !== tasHauteurImage) {
        initialiserTas(tasElement);
      } else {
        tasVueCtx.clearRect(0, 0, tasVue.width, tasVue.height);
        tasVueCtx.drawImage(tasCanvas, 0, 0);
        actualiserTas();
        // Le bitmap est colle tel quel sur le canvas d'affichage pose
        // dans la page : c'est sa taille CSS fractionnaire exacte
        // (reglee dans initialiserTas) qui aligne la base du monticule
        // au pixel pres sur le bas de l'image.
      }
    }

    // 2. Pixels éphémères (impact tapette)
    for (let i = particulesExp.length - 1; i >= 0; i--) {
      const p = particulesExp[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2; // Gravité bien marquée : les pixels retombent
      p.vie -= p.decroissance;
      if (p.vie <= 0) {
        particulesExp.splice(i, 1);
        continue;
      }
      ctxExp.fillStyle = p.couleur;
      ctxExp.globalAlpha = p.vie;
      ctxExp.fillRect(Math.round(p.x), Math.round(p.y), p.taille, p.taille);
    }
    ctxExp.globalAlpha = 1.0;

    // 3. Onde de pixels noirs (propagation circulaire depuis l'impact)
    for (let i = particulesOnde.length - 1; i >= 0; i--) {
      const p = particulesOnde[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vie -= p.decroissance;
      if (p.vie <= 0) {
        particulesOnde.splice(i, 1);
        continue;
      }
      ctxExp.fillStyle = "#111111";
      ctxExp.globalAlpha = p.vie;
      ctxExp.fillRect(Math.round(p.x), Math.round(p.y), p.taille, p.taille);
    }
    ctxExp.globalAlpha = 1.0;

    // 4. Vent : le souffle arrache le monticule et emporte les pixels
    let forceVent = ventEnergie;
    if (ventRafale > 0) { forceVent = Math.min(1, forceVent + 0.4); ventRafale--; }
    if (forceVent > 0.2 && tasActif) soufflerSurTas(forceVent);
    if (particulesVent.length > 0 && tasElement) {
      const rectV = tasElement.getBoundingClientRect();
      for (let i = particulesVent.length - 1; i >= 0; i--) {
        const pv = particulesVent[i];
        pv.x += pv.vx;
        pv.y += pv.vy;
        // Tant que le souffle dure, le vent sustente les pixels ;
        // quand il retombe, la gravite les ramene doucement
        pv.vy += 0.12 - forceVent * 0.22;
        pv.vx += forceVent * 0.06;
        pv.vie -= pv.decroissance;
        if (pv.vie <= 0 || pv.x > tasCanvas.width + tasDebord + 60 || pv.y > tasCanvas.height + 60) {
          particulesVent.splice(i, 1);
          continue;
        }
        ctxExp.fillStyle = pv.couleur;
        ctxExp.globalAlpha = Math.max(0, pv.vie);
        ctxExp.fillRect(Math.round(rectV.left - tasDebord + pv.x - TAS_TAILLE / 2), Math.round(rectV.top + pv.y), TAS_TAILLE, TAS_TAILLE);
      }
      ctxExp.globalAlpha = 1.0;
    }

    // La boucle ne continue que s'il reste du mouvement : une fois les
    // pixels poses, le dessin devient statique (revient au scroll), ce
    // qui soulage le processeur et la batterie.
    if (particulesExp.length > 0 || particulesOnde.length > 0 || particulesTas.length > 0 ||
        particulesVent.length > 0 || (tasActif && forceVent > 0.2)) {
      animExpId = requestAnimationFrame(animerExp);
    } else {
      animExpId = null;
      dessinerCadreStatique();
    }
  }

  function reinitialiserPhysique() {
    particulesExp = [];
    particulesOnde = [];
    particulesTas = [];
    particulesVent = [];
    tasCanvas = null;
    tasCtx = null;
    if (tasVue) { tasVue.remove(); tasVue = null; tasVueCtx = null; }
    tasHauteurs = [];
    tasActif = false;
    tasElement = null;
    tasDebord = 0;
    tasLargeurImage = 0;
    tasHauteurImage = 0;
    if (ctxExp) ctxExp.clearRect(0, 0, canvasExp.width, canvasExp.height);
  }

  /* --- PAGE D'ACCUEIL & GRATTAGE --- */
  function dessinerAccueil() {
    document.title = SITE.nom;
    if (!SITE.accueil) return;
    // Page-accueil : reduit le padding du bas de main -- photo et
    // marges occupent exactement 100 vh, aucun scroll inutile.
    document.body.classList.add("page-accueil");

    const fig = document.createElement("figure");
    fig.className = "figure-accueil";

    // Cadre intermediaire : il contient uniquement le canvas (et la
    // photo de dessous). C'est sur lui que la photo de dessous est
    // rognée : elle correspond toujours exactement a la photo grattée,
    // meme quand le figure contient aussi l'emoji en dessous (mobile).
    const cadre = document.createElement("div");
    cadre.className = "cadre-accueil";

    // Photo de dessous : le grattage ne revele pas du blanc mais une
    // autre photo du dossier, tiree au hasard. Elle n'apparait qu'a
    // travers les zones effacees du canvas.
    const imgDessous = document.createElement("img");
    imgDessous.className = "photo-dessous";
    imgDessous.alt = "";
    imgDessous.decoding = "async";
    imgDessous.style.visibility = "hidden"; // visible des que la photo principale est posee
    cadre.appendChild(imgDessous);

    const canvas = document.createElement("canvas");
    canvas.id = "canvas-accueil";
    cadre.appendChild(canvas);
    fig.appendChild(cadre);
    contenu.appendChild(fig);

    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return;

    // Image d'accueil aléatoire à chaque visite : accueil1.jpg, accueil2.jpg...
    // Le nombre d'images n'a pas besoin d'être connu à l'avance : on compte
    // celles présentes en chargeant accueil1.jpg, puis 2, puis 3... jusqu'à
    // la première absente, puis on tire une image au hasard parmi elles.
    const src = "images/accueil/" + encodeURIComponent(SITE.accueil);
    const photo = new Image();
    photo.decoding = "async";

    let photoData = null;
    let photoSale = true;  // l'instantane des pixels doit etre relu avant le prochain geste

    // Le canvas de grattage travaille en resolution limitee : l'ecran
    // n'affiche de toute facon qu'une fraction de la photo, et tout
    // (pinceau, lecture de pixels, monticule) devient nettement plus
    // rapide, surtout sur telephone.
    const RESOLUTION_MAX = 1600; // cote le plus long du canvas

    // TAILLE DU PINCEAU DE GRATTAGE : fraction du petit cote de la
    // photo affichee. Deux valeurs reglees INDEPENDAMMENT : une pour
    // grand ecran (desktop), une pour la version mobile. La frontiere
    // est la meme que la mise en page : 760px de large d'ecran.
    // Plus petit = grattage fin, plus grand = grosse eponge.
    // Plage conseillee : de 0.02 (tres fin) a 0.12 (large).
    // Pour les retrouver : chercher PINCEAU_TAILLE dans le code.
    const PINCEAU_TAILLE_DESKTOP = 0.04; // pinceau sur grand ecran
    const PINCEAU_TAILLE_MOBILE = 0.04;  // pinceau sur la version mobile

    // DEUX regles d'affichage pour la photo DU DESSUS, selon la
    // version :
    // - DESKTOP : la photo ENTIERE, et TOUTES les photos a la
    //   MEME HAUTEUR (100 vh moins les deux marges, regle CSS
    //   #canvas-accueil) -- la largeur suit le format propre de
    //   chaque image, ni plus ni moins : verticale ou
    //   horizontale, aucune ne parait plus petite que les
    //   autres. Aucun recadrage, aucun etirement.
    // - MOBILE : toute image VERTICALE est RECADREE au ratio
    //   5 x 7 (5 de large, 7 de haut), au plus grand et CENTRE,
    //   quitte a rogner -- jamais d'etirement. (Et le tirage
    //   mobile ne choisit jamais d'image horizontale : voir
    //   tirerImageAccueil.)
    let recadrage = { sx: 0, sy: 0, l: 0, h: 0 };  // la part de la photo affichee
    function chargerEtDessiner() {
      const RATIO_5_7 = 5 / 7;
      let sx = 0;                        // coin du recadrage dans la photo
      let sy = 0;
      let l = photo.naturalWidth;
      let h = photo.naturalHeight;
      const mobile = !!(window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches);
      if (mobile && h > l) {
        // Image verticale sur MOBILE : on retaille son cadre en 5 x 7.
        if (l / h > RATIO_5_7) {
          // Plus large que 5:7 (ex. 3:4) : on rogne la LARGEUR.
          const c = Math.round(h * RATIO_5_7);
          sx = Math.floor((l - c) / 2);
          l = c;
        } else {
          // Plus etroite que 5:7 (ex. 2:3) : on rogne la HAUTEUR.
          const c = Math.round(l / RATIO_5_7);
          sy = Math.floor((h - c) / 2);
          h = c;
        }
      }
      recadrage = { sx: sx, sy: sy, l: l, h: h };
      const plusLong = Math.max(l, h);
      const k = plusLong > RESOLUTION_MAX ? RESOLUTION_MAX / plusLong : 1;
      canvas.width = Math.max(1, Math.round(l * k));
      canvas.height = Math.max(1, Math.round(h * k));
      ctx.drawImage(photo, sx, sy, l, h, 0, 0, canvas.width, canvas.height);
      imgDessous.style.visibility = "visible";
      photoSale = true;
    }

    function actualiserPhotoData() {
      try {
        photoData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        photoSale = false;
      } catch (e) {
        photoData = null;
      }
    }

    photo.onload = chargerEtDessiner;

    // Règle anti-répétition : une même image ne peut pas revenir tant que
    // 10 images différentes ne sont pas passées avant elle.
    // L'historique est mémorisé entre les visites (localStorage).
    const HISTO_MAX = 10;
    let historiqueAccueil = [];
    try {
      historiqueAccueil = JSON.parse(localStorage.getItem("accueil-historique")) || [];
      if (!Array.isArray(historiqueAccueil)) historiqueAccueil = [];
    } catch (e) {
      historiqueAccueil = [];
    }
    function enregistrerAccueil(url) {
      historiqueAccueil.push(url);
      if (historiqueAccueil.length > HISTO_MAX) historiqueAccueil.shift();
      try {
        localStorage.setItem("accueil-historique", JSON.stringify(historiqueAccueil));
      } catch (e) { /* stockage indisponible : on continue sans mémoire */ }
    }

    // Comptage automatique des images du dossier, puis tirage au sort.
    // Les sondes partent par lots de 10 EN PARALLELE : la photo apparait
    // apres un ou deux allers-retours reseau, au lieu d'attendre chaque
    // image l'une apres l'autre. Le navigateur garde les sondes en
    // cache : la photo tiree au sort s'affiche aussitot.
    const LOT_SONDES = 10;
    // Total decouvert par les sondes : le bouton rafraichir le
    // ressert sans resonder le dossier (les sondes sont en cache).
    let totalAccueil = 0;
    // Dimensions de chaque image, relevees par les sondes quand
    // elles chargent : elles servent a ecarter les images
    // HORIZONTALES du tirage de la photo DU DESSUS sur mobile --
    // recadee aux dimensions du petit ecran, une image horizontale
    // deviendrait minuscule et sans interet.
    const dimsAccueil = {};
    function tirerImageAccueil(total) {
      totalAccueil = total;
      const urls = [];
      for (let n = 1; n <= total; n++) {
        urls.push("images/accueil/accueil" + n + ".jpg");
      }
      // Sur MOBILE, la photo DU DESSUS n'est jamais HORIZONTALE :
      // on ne tire que parmi les images VERTICALES (elles seront
      // de toute facon recadrees en 5 x 7 par chargerEtDessiner).
      // S'il n'y en a aucune, on garde tout. La frontiere mobile
      // est la meme que la mise en page (max-width: 760px).
      const mobile = !!(window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches);
      let pool = urls;
      if (mobile) {
        const verticales = urls.filter(function (u) {
          const d = dimsAccueil[u];
          return !d || d.h >= d.l;   // dimensions inconnues : on garde
        });
        if (verticales.length > 0) pool = verticales;
      }
      let candidates = pool.filter(function (u) {
        return historiqueAccueil.indexOf(u) === -1;
      });
      if (candidates.length === 0) candidates = pool;
      const choisie = candidates[Math.floor(Math.random() * candidates.length)];
      enregistrerAccueil(choisie);
      photo.src = choisie;
      // La photo de dessous est une AUTRE image, tiree au hasard ; si le
      // dossier n'en contient qu'une, on la garde (effet neutralise).
      let autres = urls.filter(function (u) { return u !== choisie; });
      if (autres.length === 0) autres = urls;
      imgDessous.src = autres[Math.floor(Math.random() * autres.length)];
    }
    function sonderAccueil(debut, fin) {
      // restants est compte d'avance : le lot est clos quelle que soit
      // l'ordre dans lequel les sondes repondent (rapide ou pas)
      let restants = fin - debut + 1;
      let premiereRatee = fin + 1;
      const sondeTerminee = function (num, ok) {
        if (!ok && num < premiereRatee) premiereRatee = num;
        restants--;
        if (restants > 0) return;
        if (premiereRatee > fin) {
          // tout le lot existe : on sonde le lot suivant
          sonderAccueil(fin + 1, fin + LOT_SONDES);
          return;
        }
        const total = premiereRatee - 1;
        if (total > 0) tirerImageAccueil(total);
        else {
          photo.src = src; // aucune image numerotee : image par defaut
          imgDessous.src = src;
        }
      };
      for (let n = debut; n <= fin; n++) {
        (function (num) {
          const sonde = new Image();
          sonde.onload = function () {
            dimsAccueil["images/accueil/accueil" + num + ".jpg"] =
              { l: sonde.naturalWidth, h: sonde.naturalHeight };
            sondeTerminee(num, true);
          };
          sonde.onerror = function () { sondeTerminee(num, false); };
          sonde.src = "images/accueil/accueil" + num + ".jpg";
        })(n);
      }
    }
    sonderAccueil(1, LOT_SONDES);

    window.reinitialiserAccueil = function () {
      if (photo.complete && photo.naturalWidth) {
        ctx.globalCompositeOperation = "source-over";
        // Meme RECADRAGE que chargerEtDessiner : redessiner la
        // photo ENTIERE dans un canvas 5 x 7 l'etirerait.
        ctx.drawImage(photo, recadrage.sx, recadrage.sy, recadrage.l, recadrage.h,
                      0, 0, canvas.width, canvas.height);
        photoSale = true;
      }
      reinitialiserPhysique();
    };

    let estEnTrainDeCliquer = false;
    let precedentGrattage = null; // point precedent, pour tracer un trait continu
    let griffeAttendue = null;    // au plus une griffe par image affichee

    function gratterEtEjecter(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const echelleX = canvas.width / rect.width;
      const echelleY = canvas.height / rect.height;

      const x = (clientX - rect.left) * echelleX;
      const y = (clientY - rect.top) * echelleY;

      // Version mobile ou desktop : meme frontiere que la mise en
      // page (max-width: 760px), evaluee a chaque geste pour suivre
      // une rotation d'ecran ou un redimensionnement de fenetre.
      const taillePinceau = (window.matchMedia && window.matchMedia("(max-width: 760px)").matches)
        ? PINCEAU_TAILLE_MOBILE
        : PINCEAU_TAILLE_DESKTOP;
      const rayonPinceau = Math.min(canvas.width, canvas.height) * taillePinceau;

      if (photoData) {
        const pBuffer = photoData.data;
        const nbParticules = 10;
        
        for (let k = 0; k < nbParticules; k++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.pow(Math.random(), 1.8) * rayonPinceau; 
          const px = Math.floor(x + Math.cos(angle) * r);
          const py = Math.floor(y + Math.sin(angle) * r);

          if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
            const index = (py * canvas.width + px) * 4;
            const alpha = pBuffer[index + 3];
            
            if (alpha > 0) {
              const hexColor = "#" + (
                (1 << 24) + 
                (pBuffer[index] << 16) + 
                (pBuffer[index + 1] << 8) + 
                pBuffer[index + 2]
              ).toString(16).slice(1);

              // Le pixel arraché tombe et grossit le monticule en bas de l'image
              if (!tasActif) initialiserTas(canvas);
              creerParticuleTas(tasDebord + px / echelleX, py / echelleY, hexColor);
            }
          }
        }
      }

      // Pinceau doux : un seul degrade radial (centre a l'origine),
      // deplace par translate pour chaque touche. Tous les bords sont
      // fondus : aucune trace ronde nete, meme en deplacant vite le doigt.
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rayonPinceau);
      grad.addColorStop(0, "rgba(0,0,0,1)");
      grad.addColorStop(0.5, "rgba(0,0,0,0.6)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;

      const tampon = function (cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, rayonPinceau, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      // Trait continu : on repasse sur tout le segment entre le point
      // precedent et le point actuel, pour ne pas laisser de trous.
      if (precedentGrattage) {
        const dx = x - precedentGrattage.x;
        const dy = y - precedentGrattage.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        // Plafond : meme un tres grand geste rapide reste fluide
        const pas = Math.min(12, Math.max(1, Math.ceil(dist / (rayonPinceau * 0.5))));
        for (let i = 0; i <= pas; i++) {
          const t = i / pas;
          tampon(precedentGrattage.x + dx * t, precedentGrattage.y + dy * t);
        }
      } else {
        tampon(x, y);
      }

      ctx.restore();
      precedentGrattage = { x: x, y: y };
    }

    canvas.addEventListener("pointerdown", function (e) {
      estEnTrainDeCliquer = true;
      precedentGrattage = null;
      // L'instantane des pixels est relu seulement ici, au moment ou la
      // main part : plus jamais pendant ou a la fin du geste.
      if (photoSale) actualiserPhotoData();
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      gratterEtEjecter(e.clientX, e.clientY);
    });

    canvas.addEventListener("pointermove", function (e) {
      if (!estEnTrainDeCliquer) return;
      // Les evenements pointermove peuvent arriver bien plus vite que
      // l'ecran ne s'affiche : on ne gratte qu'une fois par image,
      // a la derniere position connue. Le grattage reste fluide meme
      // sur telephone.
      if (griffeAttendue) {
        griffeAttendue[0] = e.clientX;
        griffeAttendue[1] = e.clientY;
        return;
      }
      griffeAttendue = [e.clientX, e.clientY];
      requestAnimationFrame(function () {
        const p = griffeAttendue;
        griffeAttendue = null;
        if (p && estEnTrainDeCliquer) gratterEtEjecter(p[0], p[1]);
      });
    });

    const stopperGomme = function (e) {
      if (estEnTrainDeCliquer) {
        estEnTrainDeCliquer = false;
        precedentGrattage = null;
        photoSale = true; // l'instantane sera relu au prochain geste
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    };

    canvas.addEventListener("pointerup", stopperGomme);
    canvas.addEventListener("pointercancel", stopperGomme);

    // Bouton souffle (PNG/blow.png) : pose dans la colonne de
    // gauche, sur le flanc gauche de la colline de gauche, et
    // COLLE AU BAS DE LA PHOTO (regle CSS .bouton-vent, position
    // absolute DANS le cadre : le bas de l'icone affleure le bas
    // de l'image, il defile avec elle). Le micro n'est
    // active qu'apres ce clic (permission navigateur),
    // jamais automatiquement.
    const boutonVent = document.createElement("button");
    boutonVent.type = "button";
    boutonVent.className = "bouton-vent";
    iconeVent(boutonVent);
    boutonVent.title = "Nettoyer en soufflant dans le micro";
    boutonVent.setAttribute("aria-label", "Nettoyer en soufflant dans le micro");
    boutonVent.addEventListener("click", function () {
      demarrerMicroVent(boutonVent);
    });
    cadre.appendChild(boutonVent);

    // Icone rafraichissement : tire une NOUVELLE photo d'accueil
    // au hasard, SANS recharger la page. Meme regle
    // anti-repetition, photo de dessous retiree a nouveau,
    // grattage et monticule remis a zero. Pose JUSTE A GAUCHE de
    // l'icone souffle, son bas aligne sur le bas de la photo
    // (regle CSS .bouton-rafraichir, position absolute dans le
    // cadre, comme le souffle). Sur mobile, la regle CSS le cale
    // sur la ligne du nom du site, en haut a droite.
    function rafraichirImageAccueil() {
      reinitialiserPhysique();
      photoSale = true;
      estEnTrainDeCliquer = false;
      precedentGrattage = null;
      // La photo de dessous se masque le temps du chargement : les
      // trous de l'ancien grattage ne doivent pas spoiler la
      // nouvelle photo cachee. chargerEtDessiner la revele.
      imgDessous.style.visibility = "hidden";
      if (totalAccueil > 0) tirerImageAccueil(totalAccueil);
      else { photo.src = src; imgDessous.src = src; }
    }
    const boutonRafraichir = document.createElement("button");
    boutonRafraichir.type = "button";
    boutonRafraichir.className = "bouton-rafraichir";
    const imgReload = document.createElement("img");
    imgReload.src = ICONE_RELOAD;
    imgReload.alt = "";
    imgReload.decoding = "async";
    boutonRafraichir.appendChild(imgReload);
    boutonRafraichir.title = "Changer la photo";
    boutonRafraichir.setAttribute("aria-label", "Changer la photo d'accueil");
    boutonRafraichir.addEventListener("click", rafraichirImageAccueil);
    cadre.appendChild(boutonRafraichir);
  }

  /* --- SÃRIES CLASSIQUES --- */
  function dessiner(serie) {
    document.title = serie.titre + " - " + SITE.nom;
    if (serie.texte) {
      const p = document.createElement("p");
      p.className = "texte";
      p.textContent = serie.texte;
      contenu.appendChild(p);
    }
    const total = serie.images ? serie.images.length : 0;
    if (total === 0) {
      const p = document.createElement("p");
      p.className = "vide";
      p.textContent = "BientÃ´t.";
      contenu.appendChild(p);
      return;
    }

    const chemin = function (n) {
      return "images/" + serie.dossier + "/" + encodeURIComponent(serie.images[n]).replace(/%23/g, '#');
    };

    const fig = document.createElement("figure");
    fig.className = "serie";

    // Ordre de defilement : lineaire partout, aleatoire pour Old fashion
    const aleatoire = estSerieAleatoire(serie);
    const historique = [0]; // dernieres images montrees, la plus recente en fin

    function tirerAleatoire() {
      // On interdit les 20 dernieres images montrees : la meme
      // image ne peut donc pas revenir avant 20 images differentes.
      const exclus = historique.slice(-20);
      let candidats = [];
      for (let n = 0; n < total; n++) {
        if (exclus.indexOf(n) === -1) candidats.push(n);
      }
      if (candidats.length === 0) {
        // Toutes les images sont encore bloquees (petite serie) :
        // on repart de zero en gardant seulement l'image en cours.
        candidats = [];
        for (let n = 0; n < total; n++) {
          if (n !== i) candidats.push(n);
        }
        historique.length = 0;
        historique.push(i);
      }
      const n = candidats[Math.floor(Math.random() * candidats.length)];
      historique.push(n);
      return n;
    }

    function avancer(sens) {
      if (aleatoire) { montrer(tirerAleatoire()); return; }
      montrer(i + sens);
    }

    const conteneur = document.createElement("div");
    conteneur.className = "zone-interactive-conteneur";

    const vitrine = document.createElement("div");
