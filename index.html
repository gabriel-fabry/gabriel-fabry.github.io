<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Fabry</title>
<meta name="description" content="Gabriel Fabry, photographie.">
<style>
  /* REGLAGE : COULEURS ET MARGES DU SITE */
  :root {
    --fond: #ffffff;
    --texte: #111111;
    --discret: #6b6b6b;
    --marge: 32px;
    --largeur-menu: 270px;
    --rouge: #ff1744;
    --vert: #00e676;
    --bleu: #2979ff;
    /* REGLAGE : EFFET AU SURVOL DU MENU ET DU TITRE */
    --survol-rotation: -3deg;
    --survol-echelle: 1.15;
    --survol-duree: .2s;
    --survol-origine: left center;
    /* REGLAGE : ICONE RELOAD -- duree du tour au survol, angle de repos (60deg = 1/6 de tour horaire) */
    --reload-duree: .6s;
    --reload-angle: 60deg;
    /* REGLAGE : HAUTEUR DE LA BOITE COLOREE DU MENU -- 1.2 = fin, 1.55 = haute */
    --boite-ligne: 1.2;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%3E%3Cpolygon%20points='0,0%200,18%204.5,13.5%208,21%2011,19.5%207.5,12%2013.5,12'%20fill='%232979ff'%20stroke='%23ffffff'%20stroke-width='1.5'/%3E%3C/svg%3E") 0 0, auto;
  }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 14px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif;
    touch-action: manipulation;
  }
  a, button {
    color: inherit;
    cursor: pointer;
  }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--texte); outline-offset: 3px; }

  .sr-seul {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  aside {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--largeur-menu);
    padding: var(--marge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
    pointer-events: none;
  }
  aside .nom,
  aside nav a,
  aside nav button,
  aside .bouton-rafraichir { pointer-events: auto; }
  /* REGLAGE : TYPO DU TITRE */
  .nom {
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 40px;
    cursor: pointer;
    transform-origin: var(--survol-origine);
    transition: transform var(--survol-duree) ease;
  }
  /* REGLAGE : POINTS BRAILLE -- taille d'une cellule (width/height), espace entre lettres */
  nav .menu-texte.braille-actif {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(var(--boite-ligne) * 1em + 2px);
  }
  nav .braille-cellule {
    flex: none;
    width: .56em;
    height: .8em;
    fill: currentColor;
    overflow: visible;
  }
  nav .braille-cellule + .braille-cellule { margin-left: .26em; }
  .nom:hover, .nom:focus-visible, .nom:active {
    transform: rotate(var(--survol-rotation)) scale(var(--survol-echelle));
  }
  .nom .lettre { display: inline-block; transition: color .25s ease; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin: 0 0 3px; }
  nav a, nav button {
    display: inline-block;
    vertical-align: top;
    padding: 1px 5px;
    margin: calc((1.55 - var(--boite-ligne)) * .5em - 1px) -5px;
    border: 0;
    background: none;
    font: inherit;
    line-height: var(--boite-ligne);
    font-style: italic;
    color: var(--discret);
    text-align: left;
    text-decoration: none;
    transition: color var(--survol-duree) ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  nav .menu-texte {
    pointer-events: none;
    display: block;
    margin: -1px -5px;
    padding: 1px 5px;
    transform-origin: var(--survol-origine);
    background: linear-gradient(var(--survol-fond, transparent), var(--survol-fond, transparent)) no-repeat left center / 0% 100%;
    transition: background-size var(--survol-duree) ease, transform var(--survol-duree) ease;
  }
  nav a[aria-current="page"] { color: var(--texte); text-decoration: underline; text-underline-offset: 3px; }
  nav button[aria-expanded="true"] { color: var(--texte); }
  nav a:hover, nav button:hover,
  nav a:active, nav button:active,
  nav a:focus-visible, nav button:focus-visible {
    color: var(--survol-texte, var(--texte));
  }
  nav a:hover .menu-texte, nav button:hover .menu-texte,
  nav a:active .menu-texte, nav button:active .menu-texte,
  nav a:focus-visible .menu-texte, nav button:focus-visible .menu-texte {
    background-size: 100% 100%;
    transform: rotate(var(--survol-rotation)) scale(var(--survol-echelle));
  }
  nav ul ul { margin: 3px 0 10px 14px; }
  nav ul ul[hidden] { display: none; }
  #menu > ul > li:last-child { margin-top: 16px; }

  main {
    margin-left: var(--largeur-menu);
    padding: var(--marge) 48px var(--marge) var(--marge);
    max-width: calc(var(--largeur-menu) + 1180px);
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  body.planche-ouverte main {
    max-width: none;
    padding-right: var(--marge);
  }

  main .texte { max-width: 60ch; margin: 0 0 32px; color: var(--discret); white-space: pre-line; }
  main figure { margin: 0; }
  /* REGLAGE : HAUTEUR UNIFORME DES IMAGES */
  main img {
    display: block;
    height: calc(100vh - 2 * var(--marge));
    width: auto;
    max-width: none;
  }
  main .index-miniatures button img {
    height: 100% !important;
    width: auto !important;
    object-fit: contain;
    max-width: none;
  }
  main figure.serie img { height: calc(100vh - 2 * var(--marge)); }
  .vide { color: var(--discret); margin-top: 8px; }

  #canvas-accueil {
    display: block;
    position: relative;
    z-index: 1;
    height: calc(100vh - 2 * var(--marge));
    height: calc(100dvh - 2 * var(--marge));
    width: auto;
    cursor: grab !important;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #canvas-accueil:active {
    cursor: grabbing !important;
  }

  .filtre-ir {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    filter: invert(1);
  }

  .tramage-canvas {
    display: block;
    image-rendering: pixelated;
  }

  .pli-conteneur {
    position: absolute;
    perspective: 1400px;
    z-index: 5;
  }
  .pli-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-repeat: no-repeat;
  }
  .pli-flap {
    position: absolute;
    background-repeat: no-repeat;
    z-index: 2;
  }

  .tramage-video {
    display: block;
    height: calc(100vh - 2 * var(--marge));
    width: auto;
    background: #111111;
  }

.photo-dessous {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .tas-affichage {
    position: absolute;
    top: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* REGLAGE : CHIEN */
  .chien-dort {
    position: fixed;
    left: var(--marge);
    bottom: calc(var(--marge) + -10px);
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    z-index: 50;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .chien-dort.tremble { animation: tremble-chien .3s linear; }
  @keyframes tremble-chien {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  .bulle-chien {
    position: fixed;
    left: var(--marge);
    bottom: calc(var(--marge) + 94px);
    max-width: var(--largeur-menu);
    background: #ffffff;
    border: 0px solid #111111;
    border-radius: 5px;
    padding: 10px 14px;
    z-index: 55;
    pointer-events: auto;
    cursor: pointer;
    box-sizing: border-box;
  }
  .bulle-chien::after {
	display: none;
    content: "";
    position: absolute;
    left: 28px;
    bottom: -7px;
    width: 12px;
    height: 12px;
    background: #eaf2fb;
    border-right: 2px solid #111111;
    border-bottom: 2px solid #111111;
    transform: rotate(45deg);
  }
  .bulle-chien span { display: block; white-space: pre-wrap; }
  /* REGLAGE : BULLE DU CHIEN */
  .bulle-fleche {
    position: absolute;
    left: 80%;
    bottom: 7px;
    width: 0;
    height: 0;
    border-left: var(--fleche-taille, 4px) solid transparent;
    border-right: var(--fleche-taille, 4px) solid transparent;
    border-top: calc(var(--fleche-taille, 4px) * 1.2) solid #111111;
    transform: translateX(-50%);
    pointer-events: none;
    filter:
      drop-shadow( 1px 0 0 #ffffff) drop-shadow(-1px 0 0 #ffffff)
      drop-shadow( 0 1px 0 #ffffff) drop-shadow( 0 -1px 0 #ffffff);
    animation: bulle-fleche-clignote var(--fleche-periode, 800ms) linear infinite;
  }
  @keyframes bulle-fleche-clignote {
    0%, 49%   { opacity: 5; }
    50%, 100% { opacity: 0; }
  }
  .chien-dort.chien-planche {
    background-repeat: no-repeat;
    background-size: 1700% 100%;
  }
  .chien-laser {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 51;
  }
  html.chien-pointeur-detruit,
  html.chien-pointeur-detruit * { cursor: none !important; }
  html.chien-pointeur-detruit #canvas-accueil,
  html.chien-pointeur-detruit #canvas-accueil:active { cursor: none !important; }

  .figure-accueil {
    position: relative;
    margin-bottom: 0;
  }
  body.page-accueil main { padding-bottom: var(--marge); }
  .cadre-accueil {
    position: relative;
    display: inline-block;
    vertical-align: bottom;
  }
  .bouton-vent {
    position: absolute;
    z-index: 3;
    /* REGLAGE : ICONE SOUFFLE */
    left: calc(-24px - var(--marge));
    bottom: 0;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bouton-rafraichir {
    position: absolute;
    z-index: 3;
    /* REGLAGE : ICONE RELOAD */
    left: calc(-68px - var(--marge));
    bottom: 0;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bouton-vent img, .bouton-rafraichir img {
    display: block;
    /* REGLAGE : TAILLE DES ICONES */
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
  }
  .bouton-rafraichir img { transform: rotate(var(--reload-angle)) scaleY(-1); }
  .bouton-rafraichir:hover img, .bouton-rafraichir:focus-visible img {
    animation: tour-reload var(--reload-duree) ease;
  }
  @keyframes tour-reload {
    from { transform: rotate(var(--reload-angle)) scaleY(-1); }
    to { transform: rotate(calc(var(--reload-angle) + 360deg)) scaleY(-1); }
  }

  .zone-interactive-conteneur {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .zone-interactive-conteneur.plein-largeur {
    display: block;
    width: 100%;
  }

  .zone-clic {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    z-index: 10;
    background: transparent;
    border: none;
    padding: 0; margin: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .zone-clic.gauche {
    left: 0;
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%20viewBox='0%200%2032%2032'%3E%3Cpolygon%20points='29,12%2014,12%2014,5%203,16%2014,27%2014,20%2029,20'%20fill='%23ff1744'%20stroke='%23ffffff'%20stroke-width='2.5'%20stroke-linejoin='round'%20paint-order='stroke'/%3E%3C/svg%3E") 12 12, pointer;
  }
  .zone-clic.gauche.vers-index {
    cursor: none;
  }
  #curseur-index {
    position: fixed;
    left: 0; top: 0;
    z-index: 9990;
    display: none;
    pointer-events: none;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    transform: translate(12px, -50%);
  }
  #curseur-index .lettre { display: inline-block; transition: color .25s ease; }
  .zone-clic.droite {
    right: 0;
    cursor: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%20viewBox='0%200%2032%2032'%3E%3Cpolygon%20points='3,12%2018,12%2018,5%2029,16%2018,27%2018,20%203,20'%20fill='%2300e676'%20stroke='%23ffffff'%20stroke-width='2.5'%20stroke-linejoin='round'%20paint-order='stroke'/%3E%3C/svg%3E") 12 12, pointer;
  }

  .vitrine { position: relative; display: block; max-width: 100%; }
  .vitrine img { display: block; }
  .vitrine.emoji-actif > img {
    visibility: hidden !important;
    opacity: 0 !important;
  }
  .vitrine img.superpose {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity .45s ease;
  }
  .vitrine img.superpose.fondu { opacity: 0; }

  .pao-duo {
    display: flex;
    gap: 32px;
    align-items: flex-end;
    width: auto;
  }
  .pao-cadre {
    position: relative;
    flex: 0 1 auto;
    width: auto;
  }
  .pao-cadre img {
    width: auto;
    height: calc(100vh - 2 * var(--marge));
    max-height: none;
    object-fit: contain;
  }
  .pao-cadre img.superpose {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity .45s ease;
  }
  .pao-cadre img.superpose.fondu { opacity: 0; }

  /* REGLAGE : COMPTEUR DE SERIE */
  main .compteur {
    position: fixed;
    left: calc(var(--largeur-menu) - 12px);
    transform: translateX(-100%);
    bottom: calc(var(--marge) - 5px);
    margin: 0;
    z-index: 40;
  }
  main .compteur button { pointer-events: auto; }

  .index-miniatures {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: flex-start;
    height: calc(100vh - 2 * var(--marge));
    overflow: hidden;
  }
  .index-miniatures button {
    padding: 0;
    border: 0;
    background: none;
    line-height: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
    overflow: hidden;
  }
  .index-miniatures button img {
    display: block;
    width: auto;
    height: 100%;
    object-fit: contain;
  }
  .index-miniatures button {
    transition: opacity var(--planche-retour, .3s) ease,
                filter var(--planche-retour, .3s) ease;
  }
  .index-miniatures button:hover,
  .index-miniatures button:focus-visible {
    transition: opacity var(--planche-entree, .3s) ease,
                filter var(--planche-entree, .3s) ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .index-miniatures button {
      opacity: var(--planche-opacite, 0.7);
      filter: grayscale(var(--planche-gris, 1));
    }
    .index-miniatures button:hover,
    .index-miniatures button:focus-visible {
      opacity: 1;
      filter: grayscale(0);
    }
  }
  .compteur button { border: 0; background: none; padding: 0 8px; font: inherit; color: var(--discret); -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .compteur button:hover { color: var(--texte); }

  #canvas-explosion {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  /* --- Jeu de la mouche --- */
  #jeu-mouches {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 9000;
  }
  .mouche {
    position: absolute;
    top: 0; left: 0;
    width: 7px; height: 7px;
    opacity: 0;
    transition: opacity .2s ease;
    will-change: transform;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .mouche.visible { opacity: 1; }
  .mouche svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .mouche .ailes {
    transform-box: fill-box;
    transform-origin: center;
    animation: battement-pixel .04s steps(2, jump-none) infinite alternate;
  }
  .mouche.pose .ailes,
  .mouche.touchee .ailes,
  .mouche.morte .ailes { animation: none; }

  .mouche.boss {
    width: 42px; height: 42px;
  }
  .mouche.boss.phase2 .corps { fill: #8a0f1f; }
  .mouche.touche {
    animation: boss-hit .18s linear;
  }
  @keyframes boss-hit {
    50% { filter: brightness(4); }
  }
  .mot-fin {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .8s ease;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    cursor: pointer;
    z-index: 9500;
  }
  .mot-fin.visible { opacity: 1; }
  .mot-fin canvas { display: block; image-rendering: pixelated; }

  #hud-jeu {
    position: fixed;
    top: 20px; right: 32px;
    z-index: 9100;
    text-align: right;
    user-select: none;
    -webkit-user-select: none;
  }
  /* REGLAGE : ESPACEMENT HUD */
  #hud-compteur { margin-bottom: 6px; }
  #hud-compteur,
  #hud-timer { display: flex; justify-content: flex-end; }
  #hud-compteur canvas,
  #hud-timer canvas { display: block; image-rendering: pixelated; }

  #barre-vie-boss {
    position: fixed;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    z-index: 9100;
    pointer-events: none;
  }
  #nom-boss { margin-bottom: 8px; }
  #nom-boss canvas { display: inline-block; }
  #barre-vie-piste { height: 9px; width: 35%; margin: 0 auto; background: rgba(17, 17, 17, 0.08); }
  #barre-vie-remplie {
    height: 100%;
    width: 100%;
    background: var(--rouge);
    transition: width .12s steps(2, jump-none);
  }

  #barre-charge {
    position: fixed;
    width: 44px; height: 8px;
    border: 2px solid #111111;
    background: #ffffff;
    z-index: 9600;
    pointer-events: none;
  }
  #barre-charge-remplie {
    height: 100%;
    width: 0%;
    background: var(--rouge);
  }
  #barre-charge.chargee { animation: clignote-charge .18s steps(2, jump-none) infinite; }
  @keyframes clignote-charge {
    50% { border-color: var(--rouge); background: #111111; }
  }

  html.tapette-animee,
  html.tapette-animee *,
  html.zone-tapette.tapette-animee,
  html.zone-tapette.tapette-animee * { cursor: none !important; }
  #tapette-charge {
    position: fixed;
    width: 56px; height: 56px;
    z-index: 9700;
    pointer-events: none;
    transform-origin: 50% 90%;
    transition: transform .22s cubic-bezier(.2,.8,.3,1);
    will-change: transform;
  }
  #tapette-charge svg { display: block; width: 100%; height: 100%; }
  .tapette-anim {
    position: fixed;
    pointer-events: none;
    z-index: 9700;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  #tapette-charge.clignote { animation: clignote-tapette .3s steps(2, jump-none) infinite; }
  @keyframes clignote-tapette { 50% { opacity: 0.4; } }
  #tapette-charge.frappe { transition: transform .07s ease-in; }

  .mouche.boss.secoue { animation: boss-secoue .45s steps(2, jump-none) 3; }
  @keyframes boss-secoue {
    20% { margin: -3px 3px 0 -3px; }
    40% { margin: 2px -3px 0 2px; }
    60% { margin: -2px 2px 0 -2px; }
    80% { margin: 3px -2px 0 3px; }
  }

  @keyframes battement-pixel {
    from { transform: scaleY(1); opacity: 1; }
    to   { transform: scaleY(0.4); opacity: 0.6; }
  }

  body.screen-shake {
    animation: shake-anim 0.25s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake-anim {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(5px, -4px, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 5px, 0); }
    40%, 60% { transform: translate3d(6px, -3px, 0); }
  }

  body.screen-shake-fort {
    animation: shake-fort-anim 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake-fort-anim {
    10%, 90% { transform: translate3d(-6px, 4px, 0); }
    20%, 80% { transform: translate3d(10px, -8px, 0); }
    30%, 50%, 70% { transform: translate3d(-12px, 10px, 0); }
    40%, 60% { transform: translate3d(12px, -6px, 0); }
  }

  html.zone-tapette,
  html.zone-tapette * {
    cursor: none !important;
  }
  #curseur-tapette {
    position: fixed; top: 0; left: 0;
    max-width: 64px; max-height: 64px;
    pointer-events: none;
    z-index: 9650;
    image-rendering: pixelated;
    display: none;
  }

  @media (max-width: 760px) {
    :root { --marge: 20px; }
    aside { position: relative; width: auto; overflow: visible; overflow-x: clip; }
    .nom { align-self: flex-start; margin-bottom: 24px; }
    #menu > ul { display: flex; flex-wrap: wrap; gap: 4px 18px; }
    #menu > ul > li { margin: 0; }
    #menu > ul > li:last-child { margin-top: 0; }
    nav ul ul { margin: 2px 0 0 14px; }
    main { margin-left: 0; padding: 0 var(--marge) 80px; max-width: none; min-height: auto; overflow-x: clip; }
    main img { height: auto; max-height: none; max-width: 100%; }
    main figure.serie img { height: auto; max-width: 100%; }
    #canvas-accueil {
      height: auto;
      width: auto;
      max-width: 100%;
      max-height: 85vh;
      max-height: 85dvh;
    }
    .cadre-accueil { width: 100%; }

    .pao-duo { flex-direction: column; gap: 20px; }
    .pao-cadre { width: 100%; }
    .pao-cadre img { height: auto; width: 100%; max-height: none; }
    main .compteur { position: static; transform: none; margin-top: 14px; }
    .bouton-vent { position: absolute; left: auto; right: 0; top: auto; bottom: calc(100% + var(--marge)); margin: 0; }
    .bouton-vent img, .bouton-rafraichir img {
      width: 20px;
      height: 20px;
    }
    .bouton-rafraichir {
      position: absolute;
      top: calc(var(--marge) + 3px);
      left: auto;
      bottom: auto;
      right: var(--marge);
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 11;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bouton-rafraichir:hover img, .bouton-rafraichir:focus-visible img { animation: none; }
    nav a, nav button, nav .menu-texte, .nom, .nom .lettre, .vitrine img.superpose, .pao-cadre img.superpose { transition: none; }
    nav a:hover .menu-texte, nav button:hover .menu-texte, nav a:active .menu-texte, nav button:active .menu-texte,
    nav a:focus-visible .menu-texte, nav button:focus-visible .menu-texte,
    .nom:hover, .nom:active, .nom:focus-visible { transform: none; }
    .mouche .ailes { animation: none; }
    .mouche.touche { animation: none; }
    .mot-fin { transition: none; }
    #barre-vie-remplie { transition: none; }
    body.screen-shake { animation: none; }
    body.screen-shake-fort { animation: none; }
    #tapette-charge.clignote { animation: none; }
    #barre-charge.chargee { animation: none; }
    .mouche.boss.secoue { animation: none; }
    .chien-dort.tremble { animation: none; }
  }
</style>
</head>
<body>

<aside>
  <a class="nom" href="#" id="nom"></a>
  <nav id="menu" aria-label="Séries"></nav>
</aside>

<main id="contenu" tabindex="-1"></main>

<canvas id="canvas-explosion"></canvas>

<script src="series.js"></script>
<script>
(function () {
  const menu = document.getElementById("menu");
  const contenu = document.getElementById("contenu");
  const liens = {};
  const groupes = [];

  // REGLAGE : COULEURS DE LA VAGUE
  const PALETTE_RVB = ["#ff1744", "#00e676", "#2979ff"];

  // REGLAGE : VITESSE DE LA VAGUE DU TITRE
  const VAGUE_VITESSE = 100;

  const nom = document.getElementById("nom");
  const lettres = [];
  SITE.nom.split("").forEach(function (c) {
    const s = document.createElement("span");
    s.className = "lettre";
    s.textContent = c;
    nom.appendChild(s);
    if (c !== " ") lettres.push(s);
  });
  lettres.forEach(function (s) {
    s.style.transition = "color " +
      Math.min(250, Math.round(VAGUE_VITESSE * 0.6)) + "ms ease";
  });

  // REGLAGE : LARGEUR DES BANDES DE LA VAGUE DU TITRE
  const BANDE_NOM = 4;
  let etapeNom = 0;
  function colorerNom() {
    const cycle = PALETTE_RVB.length * BANDE_NOM;
    lettres.forEach(function (s, i) {
      const pos = ((i - etapeNom) % cycle + cycle) % cycle;
      s.style.color = PALETTE_RVB[Math.floor(pos / BANDE_NOM)];
    });
    etapeNom++;
  }
  function decolorerNom() {
    lettres.forEach(function (s) { s.style.color = ""; });
  }

  function figerLargeurCompteur(num, total) {
    if (num.dataset.fige || !num.isConnected) return;
    const garde = num.textContent;
    num.style.display = "inline-block";
    num.style.textAlign = "center";
    num.style.fontVariantNumeric = "tabular-nums";
    num.style.width = "";
    let max = 0;
    ["index", numeroCompteur(0, total)].forEach(function (t) {
      num.textContent = t;
      max = Math.max(max, num.getBoundingClientRect().width);
    });
    num.textContent = garde;
    if (max > 0) {
      num.style.width = Math.ceil(max) + "px";
      num.dataset.fige = "1";
    }
  }
  function numeroCompteur(n, total) {
    const largeur = Math.max(2, String(total).length);
    return String(n).padStart(largeur, "0") + " / " + String(total).padStart(largeur, "0");
  }

  const BANDE_INDEX = 2;
  const curseurIndex = document.createElement("div");
  curseurIndex.id = "curseur-index";
  curseurIndex.setAttribute("aria-hidden", "true");
  const lettresIndex = [];
  "index".split("").forEach(function (c) {
    const s = document.createElement("span");
    s.className = "lettre";
    s.textContent = c;
    s.style.transition = "color " +
      Math.min(250, Math.round(VAGUE_VITESSE * 0.6)) + "ms ease";
    curseurIndex.appendChild(s);
    lettresIndex.push(s);
  });
  document.body.appendChild(curseurIndex);

  let etapeIndex = 0;
  let minuteurIndex = null;
  function colorerIndex() {
    const cycle = PALETTE_RVB.length * BANDE_INDEX;
    lettresIndex.forEach(function (s, i) {
      const pos = ((i - etapeIndex) % cycle + cycle) % cycle;
      s.style.color = PALETTE_RVB[Math.floor(pos / BANDE_INDEX)];
    });
    etapeIndex++;
  }
  function montrerCurseurIndex(x, y) {
    curseurIndex.style.left = x + "px";
    curseurIndex.style.top = y + "px";
    if (minuteurIndex === null) {
      curseurIndex.style.display = "block";
      colorerIndex();
      if (!mouvementReduit.matches) minuteurIndex = setInterval(colorerIndex, VAGUE_VITESSE);
      else minuteurIndex = 0;
    }
  }
  function cacherCurseurIndex() {
    if (minuteurIndex !== null) {
      if (minuteurIndex) clearInterval(minuteurIndex);
      minuteurIndex = null;
    }
    curseurIndex.style.display = "none";
  }
  function zoneIndexSous(el) {
    return el && el.closest ? el.closest(".zone-clic.gauche.vers-index") : null;
  }
  let sourisX = null, sourisY = null;
  function reevaluerCurseurIndex() {
    if (sourisX === null) return;
    if (zoneIndexSous(document.elementFromPoint(sourisX, sourisY))) {
      montrerCurseurIndex(sourisX, sourisY);
    } else {
      cacherCurseurIndex();
    }
  }
  function reevaluerCurseurIndexPlusTard() {
    reevaluerCurseurIndex();
    requestAnimationFrame(reevaluerCurseurIndex);
  }
  document.addEventListener("mousemove", function (e) {
    sourisX = e.clientX; sourisY = e.clientY;
    if (zoneIndexSous(e.target)) montrerCurseurIndex(e.clientX, e.clientY);
    else cacherCurseurIndex();
  }, { passive: true });
  document.addEventListener("mouseleave", function () {
    sourisX = sourisY = null;
    cacherCurseurIndex();
  });
  window.addEventListener("blur", cacherCurseurIndex);
  window.addEventListener("hashchange", cacherCurseurIndex);

  let minuteurNom = null;
  const mouvementReduit = window.matchMedia("(prefers-reduced-motion: reduce)");

  nom.addEventListener("mouseenter", function () {
    colorerNom();
    if (!mouvementReduit.matches) minuteurNom = setInterval(colorerNom, VAGUE_VITESSE);
  });
  nom.addEventListener("touchstart", function () {
    colorerNom();
  }, { passive: true });
  nom.addEventListener("mouseleave", function () {
    clearInterval(minuteurNom);
    minuteurNom = null;
    decolorerNom();
  });
  nom.addEventListener("focus", function () {
    if (nom.matches(":focus-visible")) colorerNom();
  });
  nom.addEventListener("blur", decolorerNom);

  nom.addEventListener("click", function (e) {
    e.preventDefault();
    const dossierCourant = decodeURIComponent(location.hash.slice(1));
    const surAccueil =
      location.hash === "" || location.hash === "#" ||
      (dossierCourant !== "contact" && !trouver(dossierCourant));

    if (surAccueil) {
      window.location.reload();
    } else {
      location.hash = "";
      window.scrollTo(0, 0);
    }
  });

  function creerLien(serie) {
    const a = document.createElement("a");
    a.href = "#" + serie.dossier;
    a.textContent = serie.titre;
    a.addEventListener("click", function (e) {
      if (location.hash === "#" + serie.dossier) {
        e.preventDefault();
        window.location.reload();
      }
    });
    liens[serie.dossier] = a;
    return a;
  }

  const ul = document.createElement("ul");

  SERIES.forEach(function (serie) {
    const li = document.createElement("li");
    if (serie.sous) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = serie.titre;
      b.setAttribute("aria-expanded", "false");
      const sub = document.createElement("ul");
      sub.hidden = true;
      serie.sous.forEach(function (s) {
        const l = document.createElement("li");
        l.appendChild(creerLien(s));
        sub.appendChild(l);
      });
      b.addEventListener("click", function () {
        basculer(b, sub);
        if (location.hash === "#contact" && !sub.hidden) {
          location.hash = serie.sous[0].dossier;
        }
      });
      groupes.push({ bouton: b, liste: sub, enfants: serie.sous.map(function (s) { return s.dossier; }) });
      li.append(b, sub);
    } else {
      li.appendChild(creerLien(serie));
    }
    ul.appendChild(li);
  });

  const liContact = document.createElement("li");
  const btnContact = document.createElement("button");
  btnContact.type = "button";
  btnContact.textContent = "Contact";
  btnContact.setAttribute("aria-expanded", "false");

  const ulContact = document.createElement("ul");
  ulContact.hidden = true;

  const liMail = document.createElement("li");
  const aMail = document.createElement("a");
  aMail.href = "mailto:" + SITE.email;
  aMail.textContent = SITE.email;
  liMail.appendChild(aMail);

  const liInsta = document.createElement("li");
  const aInsta = document.createElement("a");
  aInsta.href = "https://www.instagram.com/" + SITE.instagram + "/";
  aInsta.target = "_blank";
  aInsta.rel = "noopener";
  aInsta.textContent = "@" + SITE.instagram;
  liInsta.appendChild(aInsta);

  ulContact.append(liMail, liInsta);

  btnContact.addEventListener("click", function () {
    if (location.hash === "#contact") {
      basculer(btnContact, ulContact);
    } else {
      location.hash = "contact";
    }
  });

  liContact.append(btnContact, ulContact);
  ul.appendChild(liContact);

  menu.appendChild(ul);

  function basculer(bouton, liste, ouvrir) {
    const etat = ouvrir === undefined ? liste.hidden : ouvrir;
    liste.hidden = !etat;
    bouton.setAttribute("aria-expanded", String(etat));
  }

  // REGLAGE : SECTIONS DU MENU QUI PASSENT EN BRAILLE AU SURVOL
  const BRAILLE_SECTIONS = ["voy"];
  const BRAILLE_LETTRES = {
    a: "⠁", b: "⠃", c: "⠉", d: "⠙", e: "⠑", f: "⠋", g: "⠛", h: "⠓", i: "⠊", j: "⠚", k: "⠅", l: "⠇", m: "⠍",
    n: "⠝", o: "⠕", p: "⠏", q: "⠟", r: "⠗", s: "⠎", t: "⠞", u: "⠥", v: "⠧", w: "⠺", x: "⠭", y: "⠽", z: "⠵",
    "é": "⠿", "à": "⠷", "è": "⠮", "ù": "⠾", "â": "⠡", "ê": "⠣", "î": "⠩", "ô": "⠹", "û": "⠱",
    "ë": "⠫", "ï": "⠻", "ü": "⠳", "ç": "⠯", "œ": "⠪"
  };
  function versBraille(texte) {
    let sortie = "";
    let enNombre = false;
    for (const ch of texte) {
      const bas = ch.toLowerCase();
      if (ch >= "0" && ch <= "9") {
        if (!enNombre) sortie += "⠼";
        enNombre = true;
        sortie += BRAILLE_LETTRES["jabcdefghi"[Number(ch)]];
      } else if (BRAILLE_LETTRES[bas]) {
        enNombre = false;
        sortie += (ch !== bas ? "⠠" : "") + BRAILLE_LETTRES[bas];
      } else {
        enNombre = false;
        sortie += ch;
      }
    }
    return sortie;
  }

  let indexCouleurMenu = 0;
  // REGLAGE : SURLIGNAGE DE LA SECTION CONTACT
  const CONTACT_FOND = "#000000";
  const CONTACT_TEXTE = "#ffffff";
  function colorerMenu(el) {
    if (el === btnContact || ulContact.contains(el)) {
      el.style.setProperty("--survol-fond", CONTACT_FOND);
      el.style.setProperty("--survol-texte", CONTACT_TEXTE);
      return;
    }
    const couleurHex = PALETTE_RVB[indexCouleurMenu];
    indexCouleurMenu = (indexCouleurMenu + 1) % PALETTE_RVB.length;

    el.style.setProperty("--survol-fond", couleurHex);
    el.style.setProperty("--survol-texte", "#ffffff");
  }

  menu.querySelectorAll("a, button").forEach(function (el) {
    el.addEventListener("mouseenter", function () { colorerMenu(el); });
    el.addEventListener("touchstart", function () { colorerMenu(el); }, { passive: true });
    el.addEventListener("focus", function () { if (el.matches(":focus-visible")) colorerMenu(el); });

    const zone = document.createElement("span");
    zone.className = "menu-texte";
    zone.textContent = el.textContent;
    el.textContent = "";
    el.appendChild(zone);

    const texteOrigine = zone.textContent;
    if (BRAILLE_SECTIONS.indexOf(texteOrigine.trim().toLowerCase()) === -1) return;
    const texteBraille = versBraille(texteOrigine);
    el.setAttribute("aria-label", texteOrigine);
    const POINTS_X = [1, 4.6];
    const POINTS_Y = [1, 4, 7];
    function afficherBraille() {
      zone.textContent = "";
      zone.classList.add("braille-actif");
      for (const ch of texteBraille) {
        const code = ch.codePointAt(0) - 0x2800;
        if (code < 0 || code > 255) { zone.appendChild(document.createTextNode(ch)); continue; }
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "braille-cellule");
        svg.setAttribute("viewBox", "0 0 5.6 8");
        svg.setAttribute("aria-hidden", "true");
        for (let d = 0; d < 6; d++) {
          if (!(code & (1 << d))) continue;
          const point = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          point.setAttribute("cx", POINTS_X[d < 3 ? 0 : 1]);
          point.setAttribute("cy", POINTS_Y[d % 3]);
          point.setAttribute("r", 1);
          svg.appendChild(point);
        }
        zone.appendChild(svg);
      }
    }
    let largeurBoite = 0;
    function enBraille() {
      if (zone.classList.contains("braille-actif")) return;
      if (!largeurBoite) {
        const largeurNormale = el.offsetWidth;
        afficherBraille();
        largeurBoite = Math.max(largeurNormale, el.offsetWidth);
        el.style.minWidth = largeurBoite + "px";
      } else {
        afficherBraille();
      }
    }
    function enNormal() {
      zone.textContent = texteOrigine;
      zone.classList.remove("braille-actif");
    }
    el.addEventListener("mouseenter", enBraille);
    el.addEventListener("mouseleave", enNormal);
    el.addEventListener("focus", function () { if (el.matches(":focus-visible")) enBraille(); });
    el.addEventListener("blur", enNormal);
    el.addEventListener("touchstart", enBraille, { passive: true });
    el.addEventListener("touchend", function () { setTimeout(enNormal, 800); });
    el.addEventListener("touchcancel", enNormal);
  });

  function trouver(dossier) {
    for (const s of SERIES) {
      if (s.sous) { for (const c of s.sous) if (c.dossier === dossier) return c; }
      else if (s.dossier === dossier) return s;
    }
    return null;
  }

  function estSerieAleatoire(serie) {
    const norm = function (s) {
      return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    };
    return norm(serie.dossier).indexOf("oldfashion") !== -1 ||
           norm(serie.titre).indexOf("oldfashion") !== -1;
  }

  function afficher() {
    document.body.classList.remove("page-accueil");
    document.body.classList.remove("planche-ouverte");
    const ancienRafraichir = document.querySelector(".bouton-rafraichir");
    if (ancienRafraichir) ancienRafraichir.remove();
    document.querySelectorAll(".chien-dort").forEach(function (el) { el.remove(); });
    arreterChienDort();
    if (!window.matchMedia ||
        !window.matchMedia("(max-width: 760px)").matches) {
      creerChienDort();
    }
    reinitialiserPhysique();
    arreterJeu();
    arreterMicroVent();
    arreterTramageCamera();

    const dossier = decodeURIComponent(location.hash.slice(1));

    if (dossier === "contact") {
      Object.values(liens).forEach(function (a) { a.removeAttribute("aria-current"); });
      groupes.forEach(function (g) { basculer(g.bouton, g.liste, false); });
      basculer(btnContact, ulContact, true);
      contenu.replaceChildren();
      const lecteur = document.createElement("p");
      lecteur.className = "sr-seul";
      lecteur.textContent = "Contact : " + SITE.email + ", Instagram @" + SITE.instagram + ".";
      contenu.appendChild(lecteur);
      document.title = "Contact - " + SITE.nom;
      demarrerJeu();
      window.scrollTo(0, 0);
      return;
    }
    basculer(btnContact, ulContact, false);

    const serie = trouver(dossier);

    if (!serie) {
      contenu.replaceChildren();
      Object.values(liens).forEach(function (a) { a.removeAttribute("aria-current"); });
      groupes.forEach(function (g) { basculer(g.bouton, g.liste, false); });
      dessinerAccueil();
      window.scrollTo(0, 0);
      return;
    }
    Object.keys(liens).forEach(function (d) {
      if (d === serie.dossier) liens[d].setAttribute("aria-current", "page");
      else liens[d].removeAttribute("aria-current");
    });
    groupes.forEach(function (g) {
      if (g.enfants.indexOf(serie.dossier) !== -1) basculer(g.bouton, g.liste, true);
    });
    contenu.replaceChildren();

    const nomDossier = serie.dossier.toUpperCase();
    if (nomDossier === "PAO") {
      dessinerPAO(serie);
    } else if (nomDossier === "CARNAVAL") {
      dessinerCarnaval(serie);
    } else {
      dessiner(serie);
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", afficher);

  /* --- MOTEUR DE PARTICULES --- */
  const canvasExp = document.getElementById("canvas-explosion");
  const ctxExp = canvasExp ? canvasExp.getContext("2d") : null;
  let particulesExp = [];
  let particulesOnde = [];
  let animExpId = null;

  // REGLAGE : GRAIN DU MONTICULE
  const TAS_TAILLE = 3;
  const TAS_BIN = 3;
  const TAS_SOL = 0;
  let tasCanvas = null;
  let tasCtx = null;
  let tasVue = null;
  let tasVueCtx = null;
  let tasElement = null;
  let tasDebord = 0;
  let tasLargeurImage = 0;
  let tasHauteurImage = 0;
  let tasHauteurs = [];
  let tasActif = false;
  let particulesTas = [];

  function redimensionnerCanvasExp() {
    if (!canvasExp) return;
    canvasExp.width = window.innerWidth;
    canvasExp.height = window.innerHeight;
    canvasExp.style.width = window.innerWidth + "px";
    canvasExp.style.height = window.innerHeight + "px";
    reveillerCadre();
  }
  window.addEventListener("resize", redimensionnerCanvasExp);
  redimensionnerCanvasExp();

  function dessinerCadreStatique() {
    if (!tasVueCtx || !tasCanvas) return;
    tasVueCtx.clearRect(0, 0, tasVue.width, tasVue.height);
    tasVueCtx.drawImage(tasCanvas, 0, 0);
  }

  function reveillerCadre() {
    if (animExpId || !tasActif || !tasCanvas || !tasElement) return;
    const rect = tasElement.getBoundingClientRect();
    if (Math.round(rect.width) !== tasLargeurImage || Math.round(rect.height) !== tasHauteurImage) {
      initialiserTas(tasElement);
    }
    dessinerCadreStatique();
  }

  function creerPixelPhysique(x, y, couleur) {
    if (!ctxExp) return;
    particulesExp.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -(0.5 + Math.random() * 2.2),
      taille: Math.floor(Math.random() * 3 + 2),
      couleur: couleur || "#ff1744",
      vie: 1.0,
      decroissance: 0.015 + Math.random() * 0.02
    });
    if (!animExpId) animerExp();
  }

  function creerOndeImpact(x, y, numero) {
    if (!ctxExp) return;
    numero = numero || 0;
    const nb = 46 + numero * 10;
    const rayonDepart = 12 + numero * 18;
    const vitesse = 5.5;

    for (let i = 0; i < nb; i++) {
      const angle = (i / nb) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
      particulesOnde.push({
        x: x + Math.cos(angle) * rayonDepart,
        y: y + Math.sin(angle) * rayonDepart,
        vx: Math.cos(angle) * vitesse,
        vy: Math.sin(angle) * vitesse,
        taille: 4,
        couleur: "#111111",
        vie: 1.0,
        decroissance: 0.026 + Math.random() * 0.012
      });
    }
    if (!animExpId) animerExp();
  }

  function initialiserTas(element) {
    const rect = element.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    tasElement = element;
    tasLargeurImage = Math.round(rect.width);
    tasHauteurImage = Math.round(rect.height);
    tasDebord = Math.round(tasLargeurImage * 0.25);
    if (!tasCanvas) tasCanvas = document.createElement("canvas");
    tasCanvas.width = tasLargeurImage + tasDebord * 2;
    tasCanvas.height = tasHauteurImage;
    tasCtx = tasCanvas.getContext("2d", { willReadFrequently: true });
    tasCtx.clearRect(0, 0, tasCanvas.width, tasCanvas.height);
    if (!tasVue) {
      tasVue = document.createElement("canvas");
      tasVue.className = "tas-affichage";
      element.parentNode.appendChild(tasVue);
    }
    tasVue.width = tasCanvas.width;
    tasVue.height = tasCanvas.height;
    tasVue.style.left = -tasDebord + "px";
    tasVue.style.width = rect.width + tasDebord * 2 + "px";
    tasVue.style.height = rect.height + "px";
    tasVueCtx = tasVue.getContext("2d");
    tasHauteurs = new Array(Math.ceil(tasCanvas.width / TAS_BIN)).fill(0);
    particulesTas = [];
    tasActif = true;
  }

  function creerParticuleTas(x, y, couleur) {
    if (!ctxExp || !tasActif) return;
    particulesTas.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 2,
      vy: 0.4 + Math.random() * 0.8,
      couleur: couleur,
      roulements: 0
    });
    if (!animExpId) animerExp();
  }

  function actualiserTas() {
    const solLocal = tasCanvas.height - TAS_SOL;

    for (let i = particulesTas.length - 1; i >= 0; i--) {
      const p = particulesTas[i];

      p.vy += 0.15;
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < TAS_TAILLE) { p.x = TAS_TAILLE; p.vx = Math.abs(p.vx) * 0.5; }
      if (p.x > tasCanvas.width - TAS_TAILLE) { p.x = tasCanvas.width - TAS_TAILLE; p.vx = -Math.abs(p.vx) * 0.5; }

      const bin = Math.min(tasHauteurs.length - 1, Math.max(0, Math.floor(p.x / TAS_BIN)));
      const surfaceY = solLocal - tasHauteurs[bin] - TAS_TAILLE;

      if (p.y >= surfaceY) {
        const hauteurGauche = bin > 0 ? tasHauteurs[bin - 1] : Infinity;
        const hauteurDroite = bin < tasHauteurs.length - 1 ? tasHauteurs[bin + 1] : Infinity;
        const plusBasse = Math.min(hauteurGauche, hauteurDroite);

        if (tasHauteurs[bin] - plusBasse > TAS_TAILLE && p.roulements < 8) {
          p.roulements++;
          p.x += (hauteurGauche <= hauteurDroite) ? -TAS_BIN : TAS_BIN;
          p.x = Math.min(tasCanvas.width - TAS_TAILLE, Math.max(TAS_TAILLE, p.x));
          p.y = surfaceY - 0.5;
          p.vy = 0.2;
          p.vx = 0;
        } else {
          tasHauteurs[bin] += TAS_TAILLE;
          tasCtx.globalAlpha = 1;
          tasCtx.fillStyle = p.couleur;
          tasCtx.fillRect(
            bin * TAS_BIN,
            Math.round(solLocal - tasHauteurs[bin]),
            TAS_BIN,
            TAS_TAILLE
          );
          particulesTas.splice(i, 1);
          continue;
        }
      }

      tasVueCtx.fillStyle = p.couleur;
      tasVueCtx.fillRect(Math.round(p.x - TAS_TAILLE / 2), Math.round(p.y), TAS_TAILLE, TAS_TAILLE);
    }
  }

  /* --- VENT AU MICROPHONE --- */
  let ventActif = false;
  let ventEnergie = 0;
  let ventRafale = 0;
  let ventFlux = null;
  let ventAudio = null;
  let ventAnalyseur = null;
  let ventDonnees = null;
  let ventIntervalle = null;
  let particulesVent = [];

  const ICONE_VENT = "sprites/blow.png";
  const ICONE_RELOAD = "sprites/reload.png";

  function iconeVent(bouton) {
    if (!bouton) return;
    bouton.textContent = "";
    const img = document.createElement("img");
    img.src = ICONE_VENT;
    img.alt = "";
    img.decoding = "async";
    bouton.appendChild(img);
  }

  function majBoutonVent(bouton, actif) {
    if (!bouton) return;
    bouton.title = actif ? "Souffle pour nettoyer !" : "Nettoyer en soufflant dans le micro";
  }

  function jouerClicVent(audioDejaOuvert, sens) {
    try {
      let audio = audioDejaOuvert || null;
      let fermerApres = false;
      if (!audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audio = new Ctx();
        fermerApres = true;
      }
      const t = audio.currentTime;
      const grave = 220;
      const aigu = 440;
      const notes = (sens === "off") ? [aigu, grave] : [grave, aigu];
      const dureeNote = 0.04;
      const pause = 0.035;
      let dernier = null;
      notes.forEach(function (freq, i) {
        const debut = t + i * (dureeNote + pause);
        const osc = audio.createOscillator();
        const vol = audio.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, debut);
        vol.gain.setValueAtTime(0.07, debut);
        vol.gain.exponentialRampToValueAtTime(0.0001, debut + dureeNote);
        osc.connect(vol);
        vol.connect(audio.destination);
        osc.start(debut);
        osc.stop(debut + dureeNote + 0.005);
        dernier = osc;
      });
      if (fermerApres && dernier) {
        dernier.onended = function () {
          try { audio.close(); } catch (e) {   }
        };
      }
    } catch (e) {   }
  }

  function arreterMicroVent() {
    if (ventIntervalle) { clearInterval(ventIntervalle); ventIntervalle = null; }
    if (ventFlux) {
      ventFlux.getTracks().forEach(function (t) { t.stop(); });
      ventFlux = null;
    }
    if (ventAudio) {
      try { ventAudio.close(); } catch (e) {   }
      ventAudio = null;
    }
    ventAnalyseur = null;
    ventDonnees = null;
    ventActif = false;
    ventEnergie = 0;
    ventRafale = 0;
    particulesVent = [];
  }

  function analyserSouffle() {
    if (!ventActif || !ventAnalyseur || !ventDonnees) return;
    ventAnalyseur.getByteTimeDomainData(ventDonnees);
    let somme = 0;
    for (let i = 0; i < ventDonnees.length; i++) {
      const v = (ventDonnees[i] - 128) / 128;
      somme += v * v;
    }
    const rms = Math.sqrt(somme / ventDonnees.length);
    // REGLAGE : SENSIBILITE DU SOUFFLE
    if (rms > 0.03) {
      const ancienne = ventEnergie;
      ventEnergie = Math.min(1, Math.max(0.9, (rms - 0.03) / 0.08));
      if (ventEnergie >= 0.7 && ancienne < 0.4) ventRafale = 20;
    } else {
      ventEnergie *= 0.86;
    }
    if (tasActif && ventEnergie > 0.2 && !animExpId) animerExp();
  }

  function demarrerMicroVent(bouton) {
    if (ventActif) {
      arreterMicroVent();
      majBoutonVent(bouton, false);
      jouerClicVent(null, "off");
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !Ctx) {
      jouerClicVent(null, "off");
      return;
    }
    ventAudio = new Ctx();
    ventAudio.resume();
    jouerClicVent(ventAudio, "on");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (flux) {
      ventFlux = flux;
      if (ventAudio && ventAudio.state === "suspended") ventAudio.resume();
      const source = ventAudio.createMediaStreamSource(flux);
      ventAnalyseur = ventAudio.createAnalyser();
      ventAnalyseur.fftSize = 512;
      source.connect(ventAnalyseur);
      ventDonnees = new Uint8Array(ventAnalyseur.fftSize);
      ventActif = true;
      ventEnergie = 0;
      majBoutonVent(bouton, true);
      ventIntervalle = setInterval(analyserSouffle, 50);
    }).catch(function () {
      if (ventAudio) {
        const audioRefus = ventAudio;
        jouerClicVent(audioRefus, "off");
        setTimeout(function () {
          try { audioRefus.close(); } catch (e) {   }
        }, 300);
        ventAudio = null;
      }
    });
  }

  function arracherLotsTas(bins) {
    const couleurs = [];
    if (bins.length === 0) return couleurs;
    const solLocal = tasCanvas.height - TAS_SOL;
    let yMin = Infinity;
    let yMax = -Infinity;
    const ys = [];
    for (let i = 0; i < bins.length; i++) {
      const y = Math.round(solLocal - tasHauteurs[bins[i]]);
      ys.push(y);
      if (y < yMin) yMin = y;
      if (y + TAS_TAILLE > yMax) yMax = y + TAS_TAILLE;
    }
    let px = null;
    try {
      px = tasCtx.getImageData(0, yMin, tasCanvas.width, yMax - yMin);
    } catch (e) {   }
    for (let i = 0; i < bins.length; i++) {
      const bin = bins[i];
      const y = ys[i];
      let couleur = "#111111";
      if (px) {
        const ix = (y - yMin) * px.width + bin * TAS_BIN;
        if (px.data[ix * 4 + 3] > 0) {
          couleur = "#" + ((1 << 24) + (px.data[ix * 4] << 16) +
            (px.data[ix * 4 + 1] << 8) + px.data[ix * 4 + 2]).toString(16).slice(1);
        }
      }
      tasCtx.clearRect(bin * TAS_BIN, y, TAS_BIN, TAS_TAILLE);
      tasHauteurs[bin] -= TAS_TAILLE;
      couleurs.push(couleur);
    }
    return couleurs;
  }

  function soufflerSurTas(force) {
    if (!tasActif || !tasCtx || force < 0.2) return;
    // REGLAGE : PUISSANCE DU SOUFFLE
    const arrachements = Math.round(30 + force * 260 + Math.random() * 10);
    const binsChoisis = [];
    const dejaVus = [];
    for (let k = 0; k < arrachements * 3 && binsChoisis.length < arrachements; k++) {
      const bin = Math.floor(Math.random() * tasHauteurs.length);
      if (tasHauteurs[bin] < TAS_TAILLE) continue;
      if (dejaVus.indexOf(bin) !== -1) continue;
      dejaVus.push(bin);
      binsChoisis.push(bin);
    }
    const couleurs = arracherLotsTas(binsChoisis);
    const solLocal = tasCanvas.height - TAS_SOL;
    for (let i = 0; i < binsChoisis.length; i++) {
      const bin = binsChoisis[i];
      particulesVent.push({
        x: bin * TAS_BIN + TAS_BIN / 2,
        y: solLocal - tasHauteurs[bin] - TAS_TAILLE,
        // REGLAGE : VITESSE DE LA POUSSIERE
        vx: 5 + Math.random() * 9,
        vy: -(1.5 + Math.random() * 4),
        vie: 1,
        decroissance: 0.012 + Math.random() * 0.02,
        couleur: couleurs[i]
      });
    }
    for (let i = 0; i < particulesTas.length; i++) {
      particulesTas[i].vx += 0.5 + force * 1.4;
      particulesTas[i].vy -= force * 0.5;
    }
  }

  function animerExp() {
    if (!ctxExp) return;
    ctxExp.clearRect(0, 0, canvasExp.width, canvasExp.height);

    if (tasActif && tasCanvas && tasElement && tasVueCtx) {
      const rect = tasElement.getBoundingClientRect();
      if (Math.round(rect.width) !== tasLargeurImage || Math.round(rect.height) !== tasHauteurImage) {
        initialiserTas(tasElement);
      } else {
        tasVueCtx.clearRect(0, 0, tasVue.width, tasVue.height);
        tasVueCtx.drawImage(tasCanvas, 0, 0);
        actualiserTas();
      }
    }

    for (let i = particulesExp.length - 1; i >= 0; i--) {
      const p = particulesExp[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.vie -= p.decroissance;
      if (p.vie <= 0) {
        particulesExp.splice(i, 1);
        continue;
      }
      ctxExp.fillStyle = p.couleur;
      ctxExp.globalAlpha = p.vie;
      ctxExp.fillRect(Math.round(p.x), Math.round(p.y), p.taille, p.taille);
    }
    ctxExp.globalAlpha = 1.0;

    for (let i = particulesOnde.length - 1; i >= 0; i--) {
      const p = particulesOnde[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vie -= p.decroissance;
      if (p.vie <= 0) {
        particulesOnde.splice(i, 1);
        continue;
      }
      ctxExp.fillStyle = "#111111";
      ctxExp.globalAlpha = p.vie;
      ctxExp.fillRect(Math.round(p.x), Math.round(p.y), p.taille, p.taille);
    }
    ctxExp.globalAlpha = 1.0;

    let forceVent = ventEnergie;
    if (ventRafale > 0) { forceVent = Math.min(1, forceVent + 0.4); ventRafale--; }
    if (forceVent > 0.2 && tasActif) soufflerSurTas(forceVent);
    if (particulesVent.length > 0 && tasElement) {
      const rectV = tasElement.getBoundingClientRect();
      for (let i = particulesVent.length - 1; i >= 0; i--) {
        const pv = particulesVent[i];
        pv.x += pv.vx;
        pv.y += pv.vy;
        pv.vy += 0.12 - forceVent * 0.22;
        pv.vx += forceVent * 0.06;
        pv.vie -= pv.decroissance;
        if (pv.vie <= 0 || pv.x > tasCanvas.width + tasDebord + 60 || pv.y > tasCanvas.height + 60) {
          particulesVent.splice(i, 1);
          continue;
        }
        ctxExp.fillStyle = pv.couleur;
        ctxExp.globalAlpha = Math.max(0, pv.vie);
        ctxExp.fillRect(Math.round(rectV.left - tasDebord + pv.x - TAS_TAILLE / 2), Math.round(rectV.top + pv.y), TAS_TAILLE, TAS_TAILLE);
      }
      ctxExp.globalAlpha = 1.0;
    }

    if (particulesExp.length > 0 || particulesOnde.length > 0 || particulesTas.length > 0 ||
        particulesVent.length > 0 || (tasActif && forceVent > 0.2)) {
      animExpId = requestAnimationFrame(animerExp);
    } else {
      animExpId = null;
      dessinerCadreStatique();
    }
  }

  function reinitialiserPhysique() {
    particulesExp = [];
    particulesOnde = [];
    particulesTas = [];
    particulesVent = [];
    tasCanvas = null;
    tasCtx = null;
    if (tasVue) { tasVue.remove(); tasVue = null; tasVueCtx = null; }
    tasHauteurs = [];
    tasActif = false;
    tasElement = null;
    tasDebord = 0;
    tasLargeurImage = 0;
    tasHauteurImage = 0;
    if (ctxExp) ctxExp.clearRect(0, 0, canvasExp.width, canvasExp.height);
  }

  /* --- PAQUET DE CARTES DE L'ACCUEIL --- */
  let paquetAccueil = null;
  function ecrireCookiePaquet(texte) {
    try {
      document.cookie = "accueil-paquet=" + encodeURIComponent(texte) +
        ";path=/;max-age=63072000;SameSite=Lax";
    } catch (e) {   }
  }
  function lireCookiePaquet() {
    try {
      const morceaux = document.cookie.split("accueil-paquet=");
      if (morceaux.length > 1) {
        return decodeURIComponent(morceaux[1].split(";")[0]);
      }
    } catch (e) {   }
    return null;
  }
  function chargerPaquetAccueil() {
    let brut = null;
    try {
      brut = JSON.parse(localStorage.getItem("accueil-paquet"));
    } catch (e) {   }
    if (!brut) {
      const texte = lireCookiePaquet();
      if (texte) {
        try { brut = JSON.parse(texte); } catch (e) {   }
      }
    }
    if (brut && typeof brut.max === "number" && Array.isArray(brut.reste)) {
      return { max: brut.max, reste: brut.reste, derniere: brut.derniere };
    }
    return null;
  }
  function sauvegarderPaquetAccueil() {
    if (!paquetAccueil) return;
    const texte = JSON.stringify(paquetAccueil);
    try {
      localStorage.setItem("accueil-paquet", texte);
      localStorage.removeItem("accueil-historique");
    } catch (e) {   }
    ecrireCookiePaquet(texte);
  }
  function melangerAccueil(liste) {
    for (let i = liste.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = liste[i];
      liste[i] = liste[j];
      liste[j] = temp;
    }
    return liste;
  }
  function preparerPaquetAccueil(total) {
    if (!paquetAccueil) paquetAccueil = chargerPaquetAccueil() || { max: 0, reste: [], derniere: null };
    if (total < paquetAccueil.max) {
      paquetAccueil.reste = paquetAccueil.reste.filter(function (n) { return n <= total; });
      paquetAccueil.max = total;
    }
    while (paquetAccueil.max < total) {
      paquetAccueil.max++;
      const pos = Math.floor(Math.random() * (paquetAccueil.reste.length + 1));
      paquetAccueil.reste.splice(pos, 0, paquetAccueil.max);
    }
    if (paquetAccueil.reste.length === 0 && total > 0) {
      const cartes = [];
      for (let n = 1; n <= total; n++) cartes.push(n);
      paquetAccueil.reste = melangerAccueil(cartes);
      if (total > 1 && paquetAccueil.reste[0] === paquetAccueil.derniere) {
        const j = 1 + Math.floor(Math.random() * (total - 1));
        const temp = paquetAccueil.reste[0];
        paquetAccueil.reste[0] = paquetAccueil.reste[j];
        paquetAccueil.reste[j] = temp;
      }
    }
    sauvegarderPaquetAccueil();
  }
  function tirerCarteAccueil(poolNumeros) {
    if (paquetAccueil.reste.length === 0) preparerPaquetAccueil(paquetAccueil.max);
    let carte = null;
    const chercherCarte = function () {
      for (let i = 0; i < paquetAccueil.reste.length; i++) {
        if (poolNumeros.indexOf(paquetAccueil.reste[i]) !== -1) {
          return paquetAccueil.reste.splice(i, 1)[0];
        }
      }
      return null;
    };
    carte = chercherCarte();
    if (carte === null && paquetAccueil.max > 0) {
      paquetAccueil.reste = [];
      preparerPaquetAccueil(paquetAccueil.max);
      carte = chercherCarte();
    }
    if (carte === null) {
      carte = paquetAccueil.reste.shift();
    }
    paquetAccueil.derniere = carte;
    return carte;
  }

  function nomImageAccueil(n) {
    return "images/accueil/accueil" + ("00000" + n).slice(-5) + ".jpg";
  }

  /* --- PAGE D'ACCUEIL & GRATTAGE --- */
  function dessinerAccueil() {
    document.title = SITE.nom;
    if (!SITE.accueil) return;
    document.body.classList.add("page-accueil");

    const fig = document.createElement("figure");
    fig.className = "figure-accueil";

    cadre.className = "cadre-accueil";

    imgDessous.className = "photo-dessous";
