    vitrine.className = "vitrine";
    const img = document.createElement("img");
    img.decoding = "async";
    vitrine.appendChild(img);
    conteneur.appendChild(vitrine);

    if (total > 1) {
      const btnGauche = document.createElement("button");
      btnGauche.type = "button";
      btnGauche.className = "zone-clic gauche";
      btnGauche.setAttribute("aria-label", "Image prÃ©cÃ©dente");

      const btnDroite = document.createElement("button");
      btnDroite.type = "button";
      btnDroite.className = "zone-clic droite";
      btnDroite.setAttribute("aria-label", "Image suivante");

      conteneur.append(btnGauche, btnDroite);

      btnGauche.addEventListener("click", function () { avancer(-1); });
      btnDroite.addEventListener("click", function () { avancer(1); });
    }

    fig.appendChild(conteneur);

    const compteur = document.createElement("div");
    compteur.className = "compteur";
    const prec = document.createElement("button");
    prec.type = "button";
    prec.id = "prec";
    prec.innerHTML = "&#8249;";
    prec.setAttribute("aria-label", "Image prÃ©cÃ©dente");
    const num = document.createElement("span");
    const suiv = document.createElement("button");
    suiv.type = "button";
    suiv.id = "suiv";
    suiv.innerHTML = "&#8250;";
    suiv.setAttribute("aria-label", "Image suivante");
    compteur.append(prec, num, suiv);
    if (total > 1) fig.appendChild(compteur);

    let i = 0;
    function montrer(n) {
      i = (n + total) % total;
      num.textContent = (i + 1) + " / " + total;
      // Prechargement de l'image suivante (inutile en ordre aleatoire :
      // on ne sait pas laquelle viendra)
      if (total > 1 && !aleatoire) { const suivante = new Image(); suivante.src = chemin((i + 1) % total); }
      remplacer(chemin(i));
    }

    function remplacer(src) {
      const ancienSrc = img.getAttribute("src");
      if (ancienSrc === src) return;
      let fait = false;
      const appliquer = function () {
        if (fait) return;
        fait = true;
        // La photo change : les brulures du laser gravees sur
        // l'ancienne partent avec elle (calque chien-brulure).
        if (img._chienBrulure) {
          img._chienBrulure.remove();
          img._chienBrulure = null;
        }
        img.alt = SITE.nom + ", " + serie.titre + ", image " + (i + 1);
        if (!ancienSrc || mouvementReduit.matches) {
          img.src = src;
          return;
        }
        const calque = img.cloneNode();
        calque.className = "superpose";
        vitrine.appendChild(calque);
        img.src = src;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { calque.classList.add("fondu"); });
          setTimeout(function () { calque.remove(); }, 700);
        });
        calque.addEventListener("transitionend", function () { calque.remove(); });
      };
      const precharge = new Image();
      precharge.onload = appliquer;
      precharge.onerror = function () { fait = true; img.src = src; };
      precharge.src = src;
      if (precharge.complete) appliquer();
    }

    suiv.addEventListener("click", function () { avancer(1); });
    prec.addEventListener("click", function () { avancer(-1); });

    contenu.appendChild(fig);
    montrer(0);
  }

  /* --- CHIEN QUI DORT (toutes les pages, jamais sur mobile) :
     section ANIMATION_CHIEN ---
     Machine a etats du chien qui dort en bas a gauche de chaque
     page (accueil, series, contact), anime par une seule planche
     (sprite sheet) : "dog sprite/SPRITE SHEET DOG.png", 17 sprites
     de 32px cote a cote. TOUS les reglages sont dans l'objet
     ANIMATION_CHIEN ci-dessous : sequences, durees de chaque
     sprite, comportement.

     Cycle : il dort (sprites 1 et 2) ; 3 clics le reveillent (il
     tremble a chaque clic) ; eveille (sprite 6), il se rendort au
     bout de 5 s sans clic (sprite 3, puis dodo) ; un clic le fait
     parler (sprites 6 et 7), un autre le rend eveille ; 10 clics
     de suite le reveillent en cyclope (sprites 8 et 9) : son oeil
     rouge suit le pointeur (sprites 10 a 17 : N, NE, E, SE, S,
     SO, O, NO) pendant 10 s -- la GROSSE MOUCHE s'il est en
     plein combat contre THE FLY KING : son oeil la suit, elle,
     pas le pointeur -- puis TIRE : les deux premiers traits
     RATENT la cible de peu, le troisieme la touche. Chaque tir
     part de l'oeil avec de COURTES ondes de pixels rouge, bleu et
     vert (courtes dans le temps et dans l'espace : quelques
     centaines de carres au plus). Le trait qui touche : le
     pointeur s'arrete, TREMBLE et se desagrege pendant 3 s
     pendant que quelques gouttes de pixels rouge, bleu et jaune
     coulent de lui ; un clic n'importe ou le fait reapparaitre,
     puis le chien se rendort. Contre le boss, le troisieme tir
     le tue d'un seul coup et il tombe sur la ligne du chien. En
     Le chemin de son trait ne marque RIEN : ni les images, ni
     la page. Seul l'IMPACT -- sur TOUS les tirs, les deux rates
     comme celui qui touche -- un GROS TROU ROND brule, AU RAYON
     RAGOTE : deux bruits superposes font onduler son bord d'un
     carre a l'autre, et son liseret noir saute pres d'une fois
     sur deux -- c'est LA que le laser gratte vraiment l'image.
     Sur l'accueil, l'impact decouvre la PHOTO PROPRE de
     dessous, comme un grattage au doigt. Sur les autres pages,
     il gratte jusqu'au FOND BLANC du site : il n'y a rien
     derriere l'image, le grattage la peint en blanc. Un clic
     rend le
     pointeur : il revient NOIR, tout sale de sa fonte, se
     SECOUE tout seul en projetant des pixels noirs autour de
     lui, puis REPREND SA COULEUR, la pointe d'abord, et le
     curseur bleu reparait.
  ----------------------------------------------------------------- */
  const ANIMATION_CHIEN = {
    // La planche : une seule image, tous les sprites cote a cote,
    // de gauche a droite, comptes de 1 a 17 (%20 = espace).
    planche: "dog%20sprite/SPRITE%20SHEET%20DOG.png",
    frames: 17,

    // ---- Les sequences ----
    // Chaque ligne : [numero du sprite, duree en ms]. Les sprites
    // sont comptes comme dans le fichier, de 1 a 17. boucle: true =
    // la sequence se repete sans fin.
    dodo: {
      seq: [[1, 600], [2, 800]],
      boucle: true
    },
    reveil: {
      seq: [[3, 800], [4, 400], [5, 400], [6, 400],
            [3, 200], [6, 200], [3, 200], [6, 800]]
    },
    endormissement: {          // petit baillement avant le dodo
      seq: [[3, 400]]
    },
    parle: {
      seq: [[6, 100], [7, 100]],
      boucle: true
    },
    cyclope: {                 // reveil au gros oeil rouge
      seq: [[8, 800], [9, 200], [8, 200], [9, 200], [8, 600]]
    },
    eveilleSprite: 6,          // sprite affiche quand il est eveille
    suiviPremier: 10,          // sprite du regard NORD, puis NE, E,
                               // SE, S, SO, O, NO (sprites 10 a 17)

    // ---- Comportement ----
    clicsReveil: 3,        // clics (avec tremblement) pour le reveiller
    eveilMs: 5000,         // sans clic, il se rendort apres ce delai
    clicsCyclope: 10,      // clics de suite eveille pour l'oeil rouge
    suiteMs: 3000,         // ecart maxi entre deux clics "de suite"
    suiviMs: 10000,        // duree pendant laquelle l'oeil suit le pointeur

    // ---- Laser ----
    laserMonteeMs: 120,    // temps que met le trait pour atteindre le
                           // pointeur (rapide : il fonce dessus)
    laserFonduMs: 3000,    // une fois touche, le pointeur tremble et
                           // se desagrege pendant ce delai (3 s)
    laserEpaisseur: 2,     // largeur du trait en px (fin, pas un bloc)
    laserPas: 6,           // le trait est CASSE : petits segments de
                           // pixels de cette longueur, avec des trous
    laserTrou: 0.22,       // proportion de trous dans le trait (0 a 1)
    laserTremble: 2,       // amplitude du tremblement du pointeur (px)
    laserGouttes: 0.35,    // part des pixels qui coulent en gouttes,
                           // les autres s'effacent juste sur place
    laserFonduPlaceMs: 500,// un pixel sur place met ce delai a partir
    // ---- Retour du pointeur (clic apres sa fonte) ----
    retourNettoyageMs: 900, // le pointeur detruit revient NOIR, se
                           // secoue, projette ses saletes noires
                           // puis reprend sa couleur, en ce delai
    retourSale: 0.45,      // part des pixels du curseur qui
                           // ejectent une salete noire en vol
    // ---- Tirs rates et boss ----
    laserRatres: 2,        // les N premiers tirs RATENT leur cible
                           // (le pointeur, ou la grosse mouche
                           // pendant le combat) de peu : ils
                           // passent a cote ; le suivant touche
    laserRatEcart: 70,     // distance mini-maxi du point vise par un
                           // tir rate (24 a 24+70 px de la cible)
    laserRatTenueMs: 200,  // un tir rate reste pose a cote de sa
                           // cible pendant ce delai (COURT)...
    laserRatFonduMs: 150,  // ... puis son trait s'eteint vite
    laserPauseMs: 550,     // pause entre deux tirs consecutifs
    laserBossTenueMs: 700, // tir sur le boss (page contact) : le
                           // trait reste pose sur lui pendant ce delai
                           // avant de s'eteindre (laserRatFonduMs)
    // ---- Ondes de l'oeil ----
    ondeVitesse: 0.12,     // vitesse des ondes (px/ms). Faible :
                           // elles s'etendent PEU (rayon maxi =
                           // ondeVitesse * ondeDureeMs = 108 px)
    ondeDureeMs: 900,      // les ondes vivent ce delai, pas plus :
                           // courtes et peu nombreuses, le laser
                           // reste tres bon marche en CPU
    // ---- Impact des images ----
    laserImpactRayon: 120, // L'IMPACT : un TRES GROS trou rond,
                           // bien irregulier -- c'est LA que le
                           // laser gratte vraiment l'image. Tous
                           // les tirs en produisent un, la ou la
                           // pointe se plante, les rates compris.
                           // Le chemin du trait, lui, ne marque
                           // RIEN.
    ondes: ["#ff1744", "#2979ff", "#00e676"],  // ondes qui partent de l'oeil
    poudre: ["#ff1744", "#2979ff", "#ffea00"],  // gouttes rouge, bleu, jaune
    oeilDecalX: 0,         // decalage de l'oeil (px) par rapport au
    oeilDecalY: 0          // centre du chien, si besoin d'ajuster
  };

  let chienPlancheEl = null;    // le div qui affiche la planche
  let chienDortEtat = "dodo";   // dodo|reveil|eveille|parle|cyclope|suivi|laser
  let chienClicsReveil = 0;
  let chienClicsSuite = 0;      // clics "de suite" eveille/parle
  let chienDernierClic = 0;
  let chienMinuteur = null;     // minuteur d'etat (endormissement, fin du suivi)
  let chienMinuteurFrame = null;  // frame suivante d'une sequence
  let chienMinuteurOeil = null;  // intervalle de regard pendant le combat
  let chienDortGen = 0;         // annule sequences et effets obsoletes
  let chienPointeur = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let chienPointeurDetruit = false;
  let chienDernierSprite = -1;     // sprite affiche (evite de reecrire)
  let chienVueFrame = null;       // frame en attente du regard du chien
  let chienLaserCanvas = null;
  let chienNettoyageCanvas = null;  // calque du nettoyage du pointeur au retour
  let chienLaserNumero = 0;    // combien de tirs ont deja ete tires
                               // (les laserRatres premiers ratent)

  function chienAfficherSprite(n) {
    // Montre le sprite numero n (1 = premier a gauche). Le sprite
    // affiche est RETENU : reecrire la meme position de fond a
    // chaque deplacement du pointeur ne faisait que forcer le
    // navigateur a recalculer le calque du chien -- c'est ce qui
    // faisait clignoter le pointeur quand l'oeil suit la souris.
    if (!chienPlancheEl) return;
    const f = ANIMATION_CHIEN.frames;
    const i = Math.max(1, Math.min(f, n)) - 1;
    if (i === chienDernierSprite) return;   // deja affiche : rien a faire
    chienDernierSprite = i;
    chienPlancheEl.style.backgroundPositionX = (i / (f - 1)) * 100 + "%";
  }

  function chienJouerSequence(def, fin) {
    // Joue def.seq ([sprite, duree]...) ; repete si def.boucle ;
    // sinon appelle fin() apres la derniere frame.
    const gen = chienDortGen;
    let i = 0;
    const avancer = function () {
      if (gen !== chienDortGen) return;
      const etape = def.seq[i];
      chienAfficherSprite(etape[0]);
      if (chienMinuteurFrame) clearTimeout(chienMinuteurFrame);
      chienMinuteurFrame = setTimeout(function () {
        if (gen !== chienDortGen) return;
        const dernier = i >= def.seq.length - 1;
        if (dernier && !def.boucle) { if (fin) fin(); return; }
        i = dernier ? 0 : i + 1;
        avancer();
      }, etape[1]);
    };
    avancer();
  }

  function chienTrembler() {
    if (!chienPlancheEl) return;
    chienPlancheEl.classList.remove("tremble");
    void chienPlancheEl.offsetWidth;  // relance l'animation CSS
    chienPlancheEl.classList.add("tremble");
  }

  function chienStopMinuteurs() {
    if (chienMinuteur) { clearTimeout(chienMinuteur); chienMinuteur = null; }
    if (chienMinuteurFrame) { clearTimeout(chienMinuteurFrame); chienMinuteurFrame = null; }
    if (chienMinuteurOeil) { clearInterval(chienMinuteurOeil); chienMinuteurOeil = null; }
  }

  function chienDodo() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "dodo";
    chienClicsReveil = 0;
    chienClicsSuite = 0;
    chienJouerSequence(ANIMATION_CHIEN.dodo, null);
  }

  function chienSEndormir() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "dodo";
    chienJouerSequence(ANIMATION_CHIEN.endormissement, chienDodo);
  }

  function chienSeReveiller() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "reveil";
    chienJouerSequence(ANIMATION_CHIEN.reveil, chienEveille);
  }

  function chienEveille() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "eveille";
    chienAfficherSprite(ANIMATION_CHIEN.eveilleSprite);
    chienMinuteur = setTimeout(chienSEndormir, ANIMATION_CHIEN.eveilMs);
  }

  function chienParler() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "parle";
    chienJouerSequence(ANIMATION_CHIEN.parle, null);
  }

  function chienCyclope() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "cyclope";
    chienJouerSequence(ANIMATION_CHIEN.cyclope, chienSuivre);
  }

  function chienRegarder() {
    // Choisis le sprite du regard selon la direction de la cible.
    // Angle depuis le Nord, sens horaire : N=0, NE=45, E=90, SE=135,
    // S=180, SO=225, O=270, NO=315 (sprites 10 a 17). Pendant le
    // combat contre THE FLY KING (page contact), l'oeil suit
    // LA MOUCHE, pas le pointeur : elle bouge toute seule, c'est
    // elle la cible. (Les variables du jeu sont declarees plus bas
    // dans ce script : elles n'existent pas quand cette fonction
    // est definie, mais existent quand elle tourne.)
    if (!chienPlancheEl) return;
    const rect = chienPlancheEl.getBoundingClientRect();
    const oeilX = rect.left + rect.width / 2 + ANIMATION_CHIEN.oeilDecalX;
    const oeilY = rect.top + rect.height / 2 + ANIMATION_CHIEN.oeilDecalY;
    const bossVivant = !!conteneurJeu && !!bossEl && !bossChute && !bossAuSol;
    const cibleX = bossVivant ? bossX : chienPointeur.x;
    const cibleY = bossVivant ? bossY : chienPointeur.y;
    const dx = cibleX - oeilX;
    const dy = cibleY - oeilY;
    const angle = Math.atan2(dx, -dy) * 180 / Math.PI;
    const secteur = ((Math.round(angle / 45) % 8) + 8) % 8;
    chienAfficherSprite(ANIMATION_CHIEN.suiviPremier + secteur);
  }

  function chienSuivre() {
    chienDortEtat = "suivi";
    chienLaserNumero = 0;  // la serie de tirs repart du debut :
                           // les deux premiers rateront
    chienRegarder();  // tout de suite la bonne direction
    // Pendant le combat, la mouche vole sans arret : l'oeil doit
    // la suivre meme quand le pointeur ne bouge pas. L'intervalle
    // vit dans chienMinuteurOeil, nettoye par chienStopMinuteurs.
    if (!!conteneurJeu && !!bossEl && !bossChute && !bossAuSol) {
      chienMinuteurOeil = setInterval(chienRegarder, 100);
    }
    chienMinuteur = setTimeout(chienTirerLaser, ANIMATION_CHIEN.suiviMs);
  }

  function chienDetruirePointeur() {
    chienPointeurDetruit = true;
    document.documentElement.classList.add("chien-pointeur-detruit");
  }

  function chienRestaurerPointeur() {
    chienPointeurDetruit = false;
    document.documentElement.classList.remove("chien-pointeur-detruit");
  }

  function chienNettoyerPointeur() {
    // Le clic qui fait REPARAITRE le pointeur detruit : il ne
    // revient pas d'un coup. Il reparait d'abord TOUT NOIR,
    // sale de sa fonte, et se SECOUE tout seul ; des pixels
    // NOIRS sont PROJETES autour de lui, comme s'il se
    // debarbouillait, et chaque pixel REPREND SA COULEUR -- la
    // pointe d'abord, comme une vague qui remonte le curseur.
    // Quand tout est propre, le VRAI curseur (bleu) reparait :
    // le curseur CSS reste cache jusqu'au bout (la classe
    // chien-pointeur-detruit ne part qu'a la fin), le temps que
    // ce dessin anime le remplace pixel par pixel.
    if (chienNettoyageCanvas) return;  // nettoyage deja en cours
    const pixels = chienPixelsPointeur();
    if (!pixels.length) { chienRestaurerPointeur(); return; }
    const gen = chienDortGen;
    const duree = ANIMATION_CHIEN.retourNettoyageMs;
    // La vague de nettoyage atteint chaque pixel a tNet, au
    // prorata de sa distance a la POINTE (0,0) -- la fonte
    // avait mange la pointe en premier, le nettoyage la lui
    // rend en premier.
    let distMax = 1;
    for (let i = 0; i < pixels.length; i++) {
      const dx = pixels[i].x + 0.5;
      const dy = pixels[i].y + 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > distMax) distMax = dist;
    }
    const tNet = function (i, dist) {
      return Math.min(duree * 0.75,
        (dist / distMax) * duree * 0.55 *
        (0.85 + chienBruit(i, 1, 30) * 0.3));
    };
    // Les SALETES : une part des pixels (retourSale) ejecte un
    // pixel NOIR qui s'envole quand la vague passe -- surtout
    // vers le haut, avec une derive laterale.
    const sales = [];
    for (let i = 0; i < pixels.length; i++) {
      if (chienBruit(i, 2, 31) >= ANIMATION_CHIEN.retourSale) continue;
      const p = pixels[i];
      const dx = p.x + 0.5;
      const dy = p.y + 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ang = chienBruit(i, 3, 32) * Math.PI * 2;
      sales.push({
        x: p.x, y: p.y,
        t0: tNet(i, dist),
        vx: Math.cos(ang) * (0.02 + chienBruit(i, 4, 33) * 0.05),
        vy: -Math.abs(Math.sin(ang)) * (0.02 + chienBruit(i, 5, 34) * 0.06)
      });
    }
    // Calque plein ecran, meme principe que le laser.
    const canvas = document.createElement("canvas");
    canvas.className = "chien-laser";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    document.body.appendChild(canvas);
    chienNettoyageCanvas = canvas;
    const ctx = canvas.getContext("2d");
    let ecoule = 0;
    let dernierT = null;
    const tremble = ANIMATION_CHIEN.laserTremble;
    const dessiner = function (t) {
      if (gen !== chienDortGen) {  // page changee : tout s'arrete
        canvas.remove();
        if (chienNettoyageCanvas === canvas) chienNettoyageCanvas = null;
        return;
      }
      if (dernierT === null) dernierT = t;
      ecoule += t - dernierT;
      dernierT = t;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const px = chienPointeur.x;
      const py = chienPointeur.y;
      // Le curseur dessine : chaque pixel est NOIR et TREMBLE
      // tant que la vague ne l'a pas nettoye ; nettoye, il prend
      // sa vraie couleur et SE CALME d'un coup.
      for (let i = 0; i < pixels.length; i++) {
        const p = pixels[i];
        const dx = p.x + 0.5;
        const dy = p.y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const tn = tNet(i, dist);
        // secousse = 1 tant que le pixel est sale, puis il
        // retombe a zero en 180 ms : le tremblement s'arrete.
        const secousse = ecoule < tn ? 1
          : Math.max(0, 1 - (ecoule - tn) / 180);
        const jx = Math.round((chienBruit(i, t, 12) - 0.5) *
                              2 * tremble * secousse);
        const jy = Math.round((chienBruit(i, t, 13) - 0.5) *
                              2 * tremble * secousse);
        ctx.fillStyle = ecoule < tn ? "#111111" : p.c;
        ctx.fillRect(px + p.x + jx, py + p.y + jy, 1, 1);
      }
      // Les saletes noires, projettees autour : elles s'envolent
      // au passage de la vague, tourbillonnent un peu, puis
      // s'effacent.
      ctx.fillStyle = "#111111";
      for (let s = 0; s < sales.length; s++) {
        const e = sales[s];
        if (ecoule < e.t0) continue;
        const age = ecoule - e.t0;
        if (age > 700) continue;   // envolee puis oubliee
        ctx.globalAlpha = Math.max(0, 1 - age / 700);
        ctx.fillRect(Math.round(px + e.x + e.vx * age +
                                Math.sin(age / 60 + s) * 1.5),
                     Math.round(py + e.y + e.vy * age), 2, 2);
      }
      ctx.globalAlpha = 1;
      if (ecoule < duree) {
        window.requestAnimationFrame(dessiner);
      } else {
        // Propre : le vrai curseur (bleu) reparait.
        canvas.remove();
        if (chienNettoyageCanvas === canvas) chienNettoyageCanvas = null;
        chienRestaurerPointeur();
      }
    };
    window.requestAnimationFrame(dessiner);
  }

  function chienBruit(a, b, c) {
    // Grain pseudo-aleatoire DETERMINISTE (aucun Math.random) :
    // un melange de sinus bien secoue. Les memes entrees donnent
    // toujours la meme valeur, mais des que le temps ou la
    // position change, tout change : parfait pour un laser qui
    // fourmille et un pointeur qui tremble, image par image.
    const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
    return v - Math.floor(v);   // entre 0 et 1
  }

  function chienPixelAnneau(ctx, cx, cy, rayon, taille, couleur) {
    // Anneau PIXELLISE : des petits carres poses sur la grille de
    // "taille" px (celle des pixels du chien), et le rayon avance
    // par crans entiers. Rien de lisse : chaque point du cercle
    // est un carre de pixels, comme le reste du chien.
    const r = Math.max(taille, Math.round(rayon / taille) * taille);
    const nb = Math.max(8, Math.round((Math.PI * 2 * r) / taille));
    ctx.fillStyle = couleur;
    for (let i = 0; i < nb; i++) {
      const a = (Math.PI * 2 * i) / nb;
      const px = Math.round((cx + Math.cos(a) * r) / taille) * taille;
      const py = Math.round((cy + Math.sin(a) * r) / taille) * taille;
      ctx.fillRect(px, py, taille, taille);
    }
  }

  function chienImagesBrulables() {
    // Les images que l'impact du laser peut graver sur la page
    // courante : toutes les <img> du contenu (hors photo de
    // dessous de l'accueil, celle que le grattage revele :
    // jamais touchee) et le canvas de grattage de l'accueil.
    // Les images plus petites que 20 px sont ignorees : le trou
    // d'impact n'y paraitrait pas. Le chemin du trait, lui, ne
    // marque plus rien du tout.
    const liste = [];
    const imgs = contenu.querySelectorAll("img");
    for (let i = 0; i < imgs.length; i++) {
      const img = imgs[i];
      if (img.classList.contains("photo-dessous")) continue;
      const r = img.getBoundingClientRect();
      if (r.width >= 20 && r.height >= 20) {
        liste.push({ el: img, rect: r, canvas: false });
      }
    }
    const cv = document.getElementById("canvas-accueil");
    if (cv) {
      const r = cv.getBoundingClientRect();
      if (r.width >= 20 && r.height >= 20) {
        liste.push({ el: cv, rect: r, canvas: true });
      }
    }
    return liste;
  }

  function chienCalqueBrulure(cible) {
    // Le calque ou graver la brulure d'une image. Le canvas de
    // grattage de l'accueil EST deja un calque : on grave dedans
    // (le trou y efface la couche sale et revele la photo propre
    // de dessous, comme un grattage brule). Toute autre image
    // recoit un canvas transparent pose par-dessus, aux
    // dimensions exactes de l'image, qui defile avec elle. Le
    // calque est cree une seule fois puis cache sur l'image
    // (_chienBrulure) : les brulures successives s'y ajoutent.
    // La page peut BOUGER entre deux gravures (photo remplacee,
    // fenetre redimensionnee, defilement pendant la fonte) : on
    // RECALE le calque sur la position courante de l'image avant
    // de graver, sinon la brulure tombe ailleurs que sur le
    // trait du laser.
    if (cible.canvas) return cible.el;
    if (cible.el._chienBrulure) {
      const vieux = cible.el._chienBrulure;
      vieux.style.left = cible.el.offsetLeft + "px";
      vieux.style.top = cible.el.offsetTop + "px";
      const r = cible.el.getBoundingClientRect();
      const l = Math.max(1, Math.round(r.width));
      const h = Math.max(1, Math.round(r.height));
      if (vieux.width !== l || vieux.height !== h) {
        vieux.width = l;    // l'image a change de taille : on
        vieux.height = h;   // repart de zero (brulures perdues)
      }
      return vieux;
    }
    const parent = cible.el.parentNode;
    if (parent && getComputedStyle(parent).position === "static") {
      parent.style.position = "relative";  // point d'ancrage du calque
    }
    const r = cible.el.getBoundingClientRect();
    const cv = document.createElement("canvas");
    cv.className = "chien-brulure";
    cv.width = Math.max(1, Math.round(r.width));
    cv.height = Math.max(1, Math.round(r.height));
    cv.style.position = "absolute";
    cv.style.left = cible.el.offsetLeft + "px";
    cv.style.top = cible.el.offsetTop + "px";
    cv.style.pointerEvents = "none";
    cv.style.zIndex = "2";
    parent.appendChild(cv);
    cible.el._chienBrulure = cv;
    return cv;
  }

  function chienGraverTrou(cible, vx, vy, rayon, graine) {
    // Grave un trou BRULE dans une image, a la position ecran
    // (vx, vy) : PAS un rond parfait, PAS de courbe lisse. Une
    // grille de petits carres (~3 px), le rayon RAGOTE -- deux
    // bruits superposes, la grande vague selon l'angle et les
    // creux et bosses d'un carre a l'autre -- le fond du trou
    // est ESTOMPE (carres demi-transparents tires au hasard) et
    // le bord est un liseret NOIR tres irregulier et tres
    // discontinu, comme du papier cere brule a la va-vite.
    // C'est un GRATTAGE : sur l'accueil il EFFACE la couche
    // sale (photo de dessous), sur les autres pages il peint le
    // BLANC du site, il n'y a rien derriere l'image. Aucune
    // explosion, aucun monticule : juste la trace de l'impact,
    // gravee pour de bon dans l'image.
    const calque = chienCalqueBrulure(cible);
    const g = calque.getContext("2d");
    // Rect TOUT FRAIS, relu a CHAQUE gravure : la page a pu bouger
    // depuis le debut du tir (photo remplacee, defilement pendant
    // la fonte de 3 s) -- une position capturee d'avance fait
    // tomber la trace ailleurs que sur le trait du laser.
    const r = cible.el.getBoundingClientRect();
    // Le canvas de grattage de l'accueil travaille en resolution
    // INTERNE (cote le plus long plafonne a 1600 px), pas en
    // pixels ecran : sans ce facteur d'echelle, le trou tombait
    // au mauvais endroit et a la mauvaise taille sur l'accueil.
    // Echelles separees en X et Y, comme le grattage au doigt.
    // Les calques des autres images ont exactement la taille
    // affichee : elles valent 1.
    const kx = calque.width / Math.max(1, r.width);
    const ky = calque.height / Math.max(1, r.height);
    const cx = Math.round((vx - r.left) * kx);
    const cy = Math.round((vy - r.top) * ky);
    const pas = Math.max(2, Math.round(3 * kx));  // carre de brulure
    const ray = Math.max(pas, Math.round((rayon * kx) / pas) * pas);
    // 1) Le fond du trou, ESTOMPE : carres demi-transparents
    //    (alpha tire au hasard), le rayon ONDULANT selon l'angle.
    //    Sur le canvas de grattage de l'accueil, chaque carre
    //    EFFACE la couche sale (destination-out) : la photo
    //    propre de dessous parait, comme un grattage brule. Sur
    //    une autre image, le calque pose dessus peint du BLANC
    //    du site : comme il n'y a rien derriere l'image, le
    //    grattage va jusqu'au fond blanc de la page.
    g.globalCompositeOperation =
      cible.canvas ? "destination-out" : "source-over";
    g.fillStyle = cible.canvas ? "#111111" : "#ffffff";  // ignore par destination-out
    for (let py = cy - ray; py <= cy + ray; py += pas) {
      for (let px = cx - ray; px <= cx + ray; px += pas) {
        const dx = px - cx;
        const dy = py - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.round(Math.atan2(dy, dx) * 14);
        // Bord RAGOTE : le rayon de ce carre ondule selon SON
        // ANGLE (grande vague) ET selon sa PLACE (petits
        // creux et bosses d'un carre a l'autre) -- deux bruits
        // superposes, le bord n'est jamais deux fois pareil.
        const ond = ray * (0.62 + chienBruit(graine, ang, 62) * 0.3 +
                           chienBruit(graine, px, py) * 0.3);
        if (d > ond - pas) continue;  // on s'arrete AVANT le bord
        g.globalAlpha = 0.55 + chienBruit(graine, px + 3, py + 5) * 0.45;
        g.fillRect(px, py, pas, pas);
      }
    }
    // 2) Le bord BRULE : carres noirs opaques poses sur le bord
    //    ondulant, TRES discontinus (pres d'un carre sur deux
    //    saute) : le liseret n'est jamais un cercle net ni
    //    continu. Le rayon de chaque carre ondule comme le fond
    //    (l'angle ET sa place) : les deux se rejoignent, meme
    //    bord ronge. (Le noir est retabli ici : l'interieur est
    //    blanc sur les autres pages, le liseret reste BRULE.)
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    g.fillStyle = "#111111";
    const nb = Math.max(12, Math.round((Math.PI * 2 * ray) / pas));
    for (let i = 0; i < nb; i++) {
      const a = (Math.PI * 2 * i) / nb;
      const ang = Math.round(a * 14);
      const px = Math.round((cx + Math.cos(a) * ray) / pas) * pas;
      const py = Math.round((cy + Math.sin(a) * ray) / pas) * pas;
      const rr = ray * (0.62 + chienBruit(graine, ang, 62) * 0.3 +
                        chienBruit(graine, px + 7, py + 7) * 0.3);
      const bx2 = Math.round((cx + Math.cos(a) * rr) / pas) * pas;
      const by2 = Math.round((cy + Math.sin(a) * rr) / pas) * pas;
      if (chienBruit(graine, bx2 + 7, by2 + 7) < 0.4) continue;
      g.fillRect(bx2, by2, pas, pas);
    }
    g.globalAlpha = 1;
  }

  function chienPixelsPointeur() {
    // Le pointeur du site, pour le faire fondre pixel par pixel :
    // on dessine le curseur ACTUELLEMENT affiche sous le
    // pointeur, exactement comme il apparait, puis on releve ses
    // pixels un a un. C'est la TAPETTE bleue par defaut ; la MAIN
    // sur le canvas de grattage de l'accueil (cursor: grab /
    // grabbing, ouverte ou fermee : on dessine la main ouverte,
    // peu importe la situation) ; les FLECHES rouge et verte des
    // zones de navigation (chevrons), sur les autres pages.
    // Chaque forme est relevee DEPUIS SON POINT CHAUD (l'endroit
    // exact que le laser touche) : la fonte part de la. Si la
    // forme d'un curseur change dans le CSS, mettre la meme forme
    // ici.
    let forme = "tapette";
    const sous = document.elementFromPoint(chienPointeur.x, chienPointeur.y);
    if (sous) {
      const cur = getComputedStyle(sous).cursor || "";
      if (cur.indexOf("grab") !== -1) forme = "main";
      else if (cur.indexOf("ff1744") !== -1) forme = "fleche-rouge";
      else if (cur.indexOf("00e676") !== -1) forme = "fleche-verte";
    }
    const c = document.createElement("canvas");
    c.width = 32;
    c.height = 32;
    const g = c.getContext("2d");
    let chaudX = 0;   // le point chaud du curseur
    let chaudY = 0;
    if (forme === "tapette") {
      // La petite tapette bleue du curseur par defaut (chaud : la
      // pointe, en haut a gauche).
      g.strokeStyle = "#ffffff";
      g.lineWidth = 1.5;
      g.fillStyle = "#2979ff";
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(0, 18);
      g.lineTo(4.5, 13.5);
      g.lineTo(8, 21);
      g.lineTo(11, 19.5);
      g.lineTo(7.5, 12);
      g.lineTo(13.5, 12);
      g.closePath();
      g.fill();
      g.stroke();
    } else if (forme === "main") {
      // La main ouverte du grattage : blanche au contour noir,
      // comme la main des curseurs grab des navigateurs (chaud :
      // le creux de la paume).
      chaudX = 11;
      chaudY = 14;
      g.strokeStyle = "#000000";
      g.lineWidth = 1.5;
      g.fillStyle = "#ffffff";
      g.beginPath();                    // les quatre doigts
      g.rect(3, 7, 4, 12);
      g.rect(8, 4, 4, 15);
      g.rect(13, 5, 4, 14);
      g.rect(18, 8, 4, 11);
      g.fill();
      g.stroke();
      g.beginPath();                    // la paume
      g.moveTo(3, 14);
      g.lineTo(22, 14);
      g.lineTo(22, 20);
      g.quadraticCurveTo(12, 25, 3, 20);
      g.closePath();
      g.fill();
      g.stroke();
      g.beginPath();                    // le pouce
      g.moveTo(4, 16);
      g.lineTo(0.5, 12);
      g.lineTo(2.5, 9.5);
      g.lineTo(6.5, 13.5);
      g.closePath();
      g.fill();
      g.stroke();
    } else {
      // Le chevron de navigation : rouge pour revenir, vert pour
      // avancer, comme les curseurs des zones de clic (chaud : le
      // centre).
      const rouge = forme === "fleche-rouge";
      chaudX = 16;
      chaudY = 16;
      g.font = "bold 28px Helvetica, Arial, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "alphabetic";
      g.fillStyle = rouge ? "#ff1744" : "#00e676";
      g.fillText(rouge ? "\u2039" : "\u203A", 16, 24);
    }
    const d = g.getImageData(0, 0, c.width, c.height).data;
    const pixels = [];
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4;
        if (d[i + 3] > 0) {
          pixels.push({
            x: x - chaudX, y: y - chaudY,   // depuis le POINT CHAUD
            c: "rgb(" + d[i] + "," + d[i + 1] + "," + d[i + 2] + ")"
          });
        }
      }
    }
    return pixels;
  }

  function chienTirerLaser() {
    // Un tir de laser. Les DEUX PREMIERS tirs RATENT leur cible
    // de peu (le trait passe a cote) ; le TROISIEME touche. La
    // cible : le pointeur... sauf sur la page contact pendant le
    // combat contre THE FLY KING -- alors le chien vise LA GROSSE
    // MOUCHE (les deux rates passent pres d'ELLE, et le
    // troisieme la tue d'un seul coup), son oeil la suit, et le
    // pointeur n'est pas touche.
    chienDortEtat = "laser";
    const gen = chienDortGen;
    // Calque plein ecran, meme principe que #canvas-explosion :
    // tailles en pixels EXACTS, jamais 100vw/100vh dans le DOM.
    const canvas = document.createElement("canvas");
    canvas.className = "chien-laser";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    document.body.appendChild(canvas);
    chienLaserCanvas = canvas;
    const ctx = canvas.getContext("2d");
    const rect = chienPlancheEl.getBoundingClientRect();
    const oeil = {
      x: rect.left + rect.width / 2 + ANIMATION_CHIEN.oeilDecalX,
      y: rect.top + rect.height / 2 + ANIMATION_CHIEN.oeilDecalY
    };
    // 1 pixel du chien (32x32 affiches en 96x96) = 3 px ecran
    const epaisseur = Math.max(1, Math.round(rect.width / 32));
    // Le boss de la page contact : les variables du jeu sont
    // declarees PLUS BAS dans ce meme script, donc elles
    // n'existent pas encore quand cette fonction est DEFINIE --
    // mais elle ne TOURNE qu'apres des clics, longtemps apres la
    // fin du script : elles existent alors. Le boss vivant (pas
    // en chute, pas au sol) : le chien le vise au lieu du
    // pointeur.
    const bossVivant = !!conteneurJeu && !!bossEl && !bossChute && !bossAuSol;
    // Les laserRatres premiers tirs ratent -- la mouche pendant
    // le combat, le pointeur sinon. Le tir suivant touche.
    const rate = chienLaserNumero < ANIMATION_CHIEN.laserRatres;
    const touche = !rate && !bossVivant;  // celui-la fond le pointeur
    // La cible : le boss s'il vit (poursuivi en direct, il vole),
    // sinon le pointeur. Un tir rate vise A COTE d'elle : un
    // angle et une distance tires au hasard, le trait passe A
    // COTE, jamais loin ; contre le boss, le point decale suit
    // la mouche en direct, lui aussi. Clampes a 8 px des bords.
    let cible;
    if (rate) {
      const ang = chienBruit(chienLaserNumero, 5, 20) * Math.PI * 2;
      const dst = 24 + chienBruit(chienLaserNumero, 6, 21) *
                        ANIMATION_CHIEN.laserRatEcart;
      cible = {
        ox: Math.cos(ang) * dst,
        oy: Math.sin(ang) * dst,
        suit: bossVivant
      };
    } else {
      cible = { ox: 0, oy: 0, suit: bossVivant };
    }
    if (!cible.suit) {
      cible.x = chienPointeur.x + cible.ox;
      cible.y = chienPointeur.y + cible.oy;
    }
    // Seul le tir qui TOUCHE fond le pointeur : ses pixels sont
    // prets a se detacher. Quand l'onde de fonte l'atteint,
    // chacun se detache (depuis la pointe du curseur, la ou le
    // laser le touche) et coule en goutte ou s'efface sur place.
    // Le grain pseudo-aleatoire donne une fonte organique.
    const fondu = ANIMATION_CHIEN.laserFonduMs;
    const eclats = [];
    if (touche) {
      const pixels = chienPixelsPointeur();
      // Fonte depuis la POINTE du curseur (0,0), la ou le laser le
      // touche. Premiere passe : relever la distance maxi (le
      // pixel le plus loin de la pointe) AVANT de calculer les
      // t0, sinon les premiers pixels sont compares a un distMax
      // encore presque nul et fondent beaucoup trop tard.
      let distMax = 1;
      for (let i = 0; i < pixels.length; i++) {
        const dx = pixels[i].x + 0.5;
        const dy = pixels[i].y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > distMax) distMax = dist;
      }
      // Deuxieme passe : chaque pixel se detache quand l'onde de
      // fonte l'atteint, au prorata de sa distance a la pointe.
      for (let i = 0; i < pixels.length; i++) {
        const p = pixels[i];
        const dx = p.x + 0.5;
        const dy = p.y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        eclats.push({
          x: p.x, y: p.y, c0: p.c,
          t0: Math.min(fondu * 0.75,
                       (dist / distMax) * fondu * 0.75 *
                       (0.85 + chienBruit(i, 1, 6) * 0.3)),
          vx: 0, vy: 0, c: ""
        });
      }
      for (let i = 0; i < eclats.length; i++) {
        const e = eclats[i];
        // Une part des pixels devient des GOUTTES qui COULENT du
        // curseur : rouge, bleu ou jaune, elles descendent le
        // long du trait en suintant. Les autres s'effacent juste
        // sur place : pas d'explosion, le curseur fond et
        // degoutte.
        e.goutte = chienBruit(i, 2, 7) < ANIMATION_CHIEN.laserGouttes;
        if (e.goutte) {
          e.vx = (chienBruit(i, 3, 8) - 0.5) * 0.015;  // derive laterale minime
          e.vy = 0.03 + chienBruit(i, 4, 9) * 0.04;   // la goutte descend lentement
          e.c = ANIMATION_CHIEN.poudre[i % ANIMATION_CHIEN.poudre.length];
        }
      }
    }
    // Les images que le tir peut TOUCHER de son impact. Aucune
    // contre le boss : le jeu a deja sa propre pyrotechnie, et
    // la cible bouge sans cesse. Le chemin du trait ne marque
    // RIEN : seul l'IMPACT grave l'image.
    const brulables = bossVivant ? [] : chienImagesBrulables();
    // La duree du tir : montee rapide, puis le trait reste pose
    // sur sa cible (tenue), puis s'eteint doucement -- sauf le
    // tir qui touche, qui reste pose sur le pointeur pendant
    // TOUTE sa fonte (3 s) : le laser ne le lache qu'a la fin.
    const montee = ANIMATION_CHIEN.laserMonteeMs;
    const extinction = bossVivant || rate ?
      ANIMATION_CHIEN.laserRatFonduMs : 0;
    const tenue = bossVivant ? ANIMATION_CHIEN.laserBossTenueMs
                             : rate ? ANIMATION_CHIEN.laserRatTenueMs
                                    : fondu;
    const total = montee + tenue + extinction;
    let ecoule = 0;
    let dernierT = null;
    let coupBossDonne = false;   // le boss n'est frappe qu'UNE fois
    let impactBrule = false;     // le gros trou d'impact, idem
    const dessiner = function (t) {
      if (gen !== chienDortGen) return;  // annule (page changee)
      if (dernierT === null) dernierT = t;
      ecoule += t - dernierT;
      dernierT = t;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Le boss vole : le trait POURSUIT sa cible en direct (le
      // point decale d'un tir rate la suit aussi), et l'oeil du
      // chien reste colle a la mouche pendant tout le combat.
      if (cible.suit) {
        cible.x = Math.max(8, Math.min(window.innerWidth - 8, bossX + cible.ox));
        cible.y = Math.max(8, Math.min(window.innerHeight - 8, bossY + cible.oy));
        chienRegarder();
      }
      const avance = Math.min(1, ecoule / montee);
      const dxT = cible.x - oeil.x;
      const dyT = cible.y - oeil.y;
      const lgT = Math.sqrt(dxT * dxT + dyT * dyT);
      const ux = lgT > 0 ? dxT / lgT : 0;
      const uy = lgT > 0 ? dyT / lgT : 0;
      if (ecoule < total) {
        // Trait CASSE : pas une belle ligne droite, un rayon en
        // petits segments de pixels avec des trous et un zigzag,
        // re-tires a chaque frame : il fourmille, il vit. Fin
        // (2 px), il FONCE de l'oeil vers sa cible (montee
        // rapide), puis reste pose dessus, comme s'il la
        // faisait fondre. Les tirs rates et le tir sur le boss
        // s'eteignent doucement a la fin ; le tir qui touche
        // garde son trait plein jusqu'au bout.
        const reste = total - ecoule;
        if (extinction > 0 && reste < extinction) {
          ctx.globalAlpha = Math.max(0, reste / extinction);
        }
        ctx.fillStyle = "#ff1744";
        const traitPx = ANIMATION_CHIEN.laserEpaisseur;
        const pasSeg = ANIMATION_CHIEN.laserPas;
        for (let s = 0; s < lgT * avance; s += pasSeg) {
          if (chienBruit(s, t, 10) < ANIMATION_CHIEN.laserTrou) continue;  // trou
          const zig = (Math.floor(chienBruit(s, t, 11) * 3) - 1) * traitPx;
          ctx.fillRect(Math.round(oeil.x + ux * s - uy * zig),
                       Math.round(oeil.y + uy * s + ux * zig),
                       traitPx, traitPx);
        }
        ctx.globalAlpha = 1;
        // Ondes en pixels rouge, bleu et vert qui partent de
        // l'oeil au moment du tir, chacune declalee de 120 ms.
        // COURTES : elles ne vivent que ondeDureeMs et ne
        // s'etendent qu'a ondeVitesse px/ms (rayon maxi ~108
        // px). Quelques centaines de carres au plus : le laser
        // reste tres leger en CPU.
        for (let i = 0; i < ANIMATION_CHIEN.ondes.length; i++) {
          const ondeT = ecoule - i * 120;
          if (ondeT <= 0 || ondeT > ANIMATION_CHIEN.ondeDureeMs) continue;
          ctx.globalAlpha =
            Math.max(0, 1 - ondeT / ANIMATION_CHIEN.ondeDureeMs);
          chienPixelAnneau(ctx, oeil.x, oeil.y,
                           ondeT * ANIMATION_CHIEN.ondeVitesse,
                           epaisseur, ANIMATION_CHIEN.ondes[i]);
        }
        ctx.globalAlpha = 1;
        // Le chemin du trait ne marque RIEN : ni les images, ni
        // la page. Seul l'IMPACT -- juste apres, des que la
        // pointe se plante -- grave l'image croisee.
      }
      if (ecoule >= montee && ecoule < total) {
        // L'IMPACT, pour TOUS les tirs -- les deux rates comme
        // celui qui touche -- des que la pointe du trait se
        // plante (a cote de la cible pour un tir rate) : un GROS
        // trou brule, au rayon RAGOTE (deux bruits superposes)
        // et au liseret noir tres discontinu. C'est LA, et LA
        // SEULE, que le laser gratte l'image ; sur l'accueil,
        // il decouvre la photo de dessous, comme un gros
        // grattage du doigt ; sur les autres pages, il gratte
        // jusqu'au FOND BLANC du site (rien derriere
        // l'image). Rect relu frais :
        // la page a pu bouger depuis le
        // debut du tir. (Rien contre le boss : brulables est vide
        // pendant le combat.)
        if (!impactBrule && brulables.length) {
          impactBrule = true;
          for (let b = 0; b < brulables.length; b++) {
            const rb = brulables[b].el.getBoundingClientRect();
            if (cible.x >= rb.left && cible.x <= rb.right &&
                cible.y >= rb.top && cible.y <= rb.bottom) {
              chienGraverTrou(brulables[b], cible.x, cible.y,
                              ANIMATION_CHIEN.laserImpactRayon, 999);
            }
          }
        }
        if (rate) {
          // Tir rate : le trait passe A COTE de sa cible et s'y
          // plante -- le GROS trou d'impact, lui, est deja grave
          // juste au-dessus, la ou la pointe s'est arretee.
        } else if (bossVivant) {
          // Impact sur THE FLY KING : le chien le tue d'UN SEUL
          // COUP. frapperBoss(PV_BOSS) vide tous ses points de
          // vie d'un coup et declenche sa chute. (Si le joueur
          // l'a abattu pendant la montee du trait, on ne frappe
          // pas un cadavre.)
          if (!coupBossDonne) {
            coupBossDonne = true;
            if (!bossChute && !bossAuSol) frapperBoss(PV_BOSS);
          }
        } else if (touche) {
          // Impact : le laser touche la pointe du pointeur. Le
          // curseur reel disparait : le pointeur s'arrete et se
          // fige, puis TREMBLE pendant qu'il se desagrege, mange
          // depuis la pointe par l'onde de fonte, et quelques
          // gouttes rouge, bleu et jaune COULENT de lui.
          if (!chienPointeurDetruit) chienDetruirePointeur();
          // (Le GROS trou d'impact est deja grave juste
          // au-dessus, commun a tous les tirs.)
          const dans = ecoule - montee;
          const tremble = ANIMATION_CHIEN.laserTremble;
          for (let i = 0; i < eclats.length; i++) {
            const e = eclats[i];
            // Tremblement du pointeur : chaque pixel vacille
            const jx = Math.round((chienBruit(i, t, 12) - 0.5) * 2 * tremble);
            const jy = Math.round((chienBruit(i, t, 13) - 0.5) * 2 * tremble);
            if (dans < e.t0) {
              // Pixel encore en place, mais il tremble
              ctx.fillStyle = e.c0;
              ctx.fillRect(cible.x + e.x + jx, cible.y + e.y + jy, 1, 1);
            } else if (e.goutte) {
              // Goutte rouge, bleu ou jaune qui COULE du curseur
              const age = dans - e.t0;
              ctx.globalAlpha = Math.max(0, 1 - age / (fondu - e.t0));
              ctx.fillStyle = e.c;
              ctx.fillRect(Math.round(cible.x + e.x + e.vx * age),
                           Math.round(cible.y + e.y + e.vy * age),
                           2, 2);
            } else {
              // Pixel qui s'efface juste sur place (pas d'explosion)
              const age = dans - e.t0;
              ctx.globalAlpha = Math.max(0,
                1 - age / ANIMATION_CHIEN.laserFonduPlaceMs);
              ctx.fillStyle = e.c0;
              ctx.fillRect(cible.x + e.x + jx, cible.y + e.y + jy, 1, 1);
            }
          }
          ctx.globalAlpha = 1;
        }
      }
      if (ecoule < total) {
        window.requestAnimationFrame(dessiner);
      } else {
        // Fin du tir : le calque part. Un tir rate en appelle un
        // autre apres une courte pause (les DEUX PREMIERS
        // ratent, le TROISIEME touche). Le tir qui touche, et le
        // tir sur le boss, rendorment le chien. Le pointeur
        // touche reste detruit jusqu'au prochain clic
        // (n'importe ou).
        canvas.remove();
        if (chienLaserCanvas === canvas) chienLaserCanvas = null;
        if (rate) {
          chienLaserNumero++;
          chienMinuteur = setTimeout(function () {
            if (gen !== chienDortGen) return;  // page changee entre-temps
            chienTirerLaser();
          }, ANIMATION_CHIEN.laserPauseMs);
        } else {
          chienSEndormir();
        }
      }
    };
    window.requestAnimationFrame(dessiner);
  }

  function chienCliquer() {
    const maintenant = Date.now();
    // Clics "de suite" : au moindre ecart trop grand, le compte
    // repart de zero.
    if (maintenant - chienDernierClic > ANIMATION_CHIEN.suiteMs) chienClicsSuite = 0;
    chienDernierClic = maintenant;
    if (chienDortEtat === "dodo") {
      chienTrembler();
      chienClicsReveil++;
      if (chienClicsReveil >= ANIMATION_CHIEN.clicsReveil) {
        chienClicsReveil = 0;
        chienSeReveiller();
      }
      return;
    }
    if (chienDortEtat === "eveille" || chienDortEtat === "parle") {
      chienTrembler();
      chienClicsSuite++;
      if (chienClicsSuite >= ANIMATION_CHIEN.clicsCyclope) {
        chienClicsSuite = 0;
        chienCyclope();
        return;
      }
      if (chienDortEtat === "eveille") chienParler();
      else chienEveille();
      return;
    }
    // reveil, cyclope, suivi, laser : les clics ne changent rien.
  }

  // Position du pointeur : cible du regard cyclope et du laser.
  // Le regard n'est mis a jour qu'UNE FOIS PAR IMAGE AFFICHEE au
  // plus (requestAnimationFrame) : le pointeur bouge souvent bien
  // plus vite que l'ecran ne se rafraichit, et recalculer la
  // direction de l'oeil a chaque evenement ne charge que le
  // navigateur -- c'est de la que venait le clignotement.
  window.addEventListener("pointermove", function (e) {
    chienPointeur.x = e.clientX;
    chienPointeur.y = e.clientY;
    if (chienDortEtat === "suivi" && chienVueFrame === null) {
      chienVueFrame = window.requestAnimationFrame(function () {
        chienVueFrame = null;
        if (chienDortEtat === "suivi") chienRegarder();
      });
    }
  });
  // Pointeur detruit par le laser : un clic, n'importe ou, le
  // fait reaparaitre -- NOIR et tout sale d'abord : il se
  // secoue, projette ses pixels noirs, puis reprend sa couleur
  // (chienNettoyerPointeur).
  window.addEventListener("click", function () {
    if (chienPointeurDetruit) chienNettoyerPointeur();
  });

  function creerChienDort() {
    chienDortEtat = "dodo";
    chienClicsReveil = 0;
    chienClicsSuite = 0;
    chienDortGen++;
    chienDernierSprite = -1;  // nouvelle planche : le cache du
                              // sprite affiche repart de zero
    chienStopMinuteurs();
    chienPlancheEl = document.createElement("div");

    taille = taille || 8;
    echelle = echelle || 4;
    const petit = document.createElement("canvas");
    const pctx = petit.getContext("2d");
    const police = "bold " + taille + "px 'Courier New', Courier, monospace";
    pctx.font = police;
    petit.width = Math.ceil(pctx.measureText(texte).width) + 4;
    petit.height = taille + 6;
    pctx.font = police;
    pctx.textBaseline = "top";
    pctx.fillStyle = couleur;
    pctx.fillText(texte, 2, 2);

    const rendu = document.createElement("canvas");
    rendu.width = petit.width * echelle;
    rendu.height = petit.height * echelle;
    const rctx = rendu.getContext("2d");
    rctx.imageSmoothingEnabled = false;
    rctx.drawImage(petit, 0, 0, rendu.width, rendu.height);
    return rendu;
  }

  function creerBarreVie() {
    barreVieEl = document.createElement("div");
    barreVieEl.id = "barre-vie-boss";

    const nom = document.createElement("div");
    nom.id = "nom-boss";
    nom.appendChild(creerTextePixel("THE FLY KING", "#111111", 8, 2));

    const piste = document.createElement("div");
    piste.id = "barre-vie-piste";
    barreRemplieEl = document.createElement("div");
    barreRemplieEl.id = "barre-vie-remplie";
    piste.appendChild(barreRemplieEl);

    barreVieEl.append(nom, piste);
    conteneurJeu.appendChild(barreVieEl);
    actualiserBarreVie();
  }

  function actualiserBarreVie() {
    if (barreRemplieEl) {
      barreRemplieEl.style.width = Math.max(0, (bossPV / PV_BOSS) * 100) + "%";
    }
  }

  function tickTimer() {
    // Le temps ne s'écoule plus pendant le combat de boss ni après la partie
    if (!conteneurJeu || etapeFin) return;
    timerJeu--;
    if (timerJeu <= 0) {
      timerJeu = 0;
      majTextePixel(timerEl, "0");
      declencherDefaite();
      return;
    }
    majTextePixel(timerEl, String(timerJeu));
  }

  function declencherDefaite() {
    // Temps écoulé : GAME OVER, cliquable pour recommencer
    etapeFin = "defaite";
    annulerCharge();

    motEl = document.createElement("div");
    motEl.className = "mot-fin";
    motEl.appendChild(creerTextePixel("GAME OVER", "#ff1744"));
    conteneurJeu.appendChild(motEl);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (motEl) motEl.classList.add("visible"); });
    });
  }

  function nouvelleCibleBoss() {
    const marge = 100;
    bossCibleX = marge + Math.random() * (window.innerWidth - marge * 2);
    bossCibleY = marge + Math.random() * (window.innerHeight - marge * 2);
  }

  function updateBoss() {
    // Le boss repose au sol, pattes en l'air : il ne bouge plus
    if (bossAuSol) return;

    // Léger freeze frame après un coup reçu : l'impact est plus lisible
    if (freezeBossImpact > 0) {
      freezeBossImpact--;
      return;
    }

    // Le boss tué : il ne vole plus, il bascule sur le dos et chute lentement
    if (bossChute) {
      updateChuteBoss();
      return;
    }

    // Phase 2 : pause dramatique au moment du déclenchement
    if (pauseBoss > 0) {
      pauseBoss--;
      return;
    }

    timerBoss++;

    const dx = bossCibleX - bossX;
    const dy = bossCibleY - bossY;
    const dist = Math.hypot(dx, dy);

    if (dist < 40 || timerBoss > 90 || Math.random() < 0.02) {
      nouvelleCibleBoss();
      timerBoss = 0;
    }

    // Lent au départ, plus rapide en phase 2 (mais toujours attrapable)
    const vitesseMax = phase2Boss ? 5.2 : 3.0;
    bossVX += (dx / (dist || 1)) * (phase2Boss ? 1.3 : 0.75);
    bossVY += (dy / (dist || 1)) * (phase2Boss ? 1.3 : 0.75);
    bossVX += (Math.random() - 0.5) * (phase2Boss ? 2.2 : 1.1);
    bossVY += (Math.random() - 0.5) * (phase2Boss ? 2.2 : 1.1);

    const vActuelle = Math.hypot(bossVX, bossVY);
    if (vActuelle > vitesseMax) {
      bossVX = (bossVX / vActuelle) * vitesseMax;
      bossVY = (bossVY / vActuelle) * vitesseMax;
    }

    bossX += bossVX;
    bossY += bossVY;

    const bord = 30;
    if (bossX < bord) { bossX = bord; bossVX *= -1; }
    if (bossX > window.innerWidth - bord) { bossX = window.innerWidth - bord; bossVX *= -1; }
    if (bossY < bord) { bossY = bord; bossVY *= -1; }
    if (bossY > window.innerHeight - bord) { bossY = window.innerHeight - bord; bossVY *= -1; }

    const angle = Math.atan2(bossVY, bossVX) * (180 / Math.PI) + 90;
    bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0) rotate(${angle}deg)`;
  }

  function frapperBoss(degats) {
    bossPV -= (degats || 1); // Le coup chargé (degats = 2) compte pour deux coups
    actualiserBarreVie();
    declencherScreenShake();
    freezeBossImpact = 5; // léger freeze frame du boss : ça claque

    for (let i = 0; i < 12; i++) {
      creerPixelPhysique(bossX + (Math.random() - 0.5) * 30, bossY + (Math.random() - 0.5) * 30);
    }

    // Flash du boss à chaque coup reçu
    bossEl.classList.remove("touche");
    void bossEl.offsetWidth;
    bossEl.classList.add("touche");

    // À mi-vie : phase 2 du boss
    // (pause dramatique, puis il devient plus rapide et plus rouge)
    if (bossPV > 0 && bossPV <= PV_BOSS / 2 && !phase2Boss) {
      phase2Boss = true;
      bossEl.classList.add("phase2");
      pauseBoss = 120; // pause plus longue : on a le temps de voir sa colère
      declencherScreenShake();

      // Le boss se secoue violemment et des pixels rouges s'en échappent
      // en plusieurs vagues, pendant toute la durée de la colère
      bossEl.classList.remove("secoue");
      void bossEl.offsetWidth;
      bossEl.classList.add("secoue");
      setTimeout(function () {
        if (bossEl) bossEl.classList.remove("secoue");
      }, 1400);
      for (let vague = 0; vague < 5; vague++) {
        setTimeout(function () {
          if (!bossEl || bossChute) return;
          for (let i = 0; i < 12; i++) {
            creerPixelPhysique(bossX + (Math.random() - 0.5) * 42, bossY + (Math.random() - 0.5) * 42);
          }
        }, vague * 260);
      }
    }

    if (bossPV <= 0) tuerBoss();
  }

  function updateChuteBoss() {
    // Chute lente, façon feuille morte : le boss retombe sur le dos
    // Le sol du boss : il repose sur la MEME LIGNE que le chien qui
    // dort (fixe en bas a gauche, a --marge = 32 px du bas de
    // l'ecran). Le BAS du boss affleure le bas de la planche du
    // chien : 32 px (la marge) + 21 px (la moitie du boss, 42 px).
    const sol = window.innerHeight - 32 - 21;

    if (bossY >= sol) {
      // Une fois au sol : le boss se pose sur le dos, pattes en l'air,
      // et le mot de victoire apparaît au milieu de l'écran
      bossY = sol;
      bossChute = false;
      bossAuSol = true;
      annulerCharge();
      if (bossEl) {
        bossEl.classList.remove("phase2");
        bossEl.innerHTML = SVG_BOSS_MORT;
        bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0)`;
      }
      afficherMotFin();
      return;
    }

    bossVY = Math.min(bossVY + 0.12, 1.6); // accélération faible : chute lente
    bossY += bossVY;                       // tout droit, sans dérive
    rotationChuteBoss += vitesseRotationChute; // ...mais en virevoltant sur lui-même

    // Virevolte pendant la chute
    bossEl.style.transform = `translate3d(${bossX - 21}px, ${bossY - 21}px, 0) rotate(${rotationChuteBoss}deg)`;
  }

  function afficherMotFin() {
    // Le mot de victoire apparaît au milieu de l'écran, en typo pixel art
    motEl = document.createElement("div");
    motEl.className = "mot-fin";
    motEl.appendChild(creerTextePixel(MOT_FIN, "#111111"));
    conteneurJeu.appendChild(motEl);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (motEl) motEl.classList.add("visible"); });
    });

    etapeFin = "mot";
  }

  function tuerBoss() {
    // Grande explosion de pixels rouges
    for (let i = 0; i < 80; i++) {
      creerPixelPhysique(bossX + (Math.random() - 0.5) * 40, bossY + (Math.random() - 0.5) * 40);
    }
    declencherScreenShake();
    if (barreVieEl) { barreVieEl.remove(); barreVieEl = null; barreRemplieEl = null; }

    // Le boss ne disparaît pas : il se retourne sur le dos et tombe
    // tout droit, sans virevolter, jusqu'au sol où il finit pattes en l'air.
    // Le mot de victoire n'apparaît qu'une fois qu'il a touché le sol.
    bossChute = true;
    bossVX = 0; // aucune dérive : chute verticale
    bossVY = Math.max(0.5, bossVY);
    rotationChuteBoss = 0; // départ de la virevolte
    vitesseRotationChute = (Math.random() < 0.5 ? -1 : 1) * (10 + Math.random() * 8);
    bossEl.classList.remove("touche");
    bossEl.classList.add("morte"); // arrête le battement des ailes
  }

  function declencherFin() {
    // Garde-fou : si plusieurs mouches meurent d'un même coup chargé
    // au moment fatidique, la fin ne doit être déclenchée qu'une seule fois
    // (sinon une seconde barre de vie orpheline apparaît et reste pleine)
    if (etapeFin) return;

    // Les 50 mouches sont tuées : les cadavres s'agglutinent pour former le boss
    etapeFin = "boss";

    // Le timer disparaît et n'est plus pris en compte pendant le combat de boss
    if (timerEl) timerEl.style.display = "none";

    // PV du boss : à régler AVANT de créer la barre de vie,
    // pour qu'elle apparaisse pleine dès la naissance du boss
    bossPV = PV_BOSS;
    creerBarreVie();

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    mouches.forEach(function (m) {
      m.el.classList.remove("pose", "touchee");
      m.el.classList.add("morte");
      m.etat = "virevolte";
      m.departX = m.x;
      m.departY = m.y;
      m.cibleFinX = cx + (Math.random() - 0.5) * 50;
      m.cibleFinY = cy + (Math.random() - 0.5) * 50;
      m.progression = 0;
      m.vitesseFin = 0.012 + Math.random() * 0.018;
      m.delaiFin = Math.floor(Math.random() * 45); // départs décalés, en virevoltant
    });

    // Le boss naît au centre, formé par l'agglutination des cadavres
    bossEl = document.createElement("div");
    bossEl.className = "mouche boss";
    bossEl.innerHTML = SVG_BOSS;
    conteneurJeu.appendChild(bossEl);
    bossX = cx;
    bossY = cy;
    bossVX = 0;
    bossVY = 0;
    timerBoss = 0;
    phase2Boss = false;
    pauseBoss = 0;
    bossChute = false;
    bossAuSol = false;
    nouvelleCibleBoss();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (bossEl) bossEl.classList.add("visible"); });
    });
  }

  let zoneTapetteActive = null;  // dernier etat de la classe zone-tapette

  function gererSurvolSource(e) {
    // Une fois la première mouche tuée (jeu démarré), le curseur
    // est toujours une tapette, sauf sur le menu de gauche (aside / nav).
    // La classe n'est retouchée que si l'état CHANGE : réécrire la
    // classe de <html> à chaque déplacement du pointeur forçait le
    // navigateur à recalculer le curseur sans arrêt -- c'est ce qui
    // le faisait clignoter.
    const surMenu = !!(e.target && e.target.closest && e.target.closest("aside"));
    const actif = jeuCommence && !surMenu;
    if (actif !== zoneTapetteActive) {
      zoneTapetteActive = actif;
      document.documentElement.classList.toggle("zone-tapette", actif);
    }

    // La barre de coup chargé et la tapette animée suivent le curseur
    if (barreChargeEl) positionnerBarreCharge(e.clientX, e.clientY);
    if (tapetteEl) positionnerTapette(e.clientX, e.clientY);
  }

  function demarrerCharge(e) {
    // Début du coup chargé : la tapette animée remplace le curseur,
    // elle clignote pendant la charge, et la barre pixel art se remplit
    if (chargeActive) return;
    chargeActive = true;
    debutCharge = performance.now();
    reculCharge = 0;

    tapetteEl = document.createElement("div");
    tapetteEl.id = "tapette-charge";
    tapetteEl.className = "clignote";
    tapetteEl.innerHTML = SVG_TAPETTE;
    tapetteEl.style.transform = "translate(0px, 0px) rotate(0deg)";
    conteneurJeu.appendChild(tapetteEl);
    positionnerTapette(e.clientX, e.clientY);
    document.documentElement.classList.add("tapette-animee");

    barreChargeEl = document.createElement("div");
    barreChargeEl.id = "barre-charge";
    remplieChargeEl = document.createElement("div");
    remplieChargeEl.id = "barre-charge-remplie";
    barreChargeEl.appendChild(remplieChargeEl);
    conteneurJeu.appendChild(barreChargeEl);
    positionnerBarreCharge(e.clientX, e.clientY);
  }

  function positionnerTapette(x, y) {
    if (!tapetteEl) return;
    tapetteEl.style.left = (x - 27) + "px";
    tapetteEl.style.top = (y - 22) + "px";
  }

  function positionnerBarreCharge(x, y) {
    if (!barreChargeEl) return;
    barreChargeEl.style.left = (x - 24) + "px";
    barreChargeEl.style.top = (y + 24) + "px";
  }

  function annulerCharge() {
    // Interruption brutale (fin de partie, sortie de page) :
    // tout disparaît immédiatement, sans animation
    chargeActive = false;
    if (barreChargeEl) { barreChargeEl.remove(); barreChargeEl = null; }
    remplieChargeEl = null;
    if (tapetteEl) { tapetteEl.remove(); tapetteEl = null; }
    document.documentElement.classList.remove("tapette-animee");
    reculCharge = -1;
  }

  function arreterChargeVisuel() {
    // Relâchement du clic : la tapette s'abat d'un coup sec, puis disparaît
    if (barreChargeEl) { barreChargeEl.remove(); barreChargeEl = null; remplieChargeEl = null; }
    document.documentElement.classList.remove("tapette-animee");
    if (tapetteEl) {
      const t = tapetteEl;
      tapetteEl = null;
      t.classList.remove("clignote");
      t.classList.add("frappe");
      // Elle s'abat vers la gauche, sur le point d'impact
      t.style.transform = "translate(-5px, 7px) rotate(-14deg)";
      setTimeout(function () { t.remove(); }, 120);
    }
    reculCharge = -1;
  }

  function relacherClic(e) {
    // Relâchement du clic : si la charge est complète (2 s),
    // la tapette s'abat sur une zone 50 % plus grande
    if (!chargeActive) return;
    const chargeComplete = (performance.now() - debutCharge) >= DUREE_CHARGE;
    chargeActive = false;
    arreterChargeVisuel();
    if (chargeComplete) frapperCharge(e);
  }

  function frapperCharge(e) {
    // Coup chargé : zone de frappe 200 % plus grande que le coup normal,
    // secousse renforcée et explosion de pixels bien plus généreuse
    if (etapeFin === "mot" || etapeFin === "defaite") return;
    if (etapeFin === "boss" && (bossChute || bossAuSol)) return;

    declencherScreenShakeFort();

    // Trois ondes noires successives, de plus en plus larges et denses
    for (let o = 0; o < 3; o++) {
      setTimeout(function () {
        if (conteneurJeu) creerOndeImpact(e.clientX, e.clientY, o);
      }, o * 150);
    }

    // Grande explosion de pixels rouges au point d'impact, même sans mouche touchée
    for (let i = 0; i < 30; i++) {
      creerPixelPhysique(e.clientX + (Math.random() - 0.5) * 44, e.clientY + (Math.random() - 0.5) * 44);
    }

    if (etapeFin === "boss") {
      // Zone de destruction 200 % plus grande sur le boss (90 px au lieu de 30),
      // et le coup chargé retire 3 unités de vie
      if (bossEl && Math.hypot(e.clientX - bossX, e.clientY - bossY) < 90) {
        frapperBoss(3);
      }
      return;
    }

    if (estEnFreeze) return;

    // Zone de destruction 200 % plus grande (84 px au lieu de 28) :
    // on peut éliminer un petit nuage de mouches d'un seul coup chargé
    for (const m of mouches) {
      if (m.etat === "morte" || m.etat === "touchee") continue;
      if (Math.hypot(e.clientX - m.x, e.clientY - m.y) < 84) {
        tuerMouche(m);
      }
    }
  }

  function frapperMouche(e) {
    // Fin de partie : cliquer sur "congratulations !" ou "GAME OVER"
    // pour recommencer, avec secousse d'écran
    if (etapeFin === "mot" || etapeFin === "defaite") {
      if (motEl) {
        const r = motEl.getBoundingClientRect();
        if (e.clientX >= r.left - 20 && e.clientX <= r.right + 20 &&
            e.clientY >= r.top - 12 && e.clientY <= r.bottom + 12) {
          declencherScreenShake();
          reinitialiserNiveau();
        }
      }
      return;
    }

    // Boss : il faut 20 cliques pour le tuer
    // (une fois tué, pendant sa chute, on ne peut plus le frapper)
    if (etapeFin === "boss") {
      if (bossEl && !bossChute && Math.hypot(e.clientX - bossX, e.clientY - bossY) < 30) {
        frapperBoss();
      }
      // Maintenir le clic pour charger un coup plus large sur le boss
      if (!bossChute && !bossAuSol) demarrerCharge(e);
      return;
    }

    if (estEnFreeze) return;

    // Rayon de collision précis ajusté pour la petite mouche
    for (const m of mouches) {
      if (m.etat === "morte" || m.etat === "touchee") continue;
      if (Math.hypot(e.clientX - m.x, e.clientY - m.y) < 28) {
        tuerMouche(m);
      }
    }

    // Maintenir le clic pour charger un coup de zone 50 % plus grande,
    // mais seulement une fois la première mouche tuée
    if (jeuCommence) demarrerCharge(e);
  }

  function tuerMouche(m) {
    // Une fois la fin déclenchée, les mouches restantes d'un même coup
    // n'ont plus rien à faire ici : elles partent rejoindre le boss
    if (etapeFin) return;

    m.etat = "touchee";
    m.el.classList.add("touchee");

    // La partie ne commence qu'au premier coup porté à une mouche :
    // compteur et timer apparaissent à ce moment-là, et pas avant
    if (!jeuCommence) {
      jeuCommence = true;
      demarrerHUD();
    }

    mouchesMortes++;
    majTextePixel(compteurMouchesEl, String(mouchesMortes));

    // 1. Frame Freeze (micro-pause visuelle au moment du choc)
    estEnFreeze = true;

    // 2. Shake d'écran immédiat
    declencherScreenShake();

    // 3. Éjection de particules pixel art rouges, qui retombent
    for (let i = 0; i < 16; i++) {
      creerPixelPhysique(m.x, m.y);
    }

    // Reprise après l'effet de freeze
    setTimeout(() => {
      estEnFreeze = false;
      if (!m.el.isConnected || etapeFin) return;
      m.etat = "morte";
      m.reposeAuSol = false;
      m.el.classList.remove("touchee");
      m.el.classList.add("morte");
    }, 70); // Frame Freeze de 70ms

    // À chaque mort, une nouvelle mouche apparaît, plus une supplémentaire :
    // plus on tue de mouches, plus il y en a à l'écran (niveau = mouches vivantes)
    if (niveau >= NIVEAU_MAX) {
      // Les 50 mouches sont tuées : les cadavres s'agglutinent en un boss
      declencherFin();
    } else {
      niveau++;
      creerMouche(); // Le remplacement
      creerMouche(); // ...et une de plus
    }
  }

  function nouvelleCibleMouche(m) {
    const marge = 60;
    m.cibleX = marge + Math.random() * (window.innerWidth - marge * 2);
    m.cibleY = marge + Math.random() * (window.innerHeight - marge * 2);
  }

  function boucleJeu() {
    if (!estEnFreeze) {
      for (const m of mouches) updateMouche(m);
      if (bossEl) updateBoss();
    }

    // Barre de coup chargé : remplissage + tapette qui recule en trois temps
    if (chargeActive && remplieChargeEl) {
      const progression = Math.min(1, (performance.now() - debutCharge) / DUREE_CHARGE);
      remplieChargeEl.style.width = (progression * 100) + "%";
      if (progression >= 1 && barreChargeEl) barreChargeEl.classList.add("chargee");

      // Recul réparti aux tiers du temps de charge :
      // la tapette se prépare à frapper vers la droite, de plus en plus loin
      const etape = Math.min(3, Math.floor(progression * 3));
      if (tapetteEl && etape !== reculCharge) {
        reculCharge = etape;
        tapetteEl.style.transform =
          "translate(" + (etape * 10) + "px, " + (-etape * 8) + "px) rotate(" + (etape * 16) + "deg)";
      }
    }

    idAnimJeu = requestAnimationFrame(boucleJeu);
  }

  function updateMouche(m) {
    if (!m.el) return;

    m.timerEtat++;

    if (m.etat === "vol") {
      m.el.classList.remove("pose");
      m.el.classList.add("visible");

      const dx = m.cibleX - m.x;
      const dy = m.cibleY - m.y;
      const dist = Math.hypot(dx, dy);

      // Changement fréquent et erratique de cible (nervosité)
      if (dist < 30 || m.timerEtat > 35 || Math.random() < 0.04) {
        nouvelleCibleMouche(m);
        m.timerEtat = 0;
        if (Math.random() < 0.15) {
          m.etat = "pose";
          m.timerEtat = 0;
          // Parfois une vraie pause de 2 secondes (120 frames) pour se laisser approcher
          m.dureePause = (Math.random() < 0.45) ? 120 : 20 + Math.random() * 30;
        }
      }

      // Vitesse faible : la première partie du jeu reste facile
      const vitesseMax = 6.0;
      m.vx += (dx / (dist || 1)) * 1.1;
      m.vy += (dy / (dist || 1)) * 1.1;

      // Mouvement erratique nerveux
      m.vx += (Math.random() - 0.5) * 3.2;
      m.vy += (Math.random() - 0.5) * 3.2;

      const vActuelle = Math.hypot(m.vx, m.vy);
      if (vActuelle > vitesseMax) {
        m.vx = (m.vx / vActuelle) * vitesseMax;
        m.vy = (m.vy / vActuelle) * vitesseMax;
      }

      m.x += m.vx;
      m.y += m.vy;

      // Rebond sur les bords de l'écran
      const bord = 15;
      if (m.x < bord) { m.x = bord; m.vx *= -1; }
      if (m.x > window.innerWidth - bord) { m.x = window.innerWidth - bord; m.vx *= -1; }
      if (m.y < bord) { m.y = bord; m.vy *= -1; }
      if (m.y > window.innerHeight - bord) { m.y = window.innerHeight - bord; m.vy *= -1; }

      const angle = Math.atan2(m.vy, m.vx) * (180 / Math.PI) + 90;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${angle}deg)`;

    } else if (m.etat === "pose") {
      m.el.classList.add("pose", "visible");
      m.vx = 0;
      m.vy = 0;

      // Micro-tremblements pixel art au repos
      const ox = (Math.random() - 0.5) * 1.5;
      const oy = (Math.random() - 0.5) * 1.5;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE + ox}px, ${m.y - DEMI_MOUCHE + oy}px, 0)`;

      if (m.timerEtat > m.dureePause) {
        m.etat = "vol";
        m.timerEtat = 0;
        nouvelleCibleMouche(m);
      }

    } else if (m.etat === "virevolte") {
      // Fin de partie : le cadavre virevolte jusqu'à sa place dans le mot
      if (m.delaiFin > 0) {
        m.delaiFin--;
        return;
      }
      if (m.progression < 1) {
        m.progression = Math.min(1, m.progression + m.vitesseFin);
        const t = m.progression;
        const aise = t * t * (3 - 2 * t); // décélération douce
        const tour = t * Math.PI * 4;     // deux tours complets en arrivant
        const amplitude = 30 * (1 - aise);
        m.x = m.departX + (m.cibleFinX - m.departX) * aise + Math.cos(tour) * amplitude;
        m.y = m.departY + (m.cibleFinY - m.departY) * aise + Math.sin(tour) * amplitude;
        m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${180 + t * 540}deg)`;
      } else {
        // Arrivé à destination : la mouche se met en orbite autour du boss (puis du mot)
        m.etat = "orbite";
        m.angleOrbite = Math.atan2(m.y - bossY, m.x - bossX);
        m.rayonOrbite = 50 + Math.random() * 110;
        m.vitesseOrbite = (Math.random() < 0.5 ? -1 : 1) * (0.008 + Math.random() * 0.03);
        // Paramètres de chaos : rayon oscillant, tangage et dérive erratiques
        m.bobPhase = Math.random() * Math.PI * 2;
        m.bobVitesse = 0.05 + Math.random() * 0.12;
        m.amplitudeRayon = 12 + Math.random() * 26;
        m.tangagePhase = Math.random() * Math.PI * 2;
        m.tangageVitesse = 0.08 + Math.random() * 0.2;
      }

    } else if (m.etat === "orbite") {
      // Les mouches mortes tournent autour du boss, puis autour du mot,
      // de façon chaotique : rayon oscillant, vitesse instable,
      // demi-tours brusques et changements de trajectoire imprévus
      m.angleOrbite += m.vitesseOrbite + (Math.random() - 0.5) * 0.05;
      m.bobPhase += m.bobVitesse;
      m.tangagePhase += m.tangageVitesse;

      if (Math.random() < 0.012) m.vitesseOrbite *= -1;   // demi-tour brutal
      if (Math.random() < 0.02) m.rayonOrbite = 30 + Math.random() * 140; // nouvelle trajectoire

      const centreX = (etapeFin === "mot") ? window.innerWidth / 2 : bossX;
      const centreY = (etapeFin === "mot") ? window.innerHeight / 2 : bossY;
      const rayon = m.rayonOrbite + Math.sin(m.bobPhase) * m.amplitudeRayon;
      const cibleOrbiteX = centreX + Math.cos(m.angleOrbite) * rayon;
      const cibleOrbiteY = centreY + Math.sin(m.angleOrbite) * rayon + Math.sin(m.tangagePhase) * 12;
      m.x += (cibleOrbiteX - m.x) * 0.16;
      m.y += (cibleOrbiteY - m.y) * 0.16;
      m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(${180 + Math.sin(m.tangagePhase) * 30}deg)`;

    } else if (m.etat === "morte") {
      const sol = window.innerHeight - 41; // Sol invisible, aligné sur la hauteur VISUELLE du chien : son sprite a du vide transparent dessous, ses pattes sont ~9 px plus haut que sa ligne CSS (--marge du bas)

      if (!m.reposeAuSol) {
        // Chute après impact, avec légère dérive horizontale
        m.vy += 1.8;
        m.y += m.vy;
        m.vx *= 0.98;
        m.x += m.vx;

        if (m.x < 8) m.x = 8;
        if (m.x > window.innerWidth - 8) m.x = window.innerWidth - 8;

        if (m.y >= sol) {
          m.y = sol;
          if (m.vy > 2.5) {
            m.vy = -m.vy * 0.35; // Petit rebond sur le sol invisible
          } else {
            m.vy = 0;
            m.vx = 0;
            m.reposeAuSol = true;
            // Le cadavre reste définitivement au sol
          }
        }

        m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(180deg) scale(0.9)`;
      } else {
        // La mouche morte repose sur le dos, sur le sol invisible, pour toujours
        // (recalcul uniquement si la fenêtre est redimensionnée)
        if (m.y !== sol) {
          m.y = sol;
          m.el.style.transform = `translate3d(${m.x - DEMI_MOUCHE}px, ${m.y - DEMI_MOUCHE}px, 0) rotate(180deg) scale(0.9)`;
        }
      }
    }
  }

  const CHIEN_LARG = 32;   // pixels par ligne
  const CHIEN_HAUT = 20;   // lignes
  const CHIEN_ECHELLE = 3; // chaque pixel de grille = 3 px (rendu fin)
