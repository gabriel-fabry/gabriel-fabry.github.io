    imgDessous.decoding = "async";
    imgDessous.onload = function () {
      if (photoNumDessous !== null) {
        dimsAccueil[nomImageAccueil(photoNumDessous)] =
          { l: imgDessous.naturalWidth, h: imgDessous.naturalHeight };
        enregistrerDimsAccueil();
      }
      imgDessous.style.visibility = "visible";
    };
    imgDessous.style.visibility = "hidden";
    let echangeEnAttente = false;
    let nouveauDessusPret = false;
    let nouveauDessousPrete = false;
    let srcDessousAttente = null;
    cadre.appendChild(imgDessous);

    const canvas = document.createElement("canvas");
    canvas.id = "canvas-accueil";
    cadre.appendChild(canvas);
    fig.appendChild(cadre);
    contenu.appendChild(fig);

    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return;

    const src = "images/accueil/" + encodeURIComponent(SITE.accueil);
    const photo = new Image();
    photo.decoding = "async";

    let photoData = null;
    let photoOrig = null;
    let modeReparation = false;
    let photoSale = true;

    // REGLAGE : RESOLUTION DU GRATTAGE
    const RESOLUTION_MAX = 1600;

    // REGLAGE : TAILLE DU PINCEAU DE GRATTAGE
    const PINCEAU_TAILLE_DESKTOP = 0.04;
    const PINCEAU_TAILLE_MOBILE = 0.03;

    // REGLAGE : CLIC DROIT REPARATEUR
    const REPARATION_CLIC_DROIT = true;

    let recadrage = { sx: 0, sy: 0, l: 0, h: 0 };
    function chargerEtDessiner() {
      const RATIO_5_7 = 5 / 7;
      let sx = 0;
      let sy = 0;
      let l = photo.naturalWidth;
      let h = photo.naturalHeight;
      const mobile = !!(window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches);
      if (mobile && h > l) {
        if (l / h > RATIO_5_7) {
          const c = Math.round(h * RATIO_5_7);
          sx = Math.floor((l - c) / 2);
          l = c;
        } else {
          const c = Math.round(l / RATIO_5_7);
          sy = Math.floor((h - c) / 2);
          h = c;
        }
      }
      if (photoNumDessus !== null) {
        dimsAccueil[nomImageAccueil(photoNumDessus)] =
          { l: photo.naturalWidth, h: photo.naturalHeight };
        enregistrerDimsAccueil();
      }
      tiragesRates = 0;
      recadrage = { sx: sx, sy: sy, l: l, h: h };
      const plusLong = Math.max(l, h);
      const k = plusLong > RESOLUTION_MAX ? RESOLUTION_MAX / plusLong : 1;
      canvas.width = Math.max(1, Math.round(l * k));
      canvas.height = Math.max(1, Math.round(h * k));
      ctx.drawImage(photo, sx, sy, l, h, 0, 0, canvas.width, canvas.height);
      photoOrig = document.createElement("canvas");
      photoOrig.width = canvas.width;
      photoOrig.height = canvas.height;
      photoOrig.getContext("2d").drawImage(canvas, 0, 0);
      photoSale = true;
    }

    function actualiserPhotoData() {
      try {
        photoData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        photoSale = false;
      } catch (e) {
        photoData = null;
      }
    }

    let retiragesHorizontales = 0;
    photo.onload = function () {
      if (echangeEnAttente && photoNumDessus !== null &&
          window.matchMedia &&
          window.matchMedia("(max-width: 760px)").matches &&
          photo.naturalWidth > photo.naturalHeight &&
          retiragesHorizontales < 5 &&
          paquetAccueil && paquetAccueil.max > 1) {
        retiragesHorizontales++;
        dimsAccueil[nomImageAccueil(photoNumDessus)] =
          { l: photo.naturalWidth, h: photo.naturalHeight };
        enregistrerDimsAccueil();
        tirerImageAccueil(paquetAccueil.max);
        return;
      }
      retiragesHorizontales = 0;
      if (echangeEnAttente) {
        nouveauDessusPret = true;
        finaliserEchangeAccueil();
      } else {
        chargerEtDessiner();
      }
    };
    let tiragesRates = 0;
    photo.onerror = function () {
      if (photoNumDessus === null) return;
      const num = photoNumDessus;
      tiragesRates++;
      carteAbsenteAccueil(num);
      if (tiragesRates > 5 || !paquetAccueil || paquetAccueil.max < 1) {
        photoNumDessus = null;
        photoNumDessous = null;
        echangeEnAttente = false;
        finFonduAccueil();
        srcDessousAttente = null;
        reinitialiserPhysique();
        photo.src = src;
        imgDessous.src = src;
        return;
      }
      tirerImageAccueil(paquetAccueil.max);
    };

    const LOT_SONDES = 10;
    let totalAccueil = 0;
    let accueilTire = false;
    const dimsAccueil = {};
    try {
      const brutDims = JSON.parse(localStorage.getItem("accueil-dims"));
      if (brutDims && typeof brutDims.j === "number" && brutDims.d &&
          Date.now() - brutDims.j < 604800000) {
        for (const cle in brutDims.d) dimsAccueil[cle] = brutDims.d[cle];
      }
    } catch (e) {   }
    function enregistrerDimsAccueil() {
      try {
        localStorage.setItem("accueil-dims",
          JSON.stringify({ j: Date.now(), d: dimsAccueil }));
      } catch (e) {   }
    }
    let photoNumDessus = null;
    let photoNumDessous = null;
    function actualiserTotalAccueil(total) {
      if (total === totalAccueil) return;
      totalAccueil = total;
      preparerPaquetAccueil(total);
    }
    function carteAbsenteAccueil(num) {
      if (!paquetAccueil) return;
      const ancienMax = paquetAccueil.max;
      for (let k = num; k <= ancienMax; k++) {
        delete dimsAccueil[nomImageAccueil(k)];
      }
      enregistrerDimsAccueil();
      paquetAccueil.reste =
        paquetAccueil.reste.filter(function (n) { return n !== num; });
      if (num <= paquetAccueil.max) {
        paquetAccueil.max = num - 1 > 0 ? num - 1 : 0;
      }
      if (paquetAccueil.derniere === num) paquetAccueil.derniere = null;
      totalAccueil = paquetAccueil.max;
      sauvegarderPaquetAccueil();
    }
    function tirerImageAccueil(total) {
      totalAccueil = total;
      accueilTire = true;
      preparerPaquetAccueil(total);
      const mobile = !!(window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches);
      const ratioAcceptable = function (n) {
        const d = dimsAccueil[nomImageAccueil(n)];
        if (!d) return true;
        const r = d.l / d.h;
        return r <= 2.5 && r >= 1 / 2.5;
      };
      const toutes = [];
      for (let n = 1; n <= total; n++) {
        if (ratioAcceptable(n)) toutes.push(n);
      }
      if (toutes.length === 0) {
        for (let n = 1; n <= total; n++) toutes.push(n);
      }
      let pool = toutes;
      if (mobile) {
        const verticales = toutes.filter(function (n) {
          const d = dimsAccueil[nomImageAccueil(n)];
          return !d || d.h >= d.l;
        });
        if (verticales.length > 0) pool = verticales;
      }
      const numDessus = tirerCarteAccueil(pool);
      const numDessous = tirerCarteAccueil(toutes);
      photoNumDessus = numDessus;
      photoNumDessous = numDessous;
      sauvegarderPaquetAccueil();
      echangeEnAttente = true;
      nouveauDessusPret = false;
      nouveauDessousPrete = false;
      photo.src = nomImageAccueil(numDessus);
      chargerNouvelleDessous(nomImageAccueil(numDessous));
    }
    let fonduReloadDemande = false;
    function debutFonduAccueil() {
      fonduReloadDemande = !mouvementReduit.matches;
    }
    function finFonduAccueil() {
      fonduReloadDemande = false;
    }
    function prendreCalqueFondu() {
      if (!fonduReloadDemande) return null;
      fonduReloadDemande = false;
      try {
        const r = cadre.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) return null;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const c = document.createElement("canvas");
        c.width = Math.round(r.width * dpr);
        c.height = Math.round(r.height * dpr);
        const g = c.getContext("2d");
        g.scale(dpr, dpr);
        if (imgDessous.complete && imgDessous.naturalWidth > 0 &&
            imgDessous.style.visibility !== "hidden") {
          const b = imgDessous.getBoundingClientRect();
          const nw = imgDessous.naturalWidth;
          const nh = imgDessous.naturalHeight;
          const k = Math.max(b.width / nw, b.height / nh);
          const sw = b.width / k;
          const sh = b.height / k;
          g.drawImage(imgDessous, (nw - sw) / 2, (nh - sh) / 2, sw, sh,
            b.left - r.left, b.top - r.top, b.width, b.height);
        }
        const bc = canvas.getBoundingClientRect();
        g.drawImage(canvas, bc.left - r.left, bc.top - r.top,
          bc.width, bc.height);
        const tas = cadre.querySelectorAll("canvas.tas-affichage");
        for (let i = 0; i < tas.length; i++) {
          const bt = tas[i].getBoundingClientRect();
          if (bt.width > 0 && bt.height > 0) {
            g.drawImage(tas[i], bt.left - r.left, bt.top - r.top,
              bt.width, bt.height);
          }
        }
        c.style.cssText = "position:absolute;left:0;top:0;width:" +
          r.width + "px;height:" + r.height +
          "px;z-index:5;pointer-events:none;opacity:1;";
        cadre.appendChild(c);
        return c;
      } catch (e) {
        return null;
      }
    }
    function lancerFonduAccueil(calque) {
      if (!calque) return;
      void calque.offsetWidth;
      calque.style.transition = "opacity 0.45s ease";
      calque.style.opacity = "0";
      const retirer = function () {
        if (calque.parentNode) calque.parentNode.removeChild(calque);
      };
      calque.addEventListener("transitionend", retirer);
      setTimeout(retirer, 800);
    }
    function finaliserEchangeAccueil() {
      if (!nouveauDessusPret || !nouveauDessousPrete) return;
      const calqueFondu = prendreCalqueFondu();
      echangeEnAttente = false;
      nouveauDessusPret = false;
      nouveauDessousPrete = false;
      reinitialiserPhysique();
      const urlDessous = srcDessousAttente;
      srcDessousAttente = null;
      chargerEtDessiner();
      if (urlDessous) {
        imgDessous.src = urlDessous;
        imgDessous.style.visibility = "visible";
      }
      lancerFonduAccueil(calqueFondu);
    }
    function chargerNouvelleDessous(url) {
      srcDessousAttente = url;
      const precharge = new Image();
      precharge.decoding = "async";
      precharge.onload = function () {
        if (srcDessousAttente !== url) return;
        if (photoNumDessous !== null) {
          dimsAccueil[url] =
            { l: precharge.naturalWidth, h: precharge.naturalHeight };
          enregistrerDimsAccueil();
        }
        nouveauDessousPrete = true;
        finaliserEchangeAccueil();
      };
      precharge.onerror = function () {
        if (srcDessousAttente !== url) return;
        if (photoNumDessous !== null) {
          const num = photoNumDessous;
          photoNumDessous = null;
          carteAbsenteAccueil(num);
        }
        srcDessousAttente = photo.src;
        nouveauDessousPrete = true;
        finaliserEchangeAccueil();
      };
      precharge.src = url;
    }
    function sonderAccueil(debut, fin) {
      let restants = fin - debut + 1;
      let premiereRatee = fin + 1;
      const sondeTerminee = function (num, ok) {
        if (!ok && num < premiereRatee) premiereRatee = num;
        restants--;
        if (restants > 0) return;
        if (premiereRatee > fin) {
          if (!accueilTire) tirerImageAccueil(fin);
          sonderAccueil(fin + 1, fin + LOT_SONDES);
          return;
        }
        const total = premiereRatee - 1;
        enregistrerDimsAccueil();
        if (total > 0) {
          if (!accueilTire) tirerImageAccueil(total);
          else actualiserTotalAccueil(total);
        } else if (!accueilTire) {
          photo.src = src;
          imgDessous.src = src;
          accueilTire = true;
        }
      };
      for (let n = debut; n <= fin; n++) {
        (function (num) {
          const dConnues = dimsAccueil[nomImageAccueil(num)];
          if (dConnues) {
            sondeTerminee(num, true);
            return;
          }
          const sonde = new Image();
          sonde.onload = function () {
            dimsAccueil[nomImageAccueil(num)] =
              { l: sonde.naturalWidth, h: sonde.naturalHeight };
            sondeTerminee(num, true);
          };
          sonde.onerror = function () { sondeTerminee(num, false); };
          sonde.src = nomImageAccueil(num);
        })(n);
      }
    }
    paquetAccueil = chargerPaquetAccueil();
    if (paquetAccueil && paquetAccueil.max > 0) tirerImageAccueil(paquetAccueil.max);
    sonderAccueil(1, LOT_SONDES);

    let estEnTrainDeCliquer = false;
    let precedentGrattage = null;
    let griffeAttendue = null;

    function gratterEtEjecter(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const echelleX = canvas.width / rect.width;
      const echelleY = canvas.height / rect.height;

      const x = (clientX - rect.left) * echelleX;
      const y = (clientY - rect.top) * echelleY;

      const taillePinceau = (window.matchMedia && window.matchMedia("(max-width: 760px)").matches)
        ? PINCEAU_TAILLE_MOBILE
        : PINCEAU_TAILLE_DESKTOP;
      const rayonPinceau = Math.min(canvas.width, canvas.height) * taillePinceau;

      if (photoData) {
        const pBuffer = photoData.data;
        const nbParticules = 10;

        for (let k = 0; k < nbParticules; k++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.pow(Math.random(), 1.8) * rayonPinceau;
          const px = Math.floor(x + Math.cos(angle) * r);
          const py = Math.floor(y + Math.sin(angle) * r);

          if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
            const index = (py * canvas.width + px) * 4;
            const alpha = pBuffer[index + 3];

            if (alpha > 0) {
              const hexColor = "#" + (
                (1 << 24) +
                (pBuffer[index] << 16) +
                (pBuffer[index + 1] << 8) +
                pBuffer[index + 2]
              ).toString(16).slice(1);

              if (!tasActif) initialiserTas(canvas);
              creerParticuleTas(tasDebord + px / echelleX, py / echelleY, hexColor);
            }
          }
        }
      }

      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rayonPinceau);
      grad.addColorStop(0, "rgba(0,0,0,1)");
      grad.addColorStop(0.5, "rgba(0,0,0,0.6)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;

      const tampon = function (cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, rayonPinceau, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      if (precedentGrattage) {
        const dx = x - precedentGrattage.x;
        const dy = y - precedentGrattage.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const pas = Math.min(12, Math.max(1, Math.ceil(dist / (rayonPinceau * 0.5))));
        for (let i = 0; i <= pas; i++) {
          const t = i / pas;
          tampon(precedentGrattage.x + dx * t, precedentGrattage.y + dy * t);
        }
      } else {
        tampon(x, y);
      }

      ctx.restore();
      precedentGrattage = { x: x, y: y };
    }

    let tamponRep = null;
    function reparer(clientX, clientY) {
      if (!photoOrig) return;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      const taille = (window.matchMedia && window.matchMedia("(max-width: 760px)").matches)
        ? PINCEAU_TAILLE_MOBILE : PINCEAU_TAILLE_DESKTOP;
      const rayon = Math.min(canvas.width, canvas.height) * taille;
      const cote = Math.ceil(rayon * 2) + 2;
      if (!tamponRep) tamponRep = document.createElement("canvas");
      if (tamponRep.width !== cote) { tamponRep.width = cote; tamponRep.height = cote; }
      const tg = tamponRep.getContext("2d");
      const poser = function (cx, cy) {
        const ox = Math.round(cx - cote / 2);
        const oy = Math.round(cy - cote / 2);
        tg.globalCompositeOperation = "source-over";
        tg.clearRect(0, 0, cote, cote);
        const grad = tg.createRadialGradient(cote / 2, cote / 2, 0, cote / 2, cote / 2, rayon);
        grad.addColorStop(0, "rgba(0,0,0,1)");
        grad.addColorStop(0.5, "rgba(0,0,0,0.6)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        tg.fillStyle = grad;
        tg.fillRect(0, 0, cote, cote);
        tg.globalCompositeOperation = "source-in";
        tg.drawImage(photoOrig, ox, oy, cote, cote, 0, 0, cote, cote);
        ctx.drawImage(tamponRep, ox, oy);
      };
      if (precedentGrattage) {
        const dx = x - precedentGrattage.x;
        const dy = y - precedentGrattage.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const pas = Math.min(12, Math.max(1, Math.ceil(dist / (rayon * 0.5))));
        for (let i = 0; i <= pas; i++) {
          poser(precedentGrattage.x + dx * i / pas, precedentGrattage.y + dy * i / pas);
        }
      } else {
        poser(x, y);
      }
      precedentGrattage = { x: x, y: y };
    }
    canvas.addEventListener("contextmenu", function (e) { if (REPARATION_CLIC_DROIT) e.preventDefault(); });

    canvas.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && !(e.button === 2 && REPARATION_CLIC_DROIT)) return;
      modeReparation = (e.button === 2);
      estEnTrainDeCliquer = true;
      precedentGrattage = null;
      if (photoSale) actualiserPhotoData();
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      if (modeReparation) reparer(e.clientX, e.clientY);
      else gratterEtEjecter(e.clientX, e.clientY);
    });

    canvas.addEventListener("pointermove", function (e) {
      if (!estEnTrainDeCliquer) return;
      if (griffeAttendue) {
        griffeAttendue[0] = e.clientX;
        griffeAttendue[1] = e.clientY;
        return;
      }
      griffeAttendue = [e.clientX, e.clientY];
      requestAnimationFrame(function () {
        const p = griffeAttendue;
        griffeAttendue = null;
        if (p && estEnTrainDeCliquer) {
          if (modeReparation) reparer(p[0], p[1]);
          else gratterEtEjecter(p[0], p[1]);
        }
      });
    });

    const stopperGomme = function (e) {
      if (estEnTrainDeCliquer) {
        estEnTrainDeCliquer = false;
        precedentGrattage = null;
        photoSale = true;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    };

    canvas.addEventListener("pointerup", stopperGomme);
    canvas.addEventListener("pointercancel", stopperGomme);

    const boutonVent = document.createElement("button");
    boutonVent.type = "button";
    boutonVent.className = "bouton-vent";
    iconeVent(boutonVent);
    boutonVent.title = "Nettoyer en soufflant dans le micro";
    boutonVent.setAttribute("aria-label", "Nettoyer en soufflant dans le micro");
    boutonVent.addEventListener("click", function () {
      demarrerMicroVent(boutonVent);
    });
    cadre.appendChild(boutonVent);

    function rafraichirImageAccueil() {
      photoSale = true;
      estEnTrainDeCliquer = false;
      precedentGrattage = null;
      if (totalAccueil > 0) debutFonduAccueil();
      if (totalAccueil > 0) tirerImageAccueil(totalAccueil);
      else { reinitialiserPhysique(); photo.src = src; imgDessous.src = src; }
    }
    const boutonRafraichir = document.createElement("button");
    boutonRafraichir.type = "button";
    boutonRafraichir.className = "bouton-rafraichir";
    const imgReload = document.createElement("img");
    imgReload.src = ICONE_RELOAD;
    imgReload.alt = "";
    imgReload.decoding = "async";
    boutonRafraichir.appendChild(imgReload);
    boutonRafraichir.title = "Changer la photo";
    boutonRafraichir.setAttribute("aria-label", "Changer la photo d'accueil");
    boutonRafraichir.addEventListener("click", rafraichirImageAccueil);
    if (window.matchMedia &&
        window.matchMedia("(max-width: 760px)").matches) {
      menu.parentNode.appendChild(boutonRafraichir);
    } else {
      cadre.appendChild(boutonRafraichir);
    }
  }

  function remplacerFondu(cadre, imgEl, nouvelleSrc, altTexte) {
    if (!nouvelleSrc) {
      imgEl.style.display = "none";
      return;
    }
    imgEl.style.display = "block";
    if (imgEl._chienBrulure) {
      imgEl._chienBrulure.remove();
      imgEl._chienBrulure = null;
    }
    const ancienSrc = imgEl.getAttribute("src");
    if (ancienSrc === nouvelleSrc) return;
    if (!ancienSrc || mouvementReduit.matches) {
      imgEl.src = nouvelleSrc;
      imgEl.alt = altTexte;
      return;
    }

    let fait = false;
    const appliquer = function () {
      if (fait) return;
      fait = true;

      const ancienL = imgEl.offsetWidth;
      const ancienH = imgEl.offsetHeight;
      const ancienX = imgEl.offsetLeft;
      const ancienY = imgEl.offsetTop;

      const calque = imgEl.cloneNode();
      calque.className = "superpose";
      if (ancienL > 0 && ancienH > 0) {
        calque.style.left = ancienX + "px";
        calque.style.top = ancienY + "px";
        calque.style.width = ancienL + "px";
        calque.style.height = ancienH + "px";
        calque.style.maxWidth = "none";
        calque.style.maxHeight = "none";
        calque.style.objectFit = "fill";
      }
      calque.style.pointerEvents = "none";
      cadre.appendChild(calque);

      imgEl.src = nouvelleSrc;
      imgEl.alt = altTexte;

      requestAnimationFrame(function () {
        requestAnimationFrame(function () { calque.classList.add("fondu"); });
        setTimeout(function () { calque.remove(); }, 700);
      });
      calque.addEventListener("transitionend", function () { calque.remove(); });
    };

    const precharge = new Image();
    const pret = function () {
      if (precharge.decode) {
        precharge.decode().then(appliquer, appliquer);
      } else {
        appliquer();
      }
    };
    precharge.onload = pret;
    precharge.onerror = function () { fait = true; imgEl.src = nouvelleSrc; imgEl.alt = altTexte; };
    precharge.src = nouvelleSrc;
    if (precharge.complete) pret();
  }

  /* --- SÉRIES CLASSIQUES --- */
  /* REGLAGE : PLANCHE CONTACT */
  const PLANCHE_SERIES = {
    defaut:   { hauteur: 110, marge: 14 },
    arles:    { hauteur: 200, marge: 14 },
    homes:    { hauteur: 150, marge: 14 },
    cecifoot: { hauteur: 170, marge: 14 },
    cammaron: { hauteur: 130, marge: 14 },
    milk:     { hauteur: 320, marge: 14 },
    carnaval: { hauteur: 140, marge: 14 },
	test:     { hauteur: 150, marge: 14 },
    "18images": { hauteur: 200, marge: 10 }
  };
  function entreeDossier(table, dossier) {
    const cle = String(dossier).toLowerCase();
    for (const nom in table) {
      if (nom !== "defaut" && nom.toLowerCase() === cle) return table[nom];
    }
    return null;
  }
  function reglagesPlanche(dossier) {
    return entreeDossier(PLANCHE_SERIES, dossier) || PLANCHE_SERIES.defaut;
  }

  /* RÉGLAGE : EFFET DES PLANCHES CONTACT */
  const PLANCHE_EFFET = {
    defaut:   { intensite: 0.30, gris: 1, entree: 300, retour: 300 }
  };
  function appliquerEffetPlanche(el, dossier) {
    const e = Object.assign({}, PLANCHE_EFFET.defaut, entreeDossier(PLANCHE_EFFET, dossier) || {});
    const intensite = Math.min(1, Math.max(0, e.intensite));
    el.style.setProperty("--planche-opacite", String(1 - intensite));
    const gris = Math.min(1, Math.max(0, e.gris));
    el.style.setProperty("--planche-gris", String(gris));
    el.style.setProperty("--planche-entree", Math.max(0, e.entree) + "ms");
    el.style.setProperty("--planche-retour", Math.max(0, e.retour) + "ms");
  }

  function planchePermise() {
    return !(window.matchMedia &&
             window.matchMedia("(max-width: 760px)").matches);
  }

  // REGLAGE : INFRAROUGE AU SURVOL
  const INFRAROUGE_EFFET = false;

  // REGLAGE : INFRAROUGE
  const INFRAROUGE = {
    rayon: 50,
    bord: 0
  };

  function activerInfrarouge(image, cadre, zone) {
    if (!INFRAROUGE_EFFET || !image || !cadre) return;
    if (cadre.querySelector(".filtre-ir")) return;
    const cibleMouvement = zone || cadre;
    if (getComputedStyle(cadre).position === "static") {
      cadre.style.position = "relative";
    }
    const imgIR = document.createElement("img");
    imgIR.alt = "";
    imgIR.className = "filtre-ir";
    imgIR.style.display = "none";
    cadre.appendChild(imgIR);
    const synchroniserSrc = function () {
      const s = image.getAttribute("src");
      if (s && imgIR.getAttribute("src") !== s) imgIR.src = s;
    };
    synchroniserSrc();
    image.addEventListener("load", synchroniserSrc);
    const aligner = function (cx, cy) {
      const r = image.getBoundingClientRect();
      const rc = cadre.getBoundingClientRect();
      imgIR.style.width = r.width + "px";
      imgIR.style.height = r.height + "px";
      imgIR.style.left = Math.round(r.left - rc.left) + "px";
      imgIR.style.top = Math.round(r.top - rc.top) + "px";
      const x = Math.round(cx - r.left);
      const y = Math.round(cy - r.top);
      imgIR.style.clipPath =
        "circle(" + INFRAROUGE.rayon + "px at " + x + "px " + y + "px)";
    };
    cibleMouvement.addEventListener("mousemove", function (e) {
      synchroniserSrc();
      aligner(e.clientX, e.clientY);
      imgIR.style.display = "block";

      imgIR.style.display = "none";

  function poserFondPli(el, cont) {
    const rg = cont._pliRegion;
    const W = cont.offsetWidth, H = cont.offsetHeight;
    el.style.backgroundImage = "url(" + JSON.stringify(cont._pliUrl) + ")";
    el.style.backgroundSize = (W / rg.w) + "px " + (H / rg.h) + "px";
    el.style.backgroundPosition = (-rg.x * W / rg.w) + "px " + (-rg.y * H / rg.h) + "px";
  }
  function poserMiroirPli(el, cont) {
    el.style.transform = "scaleX(" + (cont._pliMiroirX ? -1 : 1) + ") " +
                         "scaleY(" + (cont._pliMiroirY ? -1 : 1) + ")";
  }
  function plier(cadre, img) {
    let cont = cadre.querySelector(".pli-conteneur");
    if (!cont) {
      if (!img.getAttribute("src") || !img.offsetWidth) return;
      cont = document.createElement("div");
      cont.className = "pli-conteneur";
      const rc = cadre.getBoundingClientRect();
      const ri = img.getBoundingClientRect();
      cont.style.left = (ri.left - rc.left) + "px";
      cont.style.top = (ri.top - rc.top) + "px";
      cont.style.width = img.offsetWidth + "px";
      cont.style.height = img.offsetHeight + "px";
      cont._pliUrl = img.src;
      cont._pliRegion = { x: 0, y: 0, w: 1, h: 1 };
      cont._pliMiroirX = false;
      cont._pliMiroirY = false;
      cont._pliNiveau = 0;
      cont._pliOccupe = false;
      const face = document.createElement("div");
      face.className = "pli-face";
      cont.appendChild(face);
      poserFondPli(face, cont);
      cadre.appendChild(cont);
      img.style.visibility = "hidden";
    }
    if (cont._pliOccupe) return;
    const W = cont.offsetWidth, H = cont.offsetHeight;
    if (W < 24 || H < 24) return;
    cont._pliOccupe = true;
    cont._pliNiveau++;
    const horizontal = cont._pliNiveau % 2 === 1;
    const face = cont.querySelector(".pli-face");

    const volet = document.createElement("div");
    volet.className = "pli-flap";
    if (horizontal) {
      volet.style.left = "0";
      volet.style.top = "0";
      volet.style.width = W + "px";
      volet.style.height = (H / 2) + "px";
      volet.style.transformOrigin = "center bottom";
    } else {
      volet.style.left = "0";
      volet.style.top = "0";
      volet.style.width = (W / 2) + "px";
      volet.style.height = H + "px";
      volet.style.transformOrigin = "right center";
    }
    volet.style.transition = "transform .9s cubic-bezier(.3,.7,.2,1)";
    cont.appendChild(volet);
    poserFondPli(volet, cont);
    poserMiroirPli(volet, cont);
    void volet.offsetWidth;
    requestAnimationFrame(function () {
      if (horizontal) {
        volet.style.transform = volet.style.transform + " rotateX(-180deg)";
      } else {
        volet.style.transform = volet.style.transform + " rotateY(180deg)";
      }
    });
    let fini = false;
    const finir = function () {
      if (fini) return;
      fini = true;
      volet.remove();
      if (horizontal) {
        cont.style.top = (parseFloat(cont.style.top) + H / 2) + "px";
        cont.style.height = (H / 2) + "px";
        cont._pliRegion.h = cont._pliRegion.h / 2;
        cont._pliMiroirY = !cont._pliMiroirY;
      } else {
        cont.style.left = (parseFloat(cont.style.left) + W / 2) + "px";
        cont.style.width = (W / 2) + "px";
        cont._pliRegion.w = cont._pliRegion.w / 2;
        cont._pliMiroirX = !cont._pliMiroirX;
      }
      poserFondPli(face, cont);
      poserMiroirPli(face, cont);
      cont._pliOccupe = false;
    };
    volet.addEventListener("transitionend", finir, { once: true });
    setTimeout(finir, 1100);
  }

  function demarrerTramageCamera(cadre, img, num) {
    arreterTramageCamera();

    img.style.display = "none";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (num) num.textContent = "Camera indisponible.";
      return;

    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1600 } } })
      .then(function (flux) {
        fluxTramageCamera = flux;
        const video = document.createElement("video");
        video.className = "tramage-video";
        video.srcObject = flux;
        video.muted = true;
        video.playsInline = true;
        cadre.appendChild(video);
        video.play();

      .catch(function () {
        if (num) num.textContent = "Camera refusee.";

  function capturerTramageCamera(cadre, img) {
    const video = cadre.querySelector(".tramage-video");
    if (!video || !video.videoWidth) return false;
    const c = document.createElement("canvas");
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    c.getContext("2d").drawImage(video, 0, 0);
    img.src = c.toDataURL("image/jpeg", 0.92);
    img.style.display = "block";
    video.remove();
    arreterTramageCamera();
    return true;
  }

  function tramer(img, cadre, niveau) {
    if (!img || !img.complete || !img.naturalWidth) return null;
    const garder = Math.pow(2, niveau);
    if (img.naturalHeight < garder * 2) return null;
    const canvas = document.createElement("canvas");
    canvas.className = "tramage-canvas";
    canvas.width = img.naturalWidth;
    canvas.height = Math.ceil(img.naturalHeight / garder);
    const ctx = canvas.getContext("2d");
    let sortie = 0;
    for (let y = 0; y < img.naturalHeight; y += garder) {
      ctx.drawImage(img, 0, y, img.naturalWidth, 1,
                        0, sortie, img.naturalWidth, 1);
      sortie++;
    }
    canvas.style.width = img.offsetWidth + "px";
    canvas.style.height = img.offsetHeight + "px";
    cadre.appendChild(canvas);
    img.style.display = "none";
    return canvas;
  }

  function reinitialiserTramage(img, cadre) {
    if (!cadre) return;
    cadre.querySelectorAll(".tramage-canvas").forEach(function (c) { c.remove(); });
    if (img) img.style.display = "";
  }

  // REGLAGE : MOSAIQUE D EMOJIS
  const EMOJI_SERIES = ["test"];
  const EMOJI_EFFET = true;

  const EMOJI_TAILLE_DESKTOP = 8;
  const EMOJI_TAILLE_MOBILE = 6;
  const EMOJI_MEDIA_MOBILE = "(max-width: 760px)";
  function tailleEmoji() {
    return window.matchMedia(EMOJI_MEDIA_MOBILE).matches
      ? EMOJI_TAILLE_MOBILE : EMOJI_TAILLE_DESKTOP;
  }

  const EMOJI_FONDU_MS = 0;
  // REGLAGE : RETOURNEMENT DES EMOJIS ENTRE DEUX PHOTOS
  const EMOJI_RETOURNEMENT = true;
  const EMOJI_RETOURNEMENT_MS = 4500;
  const EMOJI_RETOURNEMENT_JETON_MS = 800;
  const EMOJI_RETOURNEMENT_SENS = "horizontal";
  const EMOJI_RETOURNEMENT_DEPART = 1.3;
  const EMOJI_RETOURNEMENT_HASARD_MS = 900;
  const EMOJI_RETOURNEMENT_SAUT = 0.35;
  const EMOJI_RETOURNEMENT_OMBRE = 0.5;
  const EMOJI_ECHELLE = 0.9;
  const EMOJI_CONTRASTE = true;
  const EMOJI_SATURATION = 1.25;
  const EMOJI_FOND = "#111111";
  const EMOJI_PALETTE = [
    "🖤", "⬛", "⚫", "🌑",
    "🟫", "🤎", "🟤", "🧸",
    "🍑",
    "🔴", "🟥", "❤️",
    "🟠", "🟧", "🧡",
    "🟡", "🟨", "💛",
    "🟢", "🟩", "💚", "🌿",
    "🔵", "🟦", "💙", "🩵",
    "🟣", "🟪", "💜",
    "🩷",
    "🩶", "⬜", "🧊",
    "🤍", "⚪"
  ];

  function rgbVersLab(r, g, b) {
    function lin(v) {
      v /= 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
    const R = lin(r), G = lin(g), B = lin(b);
    const x = f((0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047);
    const y = f(0.2126 * R + 0.7152 * G + 0.0722 * B);
    const z = f((0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }

  let emojiAtlas = null;
  function construireAtlasEmojis(cellPx) {
    if (emojiAtlas && emojiAtlas.cellPx === cellPx) return emojiAtlas;
    const n = EMOJI_PALETTE.length;
    const a = document.createElement("canvas");
    a.width = n * cellPx;
    a.height = cellPx;
    const actx = a.getContext("2d", { willReadFrequently: true });
    actx.fillStyle = EMOJI_FOND;
    actx.fillRect(0, 0, a.width, a.height);
    actx.font = Math.round(cellPx * EMOJI_ECHELLE) +
      "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    actx.textAlign = "center";
    actx.textBaseline = "middle";
    for (let k = 0; k < n; k++) {
      actx.fillText(EMOJI_PALETTE[k], k * cellPx + cellPx / 2, cellPx / 2 + cellPx * 0.05);
    }
    const d = actx.getImageData(0, 0, a.width, a.height).data;
    const lab = new Float32Array(n * 3);
    const nb = cellPx * cellPx;
    let lmin = Infinity, lmax = -Infinity;
    for (let k = 0; k < n; k++) {
      let sr = 0, sg = 0, sb = 0;
      for (let y = 0; y < cellPx; y++) {
        for (let x = k * cellPx; x < (k + 1) * cellPx; x++) {
          const q = (y * a.width + x) * 4;
          sr += d[q]; sg += d[q + 1]; sb += d[q + 2];
        }
      }
      const c = rgbVersLab(sr / nb, sg / nb, sb / nb);
      lab[k * 3] = c[0]; lab[k * 3 + 1] = c[1]; lab[k * 3 + 2] = c[2];
      if (c[0] < lmin) lmin = c[0];
      if (c[0] > lmax) lmax = c[0];
    }
    emojiAtlas = { canvas: a, cellPx: cellPx, n: n, lab: lab, lmin: lmin, lmax: lmax };
    return emojiAtlas;
  }

  function construireCanvasEmojis(source, nw, nh, aw, ah) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const taille = tailleEmoji();
    const cellPx = Math.max(4, Math.round(taille * dpr));
    const cols = Math.max(1, Math.round(aw / taille));
    const rgs = Math.max(1, Math.round(ah / taille));

    let src = source, w = nw, h = nh;
    while (w > cols * 2 || h > rgs * 2) {
      const pw = Math.max(cols, Math.ceil(w / 2));
      const ph = Math.max(rgs, Math.ceil(h / 2));
      const tmp = document.createElement("canvas");
      tmp.width = pw; tmp.height = ph;
      const tctx = tmp.getContext("2d");
      tctx.imageSmoothingQuality = "high";
      tctx.drawImage(src, 0, 0, pw, ph);
      src = tmp; w = pw; h = ph;
    }
    const petit = document.createElement("canvas");
    petit.width = cols;
    petit.height = rgs;
    const pctx = petit.getContext("2d", { willReadFrequently: true });
    pctx.imageSmoothingQuality = "high";
    pctx.drawImage(src, 0, 0, cols, rgs);

    let d;
    try {
      d = pctx.getImageData(0, 0, cols, rgs).data;
    } catch (e) { return null; }

    const atlas = construireAtlasEmojis(cellPx);
    const nbCases = cols * rgs;
    const L = new Float32Array(nbCases);
    const A = new Float32Array(nbCases);
    const B = new Float32Array(nbCases);
    for (let p = 0; p < nbCases; p++) {
      const q = p * 4;
      const c = rgbVersLab(d[q], d[q + 1], d[q + 2]);
      L[p] = c[0];
      A[p] = c[1] * EMOJI_SATURATION;
      B[p] = c[2] * EMOJI_SATURATION;
    }
    if (EMOJI_CONTRASTE) {
      const tri = Float32Array.from(L).sort();
      const lo = tri[Math.floor(nbCases * 0.01)];
      const hi = tri[Math.min(nbCases - 1, Math.floor(nbCases * 0.99))];
      if (hi - lo > 8) {
        const etendue = atlas.lmax - atlas.lmin;
        for (let p = 0; p < nbCases; p++) {
          const t = Math.max(0, Math.min(1, (L[p] - lo) / (hi - lo)));
          L[p] = atlas.lmin + t * etendue;
        }
      }
    }

    const c = document.createElement("canvas");
    c.width = cols * cellPx;
    c.height = rgs * cellPx;
    const ctx = c.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = false;
    const lab = atlas.lab, n = atlas.n;
    const idx = new Uint16Array(nbCases);
    for (let y = 0; y < rgs; y++) {
      for (let x = 0; x < cols; x++) {
        const p = y * cols + x;
        let meilleur = 0, ecart = Infinity;
        for (let k = 0; k < n; k++) {
          const dl = L[p] - lab[k * 3];
          const da = A[p] - lab[k * 3 + 1];
          const db = B[p] - lab[k * 3 + 2];
          const e = dl * dl + da * da + db * db;
          if (e < ecart) { ecart = e; meilleur = k; }
        }
        idx[p] = meilleur;
        ctx.drawImage(atlas.canvas,
          meilleur * cellPx, 0, cellPx, cellPx,
          x * cellPx, y * cellPx, cellPx, cellPx);
      }
    }
    c.className = "melange-canvas";
    c.dataset.taille = String(taille);
    c._mosaique = { cols: cols, rgs: rgs, cellPx: cellPx, idx: idx, atlas: atlas.canvas };
    return c;
  }

  function lancerRetournement(c, vieux, sens, apresFin) {
    const m = c._mosaique;
    const cols = m.cols, rgs = m.rgs, cp = m.cellPx;
    const nbCases = cols * rgs;
    const nouveau = m.idx;
    const ancien = vieux ? vieux.idx : new Int16Array(nbCases).fill(-1);
    const jeton = Math.min(EMOJI_RETOURNEMENT_JETON_MS, EMOJI_RETOURNEMENT_MS);
    let w = null, gl = null, raf = 0;

    function nettoyer() {
      cancelAnimationFrame(raf);
      if (gl) {
        const perte = gl.getExtension("WEBGL_lose_context");
        if (perte) perte.loseContext();
      }
      if (w) w.remove();
      c._finir = null;
    }

    try {
      w = document.createElement("canvas");
      w.width = cols * cp;
      w.height = rgs * cp;
      w.className = "melange-retournement";
      w.style.position = "absolute";
      w.style.left = c.style.left;
      w.style.top = c.style.top;
      w.style.width = c.style.width;
      w.style.height = c.style.height;
      w.style.pointerEvents = "none";
      gl = w.getContext("webgl", { alpha: false, antialias: false });
      const ext = gl && gl.getExtension("ANGLE_instanced_arrays");
      if (!gl || !ext) throw new Error("WebGL indisponible");

      const compiler = function (type, source) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, source);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        return sh;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compiler(gl.VERTEX_SHADER,
        "attribute vec2 aCoin;\n" +
        "attribute vec4 aCell;\n" +
        "attribute vec2 aTime;\n" +
        "uniform float uT;\n" +
        "uniform vec2 uGrille;\n" +
        "uniform float uN;\n" +
        "uniform float uSaut;\n" +
        "uniform float uOmbre;\n" +
        "varying vec2 vUv;\n" +
        "varying float vOmbre;\n" +
        "varying float vVide;\n" +
        "void main() {\n" +
        "  float prog = clamp((uT - aTime.x) / aTime.y, 0.0, 1.0);\n" +
        "  float larg = abs(cos(prog * 3.14159265));\n" +
        "  float haut = 1.0 + uSaut * sin(prog * 3.14159265);\n" +
        "  float idx = prog < 0.5 ? aCell.z : aCell.w;\n" +
        "  float px = aCell.x + 0.5 + (aCoin.x - 0.5) * larg;\n" +
        "  float py = aCell.y + 0.5 + (aCoin.y - 0.5) * haut;\n" +
        "  gl_Position = vec4(px / uGrille.x * 2.0 - 1.0, 1.0 - py / uGrille.y * 2.0, 0.0, 1.0);\n" +
        "  vUv = vec2((idx + 0.01 + aCoin.x * 0.98) / uN, 0.01 + aCoin.y * 0.98);\n" +
        "  vOmbre = 1.0 - uOmbre * (1.0 - larg);\n" +
        "  vVide = idx < -0.5 ? 1.0 : 0.0;\n" +
        "}\n"));
      gl.attachShader(prog, compiler(gl.FRAGMENT_SHADER,
        "#ifdef GL_FRAGMENT_PRECISION_HIGH\n" +
        "precision highp float;\n" +
        "#else\n" +
        "precision mediump float;\n" +
        "#endif\n" +
        "varying vec2 vUv;\n" +
        "varying float vOmbre;\n" +
        "varying float vVide;\n" +
        "uniform sampler2D uTex;\n" +
        "uniform vec3 uFond;\n" +
        "void main() {\n" +
        "  vec3 col = vVide > 0.5 ? uFond : texture2D(uTex, vUv).rgb;\n" +
        "  gl_FragColor = vec4(col * (vVide > 0.5 ? 1.0 : vOmbre), 1.0);\n" +
        "}\n"));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, m.atlas);
      gl.uniform1i(gl.getUniformLocation(prog, "uTex"), 0);
      gl.uniform1f(gl.getUniformLocation(prog, "uSaut"), EMOJI_RETOURNEMENT_SAUT);
      gl.uniform1f(gl.getUniformLocation(prog, "uOmbre"), EMOJI_RETOURNEMENT_OMBRE);
      gl.uniform2f(gl.getUniformLocation(prog, "uGrille"), cols, rgs);
      gl.uniform1f(gl.getUniformLocation(prog, "uN"), m.atlas.width / cp);
      const uT = gl.getUniformLocation(prog, "uT");

      const coin = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, coin);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
      const aCoin = gl.getAttribLocation(prog, "aCoin");
      gl.enableVertexAttribArray(aCoin);
      gl.vertexAttribPointer(aCoin, 2, gl.FLOAT, false, 0, 0);

      const balayage = Math.max(0, EMOJI_RETOURNEMENT_MS - EMOJI_RETOURNEMENT_HASARD_MS - jeton * 1.3);
      const alea = function (n) {
        const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return v - Math.floor(v);
      };
      const donnees = new Float32Array(nbCases * 6);
      for (let p = 0; p < nbCases; p++) {
        const x = p % cols, y = Math.floor(p / cols), o = p * 6;
        let avance = EMOJI_RETOURNEMENT_SENS === "diagonale"
          ? (x + y) / Math.max(1, cols + rgs - 2)
          : x / Math.max(1, cols - 1);
        if (sens < 0) avance = 1 - avance;
        avance = 1 - Math.pow(1 - avance, EMOJI_RETOURNEMENT_DEPART);
        donnees[o] = x;
        donnees[o + 1] = y;
        donnees[o + 2] = ancien[p];
        donnees[o + 3] = nouveau[p];
        donnees[o + 4] = ancien[p] === nouveau[p] ? 1e9 : avance * balayage + alea(p) * EMOJI_RETOURNEMENT_HASARD_MS;
        donnees[o + 5] = jeton * (0.7 + 0.6 * alea(p + 7919));
      }
      const instances = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, instances);
      gl.bufferData(gl.ARRAY_BUFFER, donnees, gl.STATIC_DRAW);
      const aCell = gl.getAttribLocation(prog, "aCell");
      gl.enableVertexAttribArray(aCell);
      gl.vertexAttribPointer(aCell, 4, gl.FLOAT, false, 24, 0);
      ext.vertexAttribDivisorANGLE(aCell, 1);
      const aTime = gl.getAttribLocation(prog, "aTime");
      gl.enableVertexAttribArray(aTime);
      gl.vertexAttribPointer(aTime, 2, gl.FLOAT, false, 24, 16);
      ext.vertexAttribDivisorANGLE(aTime, 1);

      const teinte = vieux
        ? EMOJI_FOND

      const fond = /^#([0-9a-f]{6})$/i.exec(teinte);

      gl.viewport(0, 0, w.width, w.height);

      let temps = 0, dernier = 0;

    function preparerEmojis(cible) {

      if (cacheEmoji.has(cle)) return Promise.resolve(cacheEmoji.get(cle));
      const tache = fileEmoji.then(function () {
        return new Promise(function (resolve) {
          const pre = new Image();
          let fini = false;
          const terminer = function (v) { if (!fini) { fini = true; resolve(v); } };
          pre.onerror = function () { terminer(null); };
          pre.onload = function () {
            (pre.decode ? pre.decode() : Promise.resolve()).catch(function () {}).then(function () {
              const mesurer = function () {
                sondeEmoji.onload = null;

                const aw = sondeEmoji.offsetWidth, ah = sondeEmoji.offsetHeight;
                if (!aw || !ah) { terminer({ vide: true }); return; }
                const c = construireCanvasEmojis(pre, pre.naturalWidth, pre.naturalHeight, aw, ah);
                if (!c) { terminer(null); return; }
                const e = { canvas: c, aw: aw, ah: ah };

                terminer(e);

              sondeEmoji.onload = mesurer;
              sondeEmoji.onerror = function () { terminer(null); };
              if (sondeEmoji.getAttribute("src") === cible) {

    function retirerCanvasEmojis(liste) {

    document.fonts.load(BULLE_CHIEN_STYLE.taille + "px " + BULLE_CHIEN_STYLE.famille)
      .catch(function () {});
  }
  // REGLAGE : BULLE DU CHIEN
  const BULLE_CHIEN_MARGES = {
    interne: 14,
    autour: 32
  };
  // REGLAGE : BULLE DU CHIEN
  const BULLE_CHIEN_TEMPS = {
    frappe: 55,
    entreBulles: 1400
  };
  const BULLE_CHIEN_DEFAUT = [
    "Hello !",
    "Bienvenue sur mon site, n'h\u00e9sitez pas \u00e0 me r\u00e9veiller si vous voulez plus d'infos.",
    "Je retourne me coucher, \u00e0 toute !"
  ];

  let chienBulleGen = 0;
  let chienBulleActive = false;
  let chienBulleEl = null;
  let chienBulleSpan = null;
  let chienBulleTexte = "";
  let chienBulleFrappe = null;
  let chienBulleFinFrappe = null;
  let chienBulleTimeout = null;
  let chienBulleSuite = null;

  function chienBulleNettoyer() {
    chienBulleGen++;
    if (chienBulleFrappe) { clearInterval(chienBulleFrappe); chienBulleFrappe = null; }
    if (chienBulleTimeout) { clearTimeout(chienBulleTimeout); chienBulleTimeout = null; }
    if (chienBulleEl) { chienBulleEl.remove(); chienBulleEl = null; }
    chienBulleSpan = null;
    chienBulleActive = false;
    chienBulleFinFrappe = null;
    chienBulleSuite = null;
  }

  function chienBulleVider() {
    if (chienBulleFrappe) { clearInterval(chienBulleFrappe); chienBulleFrappe = null; }
    if (chienBulleTimeout) { clearTimeout(chienBulleTimeout); chienBulleTimeout = null; }
    if (chienBulleEl) { chienBulleEl.remove(); chienBulleEl = null; }
    chienBulleSpan = null;
    chienBulleFinFrappe = null;
    chienBulleSuite = null;
  }

  function chienBulleMontrerFleche() {
    if (!chienBulleEl || chienBulleEl.querySelector(".bulle-fleche")) return;
    const f = document.createElement("div");
    f.className = "bulle-fleche";
    f.style.setProperty("--fleche-periode", BULLE_CHIEN_FLECHE.periode + "ms");
    f.style.setProperty("--fleche-taille", BULLE_CHIEN_FLECHE.taille + "px");
    f.style.bottom = BULLE_CHIEN_FLECHE.bas + "px";
    chienBulleEl.appendChild(f);
  }

  function chienBulleAvancer() {
    if (!chienBulleActive || !chienBulleEl) return;
    if (chienBulleFrappe) {
      clearInterval(chienBulleFrappe);
      chienBulleFrappe = null;
      chienBulleSpan.textContent = chienBulleTexte;
      const fin = chienBulleFinFrappe;
      chienBulleFinFrappe = null;
      if (fin) fin();
      return;
    }
    const s = chienBulleSuite;
    chienBulleSuite = null;
    if (s) s();
  }

  function chienMontrerBulle(texte, finTexte, gen) {
    chienBulleTexte = texte;
    chienBulleEl = document.createElement("div");
    chienBulleEl.className = "bulle-chien";
    chienBulleEl.addEventListener("click", chienBulleAvancer);
    chienBulleSpan = document.createElement("span");
    chienBulleEl.style.padding = BULLE_CHIEN_MARGES.interne + "px";
    const largeurColonne = parseFloat(
      getComputedStyle(document.documentElement)
        .getPropertyValue("--largeur-menu")) || 270;
    chienBulleEl.style.maxWidth =
      (largeurColonne - 2 * BULLE_CHIEN_MARGES.autour) + "px";
    chienBulleSpan.style.fontSize = BULLE_CHIEN_STYLE.taille + "px";
    if (BULLE_CHIEN_STYLE.famille) chienBulleSpan.style.fontFamily = BULLE_CHIEN_STYLE.famille;
    chienBulleSpan.style.fontWeight = BULLE_CHIEN_STYLE.gras ? "bold" : "normal";
    chienBulleSpan.style.fontStyle = BULLE_CHIEN_STYLE.italique ? "italic" : "normal";
    chienBulleSpan.style.textDecoration = BULLE_CHIEN_STYLE.souligne ? "underline" : "none";
    chienBulleSpan.textContent = texte;
    chienBulleEl.style.visibility = "hidden";
    chienBulleEl.appendChild(chienBulleSpan);
    document.body.appendChild(chienBulleEl);
    chienBulleEl.style.width = Math.ceil(chienBulleEl.offsetWidth) + 2 + "px";
    chienBulleEl.style.height = Math.ceil(chienBulleEl.offsetHeight) + "px";
    chienBulleSpan.textContent = "";
    chienBulleEl.style.visibility = "visible";
    chienParler();
    let n = 0;
    chienBulleFinFrappe = finTexte;
    chienBulleFrappe = setInterval(function () {
      if (gen !== chienBulleGen) return;
      n++;
      chienBulleSpan.textContent = texte.slice(0, n);
      if (n >= texte.length) {
        clearInterval(chienBulleFrappe);
        chienBulleFrappe = null;
        const fin = chienBulleFinFrappe;
        chienBulleFinFrappe = null;
        if (fin) fin();
      }
    }, BULLE_CHIEN_TEMPS.frappe);
  }

  function chienBulles(textes) {
    chienBulleNettoyer();
    chienStopMinuteurs();
    const gen = chienBulleGen;
    chienBulleActive = true;
    let i = 0;
    const suivante = function () {
      if (gen !== chienBulleGen) return;
      chienBulleVider();
      if (i >= textes.length) {
        chienBulleActive = false;
        chienSEndormir();
        return;
      }
      chienMontrerBulle(textes[i], function () {
        chienDortGen++;
        chienStopMinuteurs();
        chienAfficherSprite(ANIMATION_CHIEN.eveilleSprite);
        chienBulleSuite = function () {
          if (i + 1 >= textes.length) {
            chienBulleActive = false;
            chienBulleVider();
            chienSEndormir();
          } else {
            i++;
            suivante();
          }
        };
        chienBulleMontrerFleche();
      }, gen);
    };
    suivante();
  }

  function chienDemarrerBulles() {
    const dossierCourant = decodeURIComponent(location.hash.slice(1));
    const surAccueil =
      location.hash === "" || location.hash === "#" ||
      (dossierCourant !== "contact" && !trouver(dossierCourant));
    let fichier = null;
    if (surAccueil) fichier = "textes/chien-accueil.txt";
    else if (dossierCourant === "contact") fichier = "textes/chien-contact.txt";
    else {
      const serie = trouver(dossierCourant);
      if (serie) fichier = "textes/chien-" + serie.dossier + ".txt";
    }
    if (!fichier) return;
    if (typeof fetch !== "function") { chienBulles(BULLE_CHIEN_DEFAUT); return; }
    fetch(fichier).then(function (r) {
      if (!r.ok) throw new Error("fichier absent");
      return r.text();
    }).then(function (t) {
      const lignes = t.split(/\r?\n/).map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 0; });
      if (lignes.length) chienBulles(lignes);
      else console.warn("Chien : le fichier " + fichier + " est vide.");
    }).catch(function () {
      console.warn("Chien : fichier de texte introuvable ou illisible : " + fichier);
      if (surAccueil) chienBulles(BULLE_CHIEN_DEFAUT);
    });
  }

  function chienCyclope() {
    chienDortGen++;
    chienStopMinuteurs();
    chienDortEtat = "cyclope";
    chienJouerSequence(ANIMATION_CHIEN.cyclope, chienSuivre);
  }

  function chienRegarder() {
    if (!chienPlancheEl) return;
    const rect = chienPlancheEl.getBoundingClientRect();
    const oeilX = rect.left + rect.width / 2 + ANIMATION_CHIEN.oeilDecalX;
    const oeilY = rect.top + rect.height / 2 + ANIMATION_CHIEN.oeilDecalY;
    const bossVivant = bossVivantEnVol();
    const cibleX = bossVivant ? bossX : chienPointeur.x;
    const cibleY = bossVivant ? bossY : chienPointeur.y;
    const dx = cibleX - oeilX;
    const dy = cibleY - oeilY;
    const angle = Math.atan2(dx, -dy) * 180 / Math.PI;
    const secteur = ((Math.round(angle / 45) % 8) + 8) % 8;
    chienAfficherSprite(ANIMATION_CHIEN.suiviPremier + secteur);
  }

  function chienSuivre() {
    chienDortEtat = "suivi";
    chienLaserNumero = 0;
    chienRegarder();
    if (bossVivantEnVol()) {
      chienMinuteurOeil = setInterval(chienRegarder, 100);
    }
    chienMinuteur = setTimeout(chienTirerLaser, ANIMATION_CHIEN.suiviMs);
  }

  function chienDetruirePointeur() {
    chienPointeurDetruit = true;
    document.documentElement.classList.add("chien-pointeur-detruit");
  }

  function chienRestaurerPointeur() {
    chienPointeurDetruit = false;
    document.documentElement.classList.remove("chien-pointeur-detruit");
  }

  function chienNettoyerPointeur() {
    if (chienNettoyageCanvas) return;
    const pixels = chienPixelsPointeur();
    if (!pixels.length) { chienRestaurerPointeur(); return; }
    const gen = chienDortGen;
    const duree = ANIMATION_CHIEN.retourNettoyageMs;
    let distMax = 1;
    for (let i = 0; i < pixels.length; i++) {
      const dx = pixels[i].x + 0.5;
      const dy = pixels[i].y + 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > distMax) distMax = dist;
    }
    const tNet = function (i, dist) {
      return Math.min(duree * 0.75,
        (dist / distMax) * duree * 0.55 *
        (0.85 + chienBruit(i, 1, 30) * 0.3));
    };
    const sales = [];
    for (let i = 0; i < pixels.length; i++) {
      if (chienBruit(i, 2, 31) >= ANIMATION_CHIEN.retourSale) continue;
      const p = pixels[i];
      const dx = p.x + 0.5;
      const dy = p.y + 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ang = chienBruit(i, 3, 32) * Math.PI * 2;
      sales.push({
        x: p.x, y: p.y,
        t0: tNet(i, dist),
        vx: Math.cos(ang) * (0.02 + chienBruit(i, 4, 33) * 0.05),
        vy: -Math.abs(Math.sin(ang)) * (0.02 + chienBruit(i, 5, 34) * 0.06)
      });
    }
    const canvas = document.createElement("canvas");
    canvas.className = "chien-laser";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    document.body.appendChild(canvas);
    chienNettoyageCanvas = canvas;
    const ctx = canvas.getContext("2d");
    let ecoule = 0;
    let dernierT = null;
    const tremble = ANIMATION_CHIEN.laserTremble;
    const dessiner = function (t) {
      if (gen !== chienDortGen) {
        canvas.remove();
        if (chienNettoyageCanvas === canvas) chienNettoyageCanvas = null;
        return;
      }
      if (dernierT === null) dernierT = t;
      ecoule += t - dernierT;
      dernierT = t;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const px = chienPointeur.x;
      const py = chienPointeur.y;
      for (let i = 0; i < pixels.length; i++) {
        const p = pixels[i];
        const dx = p.x + 0.5;
        const dy = p.y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const tn = tNet(i, dist);
        const secousse = ecoule < tn ? 1
          : Math.max(0, 1 - (ecoule - tn) / 180);
        const jx = Math.round((chienBruit(i, t, 12) - 0.5) *
                              2 * tremble * secousse);
        const jy = Math.round((chienBruit(i, t, 13) - 0.5) *
                              2 * tremble * secousse);
        ctx.fillStyle = ecoule < tn ? "#111111" : p.c;
        ctx.fillRect(px + p.x + jx, py + p.y + jy, 1, 1);
      }
      ctx.fillStyle = "#111111";
      for (let s = 0; s < sales.length; s++) {
        const e = sales[s];
        if (ecoule < e.t0) continue;
        const age = ecoule - e.t0;
        if (age > 700) continue;
        ctx.globalAlpha = Math.max(0, 1 - age / 700);
        ctx.fillRect(Math.round(px + e.x + e.vx * age +
                                Math.sin(age / 60 + s) * 1.5),
                     Math.round(py + e.y + e.vy * age), 2, 2);
      }
      ctx.globalAlpha = 1;
      if (ecoule < duree) {
        window.requestAnimationFrame(dessiner);
      } else {
        canvas.remove();
        if (chienNettoyageCanvas === canvas) chienNettoyageCanvas = null;
        chienRestaurerPointeur();
      }
    };
    window.requestAnimationFrame(dessiner);
  }

  function chienBruit(a, b, c) {
    const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
    return v - Math.floor(v);
  }

  function chienPixelAnneau(ctx, cx, cy, rayon, taille, couleur) {
    const r = Math.max(taille, Math.round(rayon / taille) * taille);
    const nb = Math.max(8, Math.round((Math.PI * 2 * r) / taille));
    ctx.fillStyle = couleur;
    for (let i = 0; i < nb; i++) {
      const a = (Math.PI * 2 * i) / nb;
      const px = Math.round((cx + Math.cos(a) * r) / taille) * taille;
      const py = Math.round((cy + Math.sin(a) * r) / taille) * taille;
      ctx.fillRect(px, py, taille, taille);
    }
  }

  function chienImagesBrulables() {
    const liste = [];
    const imgs = contenu.querySelectorAll("img");
    for (let i = 0; i < imgs.length; i++) {
      const img = imgs[i];
      if (img.classList.contains("photo-dessous")) continue;
      const r = img.getBoundingClientRect();
      if (r.width >= 20 && r.height >= 20) {
        liste.push({ el: img, rect: r, canvas: false });
      }
    }
    const cv = document.getElementById("canvas-accueil");
    if (cv) {
      const r = cv.getBoundingClientRect();
      if (r.width >= 20 && r.height >= 20) {
        liste.push({ el: cv, rect: r, canvas: true });
      }
    }
    return liste;
  }

  function chienCalqueBrulure(cible) {
    if (cible.canvas) return cible.el;
    if (cible.el._chienBrulure) {
      const vieux = cible.el._chienBrulure;
      vieux.style.left = cible.el.offsetLeft + "px";
      vieux.style.top = cible.el.offsetTop + "px";
      const r = cible.el.getBoundingClientRect();
      const l = Math.max(1, Math.round(r.width));
      const h = Math.max(1, Math.round(r.height));
      if (vieux.width !== l || vieux.height !== h) {
        vieux.width = l;
        vieux.height = h;
      }
      return vieux;
    }
    const parent = cible.el.parentNode;
    if (parent && getComputedStyle(parent).position === "static") {
      parent.style.position = "relative";
    }
    const r = cible.el.getBoundingClientRect();
    const cv = document.createElement("canvas");
    cv.className = "chien-brulure";
    cv.width = Math.max(1, Math.round(r.width));
    cv.height = Math.max(1, Math.round(r.height));
    cv.style.position = "absolute";
    cv.style.left = cible.el.offsetLeft + "px";
    cv.style.top = cible.el.offsetTop + "px";
    cv.style.pointerEvents = "none";
    cv.style.zIndex = "2";
    parent.appendChild(cv);
    cible.el._chienBrulure = cv;
    return cv;
  }

  function chienGraverTrou(cible, vx, vy, rayon, graine) {
    const calque = chienCalqueBrulure(cible);
    const g = calque.getContext("2d");
    const r = cible.el.getBoundingClientRect();
    const kx = calque.width / Math.max(1, r.width);
    const ky = calque.height / Math.max(1, r.height);
    const cx = Math.round((vx - r.left) * kx);
    const cy = Math.round((vy - r.top) * ky);
    const pas = Math.max(2, Math.round(3 * kx));
    const ray = Math.max(pas, Math.round((rayon * kx) / pas) * pas);
    g.globalCompositeOperation =
      cible.canvas ? "destination-out" : "source-over";
    g.fillStyle = cible.canvas ? "#111111" : "#ffffff";
    for (let py = cy - ray; py <= cy + ray; py += pas) {
      for (let px = cx - ray; px <= cx + ray; px += pas) {
        const dx = px - cx;
        const dy = py - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.round(Math.atan2(dy, dx) * 14);
        const ond = ray * (0.62 + chienBruit(graine, ang, 62) * 0.3 +
                           chienBruit(graine, px, py) * 0.3);
        if (d > ond - pas) continue;
        g.globalAlpha = 0.55 + chienBruit(graine, px + 3, py + 5) * 0.45;
        g.fillRect(px, py, pas, pas);
      }
    }
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    g.fillStyle = "#111111";
    const nb = Math.max(12, Math.round((Math.PI * 2 * ray) / pas));
    for (let i = 0; i < nb; i++) {
      const a = (Math.PI * 2 * i) / nb;
      const ang = Math.round(a * 14);
      const px = Math.round((cx + Math.cos(a) * ray) / pas) * pas;
      const py = Math.round((cy + Math.sin(a) * ray) / pas) * pas;
      const rr = ray * (0.62 + chienBruit(graine, ang, 62) * 0.3 +
                        chienBruit(graine, px + 7, py + 7) * 0.3);
      const bx2 = Math.round((cx + Math.cos(a) * rr) / pas) * pas;
      const by2 = Math.round((cy + Math.sin(a) * rr) / pas) * pas;
      if (chienBruit(graine, bx2 + 7, by2 + 7) < 0.4) continue;
      g.fillRect(bx2, by2, pas, pas);
    }
    g.globalAlpha = 1;
  }

  function chienPixelsPointeur() {
    let forme = "tapette";
    const sous = document.elementFromPoint(chienPointeur.x, chienPointeur.y);
    if (sous) {
      const cur = getComputedStyle(sous).cursor || "";
      if (cur.indexOf("grab") !== -1) forme = "main";
      else if (cur.indexOf("ff1744") !== -1) forme = "fleche-rouge";
      else if (cur.indexOf("00e676") !== -1) forme = "fleche-verte";
    }
    const c = document.createElement("canvas");
    c.width = 24;
    c.height = 24;
    const g = c.getContext("2d");
    let chaudX = 0;
    let chaudY = 0;
    if (forme === "tapette") {
      g.strokeStyle = "#ffffff";
      g.lineWidth = 1.5;
      g.fillStyle = "#2979ff";
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(0, 18);
      g.lineTo(4.5, 13.5);
      g.lineTo(8, 21);
      g.lineTo(11, 19.5);
      g.lineTo(7.5, 12);
      g.lineTo(13.5, 12);
      g.closePath();
      g.fill();
      g.stroke();
    } else if (forme === "main") {
      chaudX = 11;
      chaudY = 14;
      g.strokeStyle = "#000000";
      g.lineWidth = 1.5;
      g.fillStyle = "#ffffff";
      g.beginPath();
      g.rect(3, 7, 4, 12);
      g.rect(8, 4, 4, 15);
      g.rect(13, 5, 4, 14);
      g.rect(18, 8, 4, 11);
      g.fill();
      g.stroke();
      g.beginPath();
      g.moveTo(3, 14);
      g.lineTo(22, 14);
      g.lineTo(22, 20);
      g.quadraticCurveTo(12, 25, 3, 20);
      g.closePath();
      g.fill();
      g.stroke();
      g.beginPath();
      g.moveTo(4, 16);
      g.lineTo(0.5, 12);
      g.lineTo(2.5, 9.5);
      g.lineTo(6.5, 13.5);
      g.closePath();
      g.fill();
      g.stroke();
    } else {
      const rouge = forme === "fleche-rouge";
      chaudX = 12;
      chaudY = 12;
      g.scale(0.75, 0.75);
      const pts = rouge
        ? [[29, 12], [14, 12], [14, 5], [3, 16], [14, 27], [14, 20], [29, 20]]
        : [[3, 12], [18, 12], [18, 5], [29, 16], [18, 27], [18, 20], [3, 20]];
      g.beginPath();
      pts.forEach(function (pt, k) { if (k) g.lineTo(pt[0], pt[1]); else g.moveTo(pt[0], pt[1]); });
      g.closePath();
      g.lineWidth = 2.5;
      g.lineJoin = "round";
      g.strokeStyle = "#ffffff";
      g.stroke();
      g.fillStyle = rouge ? "#ff1744" : "#00e676";
      g.fill();
    }
    const d = g.getImageData(0, 0, c.width, c.height).data;
    const pixels = [];
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4;
        if (d[i + 3] > 0) {
          pixels.push({
            x: x - chaudX, y: y - chaudY,
            c: "rgb(" + d[i] + "," + d[i + 1] + "," + d[i + 2] + ")"
          });
        }
      }
    }
    return pixels;
  }

  function chienTirerLaser() {
    chienDortEtat = "laser";
    const gen = chienDortGen;
    const canvas = document.createElement("canvas");
    canvas.className = "chien-laser";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    document.body.appendChild(canvas);
    chienLaserCanvas = canvas;
    const ctx = canvas.getContext("2d");
    const rect = chienPlancheEl.getBoundingClientRect();
    const oeil = {
      x: rect.left + rect.width / 2 + ANIMATION_CHIEN.oeilDecalX,
      y: rect.top + rect.height / 2 + ANIMATION_CHIEN.oeilDecalY
    };
    const epaisseur = Math.max(1, Math.round(rect.width / 32));
    const bossVivant = bossVivantEnVol();
    const rate = chienLaserNumero < ANIMATION_CHIEN.laserRatres;
    const touche = !rate && !bossVivant;
    let cible;
    if (rate) {
      const ang = chienBruit(chienLaserNumero, 5, 20) * Math.PI * 2;
      const dst = 24 + chienBruit(chienLaserNumero, 6, 21) *
                        ANIMATION_CHIEN.laserRatEcart;
      cible = {
        ox: Math.cos(ang) * dst,
        oy: Math.sin(ang) * dst,
        suit: bossVivant
      };
    } else {
      cible = { ox: 0, oy: 0, suit: bossVivant };
    }
    if (!cible.suit) {
      cible.x = chienPointeur.x + cible.ox;
      cible.y = chienPointeur.y + cible.oy;
    }
    const fondu = ANIMATION_CHIEN.laserFonduMs;
    const eclats = [];
    if (touche) {
      const pixels = chienPixelsPointeur();
      let distMax = 1;
      for (let i = 0; i < pixels.length; i++) {
        const dx = pixels[i].x + 0.5;
        const dy = pixels[i].y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > distMax) distMax = dist;
      }
      for (let i = 0; i < pixels.length; i++) {
        const p = pixels[i];
        const dx = p.x + 0.5;
        const dy = p.y + 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        eclats.push({
          x: p.x, y: p.y, c0: p.c,
          t0: Math.min(fondu * 0.75,
                       (dist / distMax) * fondu * 0.75 *
                       (0.85 + chienBruit(i, 1, 6) * 0.3)),
          vx: 0, vy: 0, c: ""
        });
      }
      for (let i = 0; i < eclats.length; i++) {
        const e = eclats[i];
        e.goutte = chienBruit(i, 2, 7) < ANIMATION_CHIEN.laserGouttes;
        if (e.goutte) {
          e.vx = (chienBruit(i, 3, 8) - 0.5) * 0.015;
          e.vy = 0.03 + chienBruit(i, 4, 9) * 0.04;
          e.c = ANIMATION_CHIEN.poudre[i % ANIMATION_CHIEN.poudre.length];
        }
      }
    }
    const brulables = bossVivant ? [] : chienImagesBrulables();
    const montee = ANIMATION_CHIEN.laserMonteeMs;
    const extinction = bossVivant || rate ?
      ANIMATION_CHIEN.laserRatFonduMs : 0;
    const tenue = bossVivant ? ANIMATION_CHIEN.laserBossTenueMs
                             : rate ? ANIMATION_CHIEN.laserRatTenueMs
                                    : fondu;
    const total = montee + tenue + extinction;
    let ecoule = 0;
    let dernierT = null;
    let coupBossDonne = false;
    let impactBrule = false;
    const dessiner = function (t) {
      if (gen !== chienDortGen) return;
      if (dernierT === null) dernierT = t;
      ecoule += t - dernierT;
      dernierT = t;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (cible.suit) {
        cible.x = Math.max(8, Math.min(window.innerWidth - 8, bossX + cible.ox));
        cible.y = Math.max(8, Math.min(window.innerHeight - 8, bossY + cible.oy));
        chienRegarder();
      }
      const avance = Math.min(1, ecoule / montee);
      const dxT = cible.x - oeil.x;
      const dyT = cible.y - oeil.y;
      const lgT = Math.sqrt(dxT * dxT + dyT * dyT);
      const ux = lgT > 0 ? dxT / lgT : 0;
      const uy = lgT > 0 ? dyT / lgT : 0;
      if (ecoule < total) {
        const reste = total - ecoule;
        if (extinction > 0 && reste < extinction) {
          ctx.globalAlpha = Math.max(0, reste / extinction);
        }
        ctx.fillStyle = "#ff1744";
        const traitPx = ANIMATION_CHIEN.laserEpaisseur;
        const pasSeg = ANIMATION_CHIEN.laserPas;
        for (let s = 0; s < lgT * avance; s += pasSeg) {
          if (chienBruit(s, t, 10) < ANIMATION_CHIEN.laserTrou) continue;
          const zig = (Math.floor(chienBruit(s, t, 11) * 3) - 1) * traitPx;
          ctx.fillRect(Math.round(oeil.x + ux * s - uy * zig),
                       Math.round(oeil.y + uy * s + ux * zig),
                       traitPx, traitPx);
        }
        ctx.globalAlpha = 1;
        for (let i = 0; i < ANIMATION_CHIEN.ondes.length; i++) {
          const ondeT = ecoule - i * 120;
          if (ondeT <= 0 || ondeT > ANIMATION_CHIEN.ondeDureeMs) continue;
          ctx.globalAlpha =
            Math.max(0, 1 - ondeT / ANIMATION_CHIEN.ondeDureeMs);
          chienPixelAnneau(ctx, oeil.x, oeil.y,
                           ondeT * ANIMATION_CHIEN.ondeVitesse,
                           epaisseur, ANIMATION_CHIEN.ondes[i]);
        }
        ctx.globalAlpha = 1;
      }
      if (ecoule >= montee && ecoule < total) {
        if (!impactBrule && brulables.length) {
          impactBrule = true;
          for (let b = 0; b < brulables.length; b++) {
            const rb = brulables[b].el.getBoundingClientRect();
            if (cible.x >= rb.left && cible.x <= rb.right &&
                cible.y >= rb.top && cible.y <= rb.bottom) {
              chienGraverTrou(brulables[b], cible.x, cible.y,
                              ANIMATION_CHIEN.laserImpactRayon, 999);
            }
          }
        }
        if (!rate && bossVivant) {
          if (!coupBossDonne) {
            coupBossDonne = true;
            if (!bossChute && !bossAuSol) frapperBoss(PV_BOSS);
          }
        } else if (touche) {
          if (!chienPointeurDetruit) chienDetruirePointeur();
          const dans = ecoule - montee;
          const tremble = ANIMATION_CHIEN.laserTremble;
          for (let i = 0; i < eclats.length; i++) {
            const e = eclats[i];
            const jx = Math.round((chienBruit(i, t, 12) - 0.5) * 2 * tremble);
            const jy = Math.round((chienBruit(i, t, 13) - 0.5) * 2 * tremble);
            if (dans < e.t0) {
              ctx.fillStyle = e.c0;
              ctx.fillRect(cible.x + e.x + jx, cible.y + e.y + jy, 1, 1);
            } else if (e.goutte) {
              const age = dans - e.t0;
              ctx.globalAlpha = Math.max(0, 1 - age / (fondu - e.t0));
              ctx.fillStyle = e.c;
              ctx.fillRect(Math.round(cible.x + e.x + e.vx * age),
                           Math.round(cible.y + e.y + e.vy * age),
                           2, 2);
            } else {
              const age = dans - e.t0;
              ctx.globalAlpha = Math.max(0,
                1 - age / ANIMATION_CHIEN.laserFonduPlaceMs);
              ctx.fillStyle = e.c0;
              ctx.fillRect(cible.x + e.x + jx, cible.y + e.y + jy, 1, 1);
            }
          }
          ctx.globalAlpha = 1;
        }
      }
      if (ecoule < total) {
        window.requestAnimationFrame(dessiner);
      } else {
        canvas.remove();
        if (chienLaserCanvas === canvas) chienLaserCanvas = null;
        if (rate) {
          chienLaserNumero++;
          chienMinuteur = setTimeout(function () {
            if (gen !== chienDortGen) return;
            chienTirerLaser();
          }, ANIMATION_CHIEN.laserPauseMs);
        } else {
          chienSEndormir();
        }
      }
    };
    window.requestAnimationFrame(dessiner);
  }

  function chienCliquer() {
    const maintenant = Date.now();
    if (chienBulleActive) {
      chienTrembler();
      chienBulleAvancer();
      return;
    }
    if (maintenant - chienDernierClic > ANIMATION_CHIEN.suiteMs) chienClicsSuite = 0;
    chienDernierClic = maintenant;
    if (chienDortEtat === "dodo") {
      chienTrembler();
      chienClicsReveil++;
      if (chienClicsReveil >= ANIMATION_CHIEN.clicsReveil) {
        chienClicsReveil = 0;
        chienSeReveiller();
      }
      return;
    }
    if (chienDortEtat === "eveille" || chienDortEtat === "parle") {
      chienTrembler();
      chienClicsSuite++;
      if (chienClicsSuite >= ANIMATION_CHIEN.clicsCyclope) {
        chienClicsSuite = 0;
        chienCyclope();
        return;
      }
      if (chienDortEtat === "eveille") chienParler();
      else chienEveille();
      return;
    }
  }

  function creerChienDort() {
    chienDortEtat = "dodo";
    chienClicsReveil = 0;
    chienClicsSuite = 0;
    chienDortGen++;
    chienDernierSprite = -1;
    chienStopMinuteurs();

    chienPlancheEl.className = "chien-dort chien-planche";

    chienPlancheEl.style.backgroundImage =

      (ANIMATION_CHIEN.frames * 100) + "% 100%";
    chienPlancheEl.style.backgroundRepeat = "no-repeat";
    chienPlancheEl.addEventListener("click", chienCliquer);
    document.body.appendChild(chienPlancheEl);
    const verif = new Image();
    verif.onerror = function () {
      if (chienPlancheEl) { chienPlancheEl.remove(); chienPlancheEl = null; }
      chienDortGen++;
    };
    verif.src = ANIMATION_CHIEN.planche;
    chienDodo();
  }

  function arreterChienDort() {
    chienDortGen++;
    chienStopMinuteurs();
    chienBulleNettoyer();
    chienDortEtat = "dodo";
    chienClicsReveil = 0;
    chienClicsSuite = 0;
    if (chienLaserCanvas) { chienLaserCanvas.remove(); chienLaserCanvas = null; }
    if (chienNettoyageCanvas) { chienNettoyageCanvas.remove(); chienNettoyageCanvas = null; }

    chienPlancheEl = null;
  }

      btnGauche.setAttribute("aria-label", "Duo précédent");

      const btnDroite = document.createElement("button");
      btnDroite.type = "button";
      btnDroite.className = "zone-clic droite";
      btnDroite.setAttribute("aria-label", "Duo suivant");

      conteneur.append(btnGauche, btnDroite);

      btnGauche.addEventListener("click", function () {
        if (surIndexCarnaval) { basculerIndexCarnaval(false); return; }
        if (indexDuo === 0 && planchePermise()) { basculerIndexCarnaval(true); return; }
        avancerCarnaval(-1);
      });
      btnDroite.addEventListener("click", function () { avancerCarnaval(1); });
    }

    fig.appendChild(conteneur);

    const compteur = document.createElement("div");
    compteur.className = "compteur";
    const prec = document.createElement("button");
    prec.type = "button";
    prec.id = "prec";
    prec.innerHTML = "&#8249;";
    prec.setAttribute("aria-label", "Duo précédent");
    const num = document.createElement("span");
    const suiv = document.createElement("button");
    suiv.type = "button";
    suiv.id = "suiv";
    suiv.innerHTML = "&#8250;";
    suiv.setAttribute("aria-label", "Duo suivant");
    compteur.append(prec, num, suiv);

    if (nbDuos > 1) fig.appendChild(compteur);

    let indexDuo = 0;

    function majZoneGaucheCarnaval() {
      const z = conteneur.querySelector(".zone-clic.gauche");
      if (!z) return;
      const versIndex = indexDuo === 0 && planchePermise();
      z.classList.toggle("vers-index", versIndex);
      z.setAttribute("aria-label", versIndex ? "Index des images" : "Duo précédent");
      reevaluerCurseurIndexPlusTard();
    }

    function montrerDuo(n) {
      indexDuo = (n + nbDuos) % nbDuos;
      num.textContent = numeroCompteur(indexDuo + 1, nbDuos);
      figerLargeurCompteur(num, nbDuos);
      majZoneGaucheCarnaval();

      const i1 = indexDuo * 2;
      const i2 = i1 + 1;

      const src1 = chemin(i1);
      const src2 = i2 < total ? chemin(i2) : null;

      remplacerFondu(cadre1, img1, src1, SITE.nom + ", " + serie.titre + " (Image " + (i1 + 1) + ")");
      remplacerFondu(cadre2, img2, src2, SITE.nom + ", " + serie.titre + " (Image " + (i2 + 1) + ")");
      majMiniaturesCarnaval();
    }

    const miniaturesCarnaval = [];
    function majMiniaturesCarnaval() {
      miniaturesCarnaval.forEach(function (b, k) {
        b.setAttribute("aria-current",
          Math.floor(k / 2) === indexDuo ? "true" : "false");
      });
    }
    const plancheCarnaval = document.createElement("div");
    plancheCarnaval.className = "index-miniatures";
    const rCarnaval = reglagesPlanche(serie.dossier);
    plancheCarnaval.style.gap = rCarnaval.marge + "px";
    appliquerEffetPlanche(plancheCarnaval, serie.dossier);
    for (let k = 0; k < total; k++) {
      (function (k) {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Image " + (k + 1));
        b.style.height = rCarnaval.hauteur + "px";
        const vignette = document.createElement("img");
        vignette.decoding = "async";
        vignette.src = chemin(k);
        vignette.alt = "";
        b.appendChild(vignette);
        b.addEventListener("click", function () {
          plancheCarnaval.style.display = "none";
          duo.style.display = "";
          surIndexCarnaval = false;
          montrerDuo(Math.floor(k / 2));
          window.scrollTo(0, 0);
        });
        miniaturesCarnaval.push(b);
        plancheCarnaval.appendChild(b);
      })(k);
    }
    fig.appendChild(plancheCarnaval);
    plancheCarnaval.style.display = "none";
    let surIndexCarnaval = false;
    function basculerIndexCarnaval(ouvrir) {
      surIndexCarnaval = ouvrir;
      if (ouvrir) {
        const r = reglagesPlanche(serie.dossier);
        plancheCarnaval.style.gap = r.marge + "px";
        appliquerEffetPlanche(plancheCarnaval, serie.dossier);
        miniaturesCarnaval.forEach(function (b) {
          b.style.height = r.hauteur + "px";
        });
      }
      plancheCarnaval.style.display = ouvrir ? "flex" : "none";
      document.body.classList.toggle("planche-ouverte", ouvrir);
      duo.style.display = ouvrir ? "none" : "";
      num.textContent = ouvrir ? "index" : numeroCompteur(indexDuo + 1, nbDuos);
      majMiniaturesCarnaval();
      reevaluerCurseurIndexPlusTard();
    }

    function avancerCarnaval(sens) {
      if (sens > 0 && indexDuo === nbDuos - 1 && nbDuos > 1 && planchePermise()) {
        basculerIndexCarnaval(true);
        return;
      }
      if (sens < 0 && surIndexCarnaval) {
        basculerIndexCarnaval(false);
        return;
      }
      montrerDuo(indexDuo + sens);
    }

    suiv.addEventListener("click", function () { avancerCarnaval(1); });
    prec.addEventListener("click", function () { avancerCarnaval(-1); });

    contenu.appendChild(fig);
    montrerDuo(0);
  }

    }

    const chemin = function (nomFichier) {
      return "images/" + serie.dossier + "/" + encodeURIComponent(nomFichier).replace(/%23/g, '#');
    };

    const fig = document.createElement("figure");
    fig.className = "serie";

    conteneur.className = "zone-interactive-conteneur plein-largeur";

    const duo = document.createElement("div");
    duo.className = "pao-duo";

    const cadre1 = document.createElement("div");
    cadre1.className = "pao-cadre";

    img1.decoding = "async";
    cadre1.appendChild(img1);

    const cadre2 = document.createElement("div");

    img2.decoding = "async";
    cadre2.appendChild(img2);

    btnGauche.type = "button";
