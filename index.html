  function dessinerFrameChien(nom) {
    if (!chienCtx || nom === chienDerniereFrame) return;
    chienDerniereFrame = nom;
    const grille = CHIEN_PIXELS[nom];
    chienCtx.clearRect(0, 0, CHIEN_LARG * CHIEN_ECHELLE, CHIEN_HAUT * CHIEN_ECHELLE);
    for (let y = 0; y < grille.length; y++) {
      const ligne = grille[y];
      for (let x = 0; x < ligne.length; x++) {
        const couleur = CHIEN_COULEURS[ligne.charAt(x)];
        if (couleur) {
          chienCtx.fillStyle = couleur;
          chienCtx.fillRect(x * CHIEN_ECHELLE, y * CHIEN_ECHELLE, CHIEN_ECHELLE, CHIEN_ECHELLE);
        }
      }
    }
  }

  function majChien() {
    if (!chienMarionnetteEl) return;
    chienMarionnetteEl.style.left = chienX + "px";
    chienMarionnetteEl.style.bottom = (8 + chienYOffset) + "px";
    // Le chien regarde vers la droite par défaut :
    // miroir UNIQUEMENT quand il part vers la gauche
    chienCorpsEl.classList.toggle("gauche", chienDirection < 0);
  }

  function afficherBulleChien(texte) {
    if (!chienMarionnetteEl) return;
    const bulle = document.createElement("div");
    bulle.className = "bulle-chien";
    bulle.textContent = texte;
    bulle.style.left = (chienDirection > 0 ? 55 : 5) + "px";
    bulle.style.bottom = "64px";
    chienMarionnetteEl.appendChild(bulle);
    setTimeout(function () { bulle.remove(); }, 900);
  }

  function creerZzzChien() {
    if (!chienMarionnetteEl) return;
    const z = document.createElement("div");
    z.className = "zzz-chien";
    z.textContent = "z";
    z.style.left = (60 + Math.floor(Math.random() * 20)) + "px";
    z.style.bottom = (45 + Math.floor(Math.random() * 15)) + "px";
    chienMarionnetteEl.appendChild(z);
    setTimeout(function () { z.remove(); }, 1700);
  }

  function positionPageChien() {
    // Position du museau dans la page, pour faire voler la terre
    if (!chienMarionnetteEl) return null;
    const r = chienMarionnetteEl.getBoundingClientRect();
    return {
      x: r.left + (chienDirection < 0 ? r.width * 0.1 : r.width * 0.9),
      y: r.top + r.height * 0.55
    };
  }

  function chienReposAleatoire() {
    chienEtat = "idle";
    chienDelai = 180 + Math.floor(Math.random() * 240); // 3 à 7 s sans rien faire
  }

  function choisirActionChien() {
    const r = Math.random();
    if (r < 0.34) {
      // Aller-retour : il trotte vers un autre point du territoire
      chienCible = 10 + Math.random() * (CHIEN_ZONE - 140);
      if (Math.abs(chienCible - chienX) < 50) {
        chienCible = (chienX > CHIEN_ZONE / 2) ? 10 : CHIEN_ZONE - 130;
      }
      chienDirection = (chienCible > chienX) ? 1 : -1;
      chienEtat = "marche";
    } else if (r < 0.49) {
      chienEtat = "flaire";
      chienSousTimer = 110;
      afficherBulleChien("snif snif");
    } else if (r < 0.62) {
      chienEtat = "creuse";
      chienSousTimer = 150;
      afficherBulleChien("creuse...");
    } else if (r < 0.74) {
      chienEtat = "saute";
      chienSousTimer = 40;
      afficherBulleChien("hop !");
    } else if (r < 0.85) {
      chienEtat = "aboie";
      chienSousTimer = 55;
      afficherBulleChien("wouf !");
    } else if (r < 0.94) {
      chienEtat = "gratte";
      chienSousTimer = 120;
      afficherBulleChien("grat grat");
    } else {
      // Il se couche, puis s'endort une fois sur deux
      chienEtat = "couche";
      chienSousTimer = 110;
    }
  }

  function boucleChien() {
    chienId = requestAnimationFrame(boucleChien);
    if (!chienEl) return;
    chienCompteur++;

    if (chienEtat === "idle") {
      chienDelai--;
      // À l'arrêt, il remue doucement la queue : on comprend que ça vit
      dessinerFrameChien(chienCompteur % 30 < 15 ? "debout" : "debout2");
      if (chienDelai <= 0) choisirActionChien();

    } else if (chienEtat === "marche") {
      // Trot : alternance de deux allures + petit rebond de marche
      if (chienCompteur % 16 < 8) dessinerFrameChien("marcheA");
      else dessinerFrameChien("marcheB");
      chienYOffset = Math.sin(chienCompteur * 0.25) * 1.5;
      const pas = 1.7;
      if (chienCible > chienX) chienX = Math.min(chienCible, chienX + pas);
      else chienX = Math.max(chienCible, chienX - pas);
      if (Math.abs(chienCible - chienX) < 1) {
        chienYOffset = 0;
        dessinerFrameChien("debout");
        // 40% : il repart aussitôt vers un nouveau point (vrai aller-retour)
        if (Math.random() < 0.4) {
          chienCible = 10 + Math.random() * (CHIEN_ZONE - 140);
          if (Math.abs(chienCible - chienX) < 60) {
            chienCible = (chienX > CHIEN_ZONE / 2) ? 10 : CHIEN_ZONE - 130;
          }
          chienDirection = (chienCible > chienX) ? 1 : -1;
        } else {
          chienReposAleatoire();
        }
      }

    } else if (chienEtat === "flaire" || chienEtat === "gratte" ||
               chienEtat === "aboie" || chienEtat === "reveille") {
      dessinerFrameChien(chienEtat);
      chienSousTimer--;
      if (chienSousTimer <= 0) {
        dessinerFrameChien("debout");
        chienReposAleatoire();
      }

    } else if (chienEtat === "couche") {
      dessinerFrameChien("couche");
      chienSousTimer--;
      if (chienSousTimer <= 0) {
        if (Math.random() < 0.5) {
          chienEtat = "dort";
          chienSousTimer = 500 + Math.floor(Math.random() * 500);
        } else {
          dessinerFrameChien("debout");
          chienReposAleatoire();
        }
      }

    } else if (chienEtat === "dort") {
      dessinerFrameChien("dort");
      if (chienCompteur % 90 === 0) creerZzzChien();
      chienSousTimer--;
      if (chienSousTimer <= 0) {
        dessinerFrameChien("reveille");
        chienEtat = "reveille";
        chienSousTimer = 40;
        afficherBulleChien("?");
      }

    } else if (chienEtat === "saute") {
      dessinerFrameChien("saute");
      // Arc de saut : monte puis redescend
      const progression = 1 - chienSousTimer / 40;
      chienYOffset = Math.sin(progression * Math.PI) * 30;
      chienSousTimer--;
      if (chienSousTimer <= 0) {
        chienYOffset = 0;
        dessinerFrameChien("debout");
        chienReposAleatoire();
      }

    } else if (chienEtat === "creuse") {
      dessinerFrameChien("creuse");
      // La terre vole : petits pixels marron éjectés depuis le museau
      if (chienCompteur % 9 === 0) {
        const museau = positionPageChien();
        if (museau) {
          creerPixelPhysique(museau.x, museau.y, "#a0714f");
          creerPixelPhysique(museau.x, museau.y, "#7a4f2e");
        }
      }
      chienSousTimer--;
      if (chienSousTimer <= 0) {
        dessinerFrameChien("debout");
        chienReposAleatoire();
      }
    }

    majChien();
  }

  function creerChien() {
    arreterChien();

    chienEl = document.createElement("div");
    chienEl.id = "chien-carnaval";

    chienMarionnetteEl = document.createElement("div");
    chienMarionnetteEl.className = "chien-marionnette";

    chienCorpsEl = document.createElement("canvas");
    chienCorpsEl.className = "chien-corps";
    chienCorpsEl.width = CHIEN_LARG * CHIEN_ECHELLE;
    chienCorpsEl.height = CHIEN_HAUT * CHIEN_ECHELLE;
    chienCtx = chienCorpsEl.getContext("2d");
    chienMarionnetteEl.appendChild(chienCorpsEl);
    chienEl.appendChild(chienMarionnetteEl);
    document.body.appendChild(chienEl);

    chienEtat = "idle";
    chienX = 30 + Math.random() * (CHIEN_ZONE - 170);
    chienYOffset = 0;
    chienDirection = 1;
    chienDerniereFrame = "";
    dessinerFrameChien("debout");
    chienReposAleatoire();
    majChien();

    // Cliquer sur le chien : s'il dort, il se réveille ; sinon il aboie
    chienCorpsEl.addEventListener("pointerdown", function () {
      if (chienEtat === "dort") {
        dessinerFrameChien("reveille");
        chienEtat = "reveille";
        chienSousTimer = 45;
        afficherBulleChien(" !");
      } else if (chienEtat !== "saute" && chienEtat !== "creuse" &&
                 chienEtat !== "reveille") {
        dessinerFrameChien("aboie");
        chienEtat = "aboie";
        chienSousTimer = 50;
        afficherBulleChien("wouf !");
      }
    });

    chienId = requestAnimationFrame(boucleChien);
  }

  function arreterChien() {
    if (chienId) { cancelAnimationFrame(chienId); chienId = null; }
    if (chienEl) { chienEl.remove(); chienEl = null; }
    chienMarionnetteEl = null;
    chienCorpsEl = null;
    chienCtx = null;
  }

  // Lancement initial
  afficher();
})();
</script>
</body>
</html>
